[package]
name = "event-sourcing-testbed"
version = "0.1.0"
edition = "2021"
description = "Rust benchmark and event-sourcing demo for KurrentDB + RabbitMQ + MongoDB + PostgreSQL"

[[bin]]
name = "testbed"
path = "src/main.rs"

[dependencies]
# ── KurrentDB gRPC client ───────────────────────────────────────────────
kurrentdb = "1"

# ── MongoDB async driver ───────────────────────────────────────────────────
mongodb = "3"

# ── PostgreSQL async driver (sqlx, runtime-tokio, no TLS for testbed) ────────
sqlx = { version = "0.8", features = [
    "postgres",
    "runtime-tokio",
    "uuid",
    "chrono",
    "json",
] }

# ── RabbitMQ AMQP 0-9-1 client ────────────────────────────────────────────
lapin = "2"

# ── Async runtime ─────────────────────────────────────────────────────────
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# ── Serialisation ─────────────────────────────────────────────────────────
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ── Unique IDs ────────────────────────────────────────────────────────────
uuid = { version = "1", features = ["v4"] }

# ── Timestamps ────────────────────────────────────────────────────────────
chrono = { version = "0.4", features = ["serde"] }

# ── Latency histograms (HDR, accurate across 7 orders of magnitude) ────────
hdrhistogram = "7"

# ── CLI ───────────────────────────────────────────────────────────────────
clap = { version = "4", features = ["derive", "env"] }

# ── Structured logging ────────────────────────────────────────────────────
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

anyhow = "1"
thiserror = "1"
rand = "0.8"
# ── Memcached client ──────────────────────────────────────────────────────────
# default-features = false drops the TLS/openssl dep; plain TCP is all we need.
memcache = { version = "0.17", default-features = false }
# ── Async trait support ───────────────────────────────────────────────────────
async-trait = "0.1"

# ── Async stream utilities ────────────────────────────────────────────────────
tokio-stream = { version = "0.1", features = ["sync"] }
# ── Prometheus metrics endpoint (exposed on :9090/metrics) ────────────────
prometheus = { version = "0.13", features = ["process"] }
axum = "0.7"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
