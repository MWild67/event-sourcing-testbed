name: Benchmark Report

# Runs whenever any of the three per-DB benchmark workflows completes.
# Downloads the latest successful artifact from each DB workflow and
# generates a combined cross-database summary.
#
# Cross-workflow artifact strategy:
#   Each DB workflow uploads a results.json artifact (kdb-results,
#   mdb-results, pg-results).  This report workflow uses the GitHub CLI to
#   find the most recent SUCCESSFUL run of each workflow and download its
#   artifact.  If a workflow has never run successfully, that column shows
#   "n/a".  The summary is therefore always "current state" — it fills in
#   as each DB workflow completes, and the most-recent invocation has all
#   three results.

on:
  workflow_run:
    workflows:
      - KurrentDB Benchmark
      - MongoDB Benchmark
      - PostgreSQL Benchmark
    types: [completed]
  workflow_dispatch:   # allow manual trigger

permissions:
  actions: read    # required to list workflow runs and download artifacts
  contents: read

jobs:
  report:
    name: Combined Benchmark Report
    runs-on: ubuntu-22.04
    steps:
      - name: Download latest results from each workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Download the most-recent SUCCESSFUL run artifact for a workflow.
          # Silently skips if no successful run exists yet.
          download_latest() {
            local wf="$1" art="$2" dest="$3"
            local run_id
            run_id=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${wf}/runs?status=success&per_page=1" \
              --jq '.workflow_runs[0].id' 2>/dev/null) || {
              echo "API call failed for ${wf} — skipping"
              return 0
            }
            if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
              echo "No successful runs found for ${wf} — will show n/a"
              return 0
            fi
            mkdir -p "$dest"
            echo "Downloading '${art}' from run ${run_id} of ${wf} ..."
            gh run download "$run_id" \
              --repo "$GITHUB_REPOSITORY" \
              --name "$art" \
              --dir "$dest" 2>/dev/null \
              && echo "  → OK" \
              || echo "  → artifact not found (run may have failed before upload)"
          }

          download_latest bench-kurrentdb.yml kdb-results ./kdb
          download_latest bench-mongodb.yml    mdb-results ./mdb
          download_latest bench-postgres.yml   pg-results  ./pg

      - name: Generate combined summary
        run: |
          python3 << 'PYEOF'
          import json, os
          
          def load(path):
              try:
                  return json.load(open(path))
              except Exception:
                  return {}
          
          kdb = load('./kdb/results.json')
          mdb = load('./mdb/results.json')
          pg  = load('./pg/results.json')
          
          def get(d, *keys):
              v = d
              for k in keys:
                  v = v.get(k, '') if isinstance(v, dict) else ''
              return str(v) if v else ''
          
          def fmt_ms(v):
              if not v:
                  return 'n/a'
              try:
                  return f'{int(v) / 1000:.2f}'
              except Exception:
                  return 'n/a'
          
          def fmt_v(v):
              return v if v else 'n/a'
          
          def fmt_result(v):
              if v == 'True':
                  return '✓ PASS'
              if v == 'False':
                  return '✗ FAIL'
              return 'n/a'
          
          BACKENDS = [
              (
                  'KurrentDB', kdb,
                  'In-memory (MEM_DB) — pure process memory',
                  'Docker (tmpfs · UNSAFE_DISABLE_FLUSH_TO_DISK)',
                  'Kubernetes k3d (emptyDir Memory · no flush)',
                  'Write — batched 500 ev/gRPC call',
                  'Replay — gRPC server-stream (1 protobuf msg/event)',
              ),
              (
                  'MongoDB', mdb,
                  None,
                  'Docker (tmpfs · j:true write concern)',
                  'Kubernetes k3d (emptyDir Memory · j:true)',
                  'Write — one insertOne() per event',
                  'Replay — bulk cursor (16 MB batch)',
              ),
              (
                  'PostgreSQL', pg,
                  None,
                  'Docker (tmpfs · fsync=off · synchronous_commit=on)',
                  'Kubernetes k3d (emptyDir Memory · fsync=off)',
                  'Write — one INSERT per event',
                  'Replay — single SELECT … ORDER BY stream_version',
              ),
          ]
          
          summary_path = os.environ.get('GITHUB_STEP_SUMMARY', '/dev/stdout')
          with open(summary_path, 'a') as f:
              f.write('## Benchmark Results\n\n')
              f.write(
                  '> **Benchmark conditions:** event-store mode · 10 k ev/s target · 30 s'
                  ' · 64 concurrent tasks · ubuntu-22.04 runner\n'
              )
              f.write(
                  '> **Rehydration conditions:** 50 000 events · single-stream sequential write'
                  ' then full replay from revision 0 · Docker\n\n'
              )
          
              for name, data, memdb_env, docker_env, k8s_env, rh_write_desc, rh_replay_desc in BACKENDS:
                  f.write(f'### {name}\n\n')
          
                  f.write('**Sustained Write Benchmark**\n\n')
                  f.write('| Environment | Rate (ev/s) | p50 (ms) | p95 (ms) | p99 (ms) | p99.9 (ms) |\n')
                  f.write('|-------------|------------:|:--------:|:--------:|:--------:|:----------:|\n')
                  if memdb_env:
                      f.write(
                          f'| {memdb_env} | {fmt_v(get(data, "bench_memdb", "rate"))} |'
                          f' {fmt_ms(get(data, "bench_memdb", "p50_us"))} |'
                          f' {fmt_ms(get(data, "bench_memdb", "p95_us"))} |'
                          f' {fmt_ms(get(data, "bench_memdb", "p99_us"))} |'
                          f' {fmt_ms(get(data, "bench_memdb", "p999_us"))} |\n'
                      )
                  f.write(
                      f'| {docker_env} | {fmt_v(get(data, "bench_docker", "rate"))} |'
                      f' {fmt_ms(get(data, "bench_docker", "p50_us"))} |'
                      f' {fmt_ms(get(data, "bench_docker", "p95_us"))} |'
                      f' {fmt_ms(get(data, "bench_docker", "p99_us"))} |'
                      f' {fmt_ms(get(data, "bench_docker", "p999_us"))} |\n'
                  )
                  f.write(
                      f'| {k8s_env} | {fmt_v(get(data, "bench_k8s", "rate"))} |'
                      f' {fmt_ms(get(data, "bench_k8s", "p50_us"))} |'
                      f' {fmt_ms(get(data, "bench_k8s", "p95_us"))} |'
                      f' {fmt_ms(get(data, "bench_k8s", "p99_us"))} |'
                      f' {fmt_ms(get(data, "bench_k8s", "p999_us"))} |\n'
                  )
          
                  f.write('\n**Rehydration / Replay (50 k events)**\n\n')
                  f.write('| Phase | Duration (ms) | Throughput (ev/s) | Result |\n')
                  f.write('|-------|-------------:|------------------:|:------:|\n')
                  f.write(
                      f'| {rh_write_desc} |'
                      f' {fmt_v(get(data, "rehydrate", "write_ms"))} |'
                      f' {fmt_v(get(data, "rehydrate", "write_rate"))} | |\n'
                  )
                  f.write(
                      f'| {rh_replay_desc} |'
                      f' {fmt_v(get(data, "rehydrate", "replay_ms"))} |'
                      f' {fmt_v(get(data, "rehydrate", "replay_rate"))} |'
                      f' {fmt_result(get(data, "rehydrate", "passed"))} |\n\n'
                  )
          
                  # Failover result — only KurrentDB carries this field
                  fo = get(data, "failover", "passed")
                  if fo:
                      f.write('**Node Failover (AC-3)**\n\n')
                      f.write('| Test | Result |\n')
                      f.write('|------|:------:|\n')
                      f.write(
                          f'| 3-node cluster · leader evicted · quorum restored ≤ 60 s |'
                          f' {fmt_result(fo)} |\n\n'
                      )
          
              f.write('---\n')
              f.write(
                  '_All backends use RAM (tmpfs/emptyDir). Numbers reflect protocol + semantic overhead,'
                  ' not production throughput._\n'
              )
              f.write(
                  '_K8s latency is higher than Docker due to the port-forward loopback tunnel._\n'
              )
              f.write(
                  '_KurrentDB replay streams one protobuf message per event over gRPC;'
                  ' SQL/document backends bulk-transfer rows per response — this is the root cause'
                  ' of the replay rate difference._\n'
              )
          PYEOF
