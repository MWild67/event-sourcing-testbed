name: event-sourcing-testbed — Performance Benchmark

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:   # allow manual trigger from GitHub UI

jobs:
  # ── Job 1: in-memory storage — tests gRPC API + write path throughput ──────
  bench-kurrentdb-memdb:
    name: KurrentDB — In-memory (MEM_DB)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install KurrentDB natively
        run: |
          curl -1sLf 'https://dl.cloudsmith.io/public/eventstore/kurrent-latest/setup.deb.sh' | sudo -E bash
          sudo apt-get install -y kurrentdb
          sudo systemctl stop kurrentdb || true
          getent passwd kurrentdb > /dev/null || sudo useradd --system --no-create-home --shell /usr/sbin/nologin kurrentdb
          sudo mkdir -p /tmp/esdb /tmp/esdb-log
          sudo chown kurrentdb:kurrentdb /tmp/esdb /tmp/esdb-log
          sudo mkdir -p /etc/systemd/system/kurrentdb.service.d
          printf '[Service]\nEnvironment="KURRENTDB_DB=/tmp/esdb"\nEnvironment="KURRENTDB_LOG=/tmp/esdb-log"\nEnvironment="KURRENTDB_INSECURE=true"\nEnvironment="KURRENTDB_RUN_PROJECTIONS=None"\nEnvironment="KURRENTDB_UNSAFE_DISABLE_FLUSH_TO_DISK=true"\nEnvironment="KURRENTDB_CLUSTER_SIZE=1"\nEnvironment="KURRENTDB_MEM_DB=true"\n' \
            | sudo tee /etc/systemd/system/kurrentdb.service.d/bench.conf
          sudo systemctl daemon-reload
          sudo systemctl start kurrentdb
          echo "Waiting for KurrentDB to be ready..."
          for i in $(seq 1 30); do
            curl -sf http://localhost:2113/health/live && break || sleep 2
          done
          ES_PID=$(systemctl show -p MainPID kurrentdb | cut -d= -f2)
          sudo renice -n -15 -p "$ES_PID"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-app/target
          key: event-sourcing-testbed-${{ runner.os }}-cargo-${{ hashFiles('rust-app/Cargo.lock') }}

      - name: Build benchmark binary
        run: cargo build --release --manifest-path rust-app/Cargo.toml

      - name: Run KurrentDB benchmark (in-memory)
        run: |
          rust-app/target/release/testbed \
            --kurrentdb-url "kurrentdb://localhost:2113?tls=false" \
            kurrentdb-bench \
            --target-rate 10000 \
            --concurrency 64 \
            --batch-size 1 \
            --duration-secs 30

  # ── Job 2: real storage on tmpfs, fsync off — tests full write pipeline ─────
  bench-kurrentdb:
    name: KurrentDB — Docker (tmpfs, fsync off)
    runs-on: ubuntu-22.04
    outputs:
      rate:    ${{ steps.bench.outputs.rate }}
      p50_us:  ${{ steps.bench.outputs.p50_us }}
      p95_us:  ${{ steps.bench.outputs.p95_us }}
      p99_us:  ${{ steps.bench.outputs.p99_us }}
      p999_us: ${{ steps.bench.outputs.p999_us }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install KurrentDB natively
        run: |
          curl -1sLf 'https://dl.cloudsmith.io/public/eventstore/kurrent-latest/setup.deb.sh' | sudo -E bash
          sudo apt-get install -y kurrentdb
          sudo systemctl stop kurrentdb || true
          getent passwd kurrentdb > /dev/null || sudo useradd --system --no-create-home --shell /usr/sbin/nologin kurrentdb
          sudo mkdir -p /tmp/esdb /tmp/esdb-log
          sudo mount -t tmpfs -o size=512m tmpfs /tmp/esdb
          sudo chown kurrentdb:kurrentdb /tmp/esdb /tmp/esdb-log
          sudo mkdir -p /etc/systemd/system/kurrentdb.service.d
          printf '[Service]\nEnvironment="KURRENTDB_DB=/tmp/esdb"\nEnvironment="KURRENTDB_LOG=/tmp/esdb-log"\nEnvironment="KURRENTDB_INSECURE=true"\nEnvironment="KURRENTDB_RUN_PROJECTIONS=None"\nEnvironment="KURRENTDB_UNSAFE_DISABLE_FLUSH_TO_DISK=true"\nEnvironment="KURRENTDB_CLUSTER_SIZE=1"\n' \
            | sudo tee /etc/systemd/system/kurrentdb.service.d/bench.conf
          sudo systemctl daemon-reload
          sudo systemctl start kurrentdb
          echo "Waiting for KurrentDB to be ready..."
          for i in $(seq 1 30); do
            curl -sf http://localhost:2113/health/live && break || sleep 2
          done
          ES_PID=$(systemctl show -p MainPID kurrentdb | cut -d= -f2)
          sudo renice -n -15 -p "$ES_PID"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-app/target
          key: event-sourcing-testbed-${{ runner.os }}-cargo-${{ hashFiles('rust-app/Cargo.lock') }}

      - name: Build benchmark binary
        run: cargo build --release --manifest-path rust-app/Cargo.toml

      - name: Run KurrentDB benchmark (Docker, tmpfs)
        id: bench
        run: |
          RESULT=$(rust-app/target/release/testbed \
            --kurrentdb-url "kurrentdb://localhost:2113?tls=false" \
            kurrentdb-bench \
            --target-rate 10000 \
            --concurrency 64 \
            --batch-size 1 \
            --duration-secs 30 \
            --json)
          echo "$RESULT"
          echo "rate=$(echo "$RESULT"    | python3 -c "import sys,json; d=json.load(sys.stdin); print(round(d['actual_rate_eps'],1))")"
          echo "rate=$(echo "$RESULT"    | python3 -c "import sys,json; d=json.load(sys.stdin); print(round(d['actual_rate_eps'],1))")" >> "$GITHUB_OUTPUT"
          echo "p50_us=$(echo "$RESULT"  | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['p50_us'])")"  >> "$GITHUB_OUTPUT"
          echo "p95_us=$(echo "$RESULT"  | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['p95_us'])")"  >> "$GITHUB_OUTPUT"
          echo "p99_us=$(echo "$RESULT"  | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['p99_us'])")"  >> "$GITHUB_OUTPUT"
          echo "p999_us=$(echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['p999_us'])")" >> "$GITHUB_OUTPUT"

  # ── Job 3: Kubernetes 3-node cluster — real quorum writes + real disk ───────
  bench-kurrentdb-k8s:
    name: KurrentDB — Kubernetes (3-node cluster)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install k3d
        run: curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | TAG=v5.8.3 bash

      - name: Create k3d cluster (1 server + 3 agents)
        run: |
          k3d cluster create testbed \
            --agents 3 \
            --wait \
            --timeout 120s

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-app/target
          key: event-sourcing-testbed-${{ runner.os }}-cargo-${{ hashFiles('rust-app/Cargo.lock') }}

      - name: Build benchmark binary
        run: cargo build --release --manifest-path rust-app/Cargo.toml

      - name: Pre-pull KurrentDB image into k3d
        run: |
          docker pull kurrentplatform/kurrentdb:latest
          k3d image import kurrentplatform/kurrentdb:latest -c testbed

      - name: Deploy Kubernetes manifests
        run: |
          kubectl apply -f k8s/00-namespace.yaml
          kubectl apply -f k8s/01-storageclass.yaml
          kubectl apply -f k8s/02-kurrentdb/

      - name: Wait for KurrentDB cluster to be ready
        run: |
          kubectl rollout status statefulset/kurrentdb \
            -n event-store \
            --timeout=600s

      - name: Dump pod diagnostics on failure
        if: failure()
        run: |
          kubectl cluster-info 2>/dev/null || {
            echo "No k8s cluster reachable — skipping pod diagnostics"
            exit 0
          }
          echo "=== Pod status ==="
          kubectl get pods -n event-store -o wide || true
          echo "=== PVC status ==="
          kubectl get pvc -n event-store || true
          echo "=== Events ==="
          kubectl get events -n event-store --sort-by='.lastTimestamp' 2>/dev/null | tail -40 || true
          echo "=== Pod descriptions ==="
          kubectl describe pods -n event-store || true
          echo "=== Logs (last 50 lines per pod) ==="
          for pod in $(kubectl get pods -n event-store -o name 2>/dev/null); do
            echo "--- $pod ---"
            kubectl logs "$pod" -n event-store --tail=50 2>&1 || true
          done

      - name: Run KurrentDB benchmark (Kubernetes, 3-node cluster)
        run: |
          kubectl port-forward -n event-store pod/kurrentdb-0 19999:2113 &
          PF_GOSSIP=$!
          sleep 3
          LEADER_IP=$(curl -sf http://localhost:19999/gossip | jq -r '.members[] | select(.state == "Leader") | .httpEndPointIp')
          kill $PF_GOSSIP 2>/dev/null || true
          echo "Leader IP: $LEADER_IP"
          LEADER_POD=$(kubectl get pods -n event-store -l app=kurrentdb -o json | jq -r --arg ip "$LEADER_IP" '.items[] | select(.status.podIP == $ip) | .metadata.name')
          echo "Leader pod: $LEADER_POD"
          test -n "$LEADER_POD"
          kubectl port-forward -n event-store "pod/$LEADER_POD" 2113:2113 &
          PF_PID=$!
          sleep 3
          rust-app/target/release/testbed \
            --kurrentdb-url "kurrentdb://localhost:2113?tls=false" \
            kurrentdb-bench \
            --target-rate 10000 \
            --duration-secs 30 \
            --concurrency 50 \
            --batch-size 1
          kill $PF_PID 2>/dev/null || true

  # ── Job 4: MongoDB — in-memory tmpfs, single node ─────────────────────────
  bench-mongodb:
    name: MongoDB — Docker (tmpfs)
    runs-on: ubuntu-22.04
    outputs:
      rate:    ${{ steps.bench.outputs.rate }}
      p50_us:  ${{ steps.bench.outputs.p50_us }}
      p95_us:  ${{ steps.bench.outputs.p95_us }}
      p99_us:  ${{ steps.bench.outputs.p99_us }}
      p999_us: ${{ steps.bench.outputs.p999_us }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start MongoDB on tmpfs
        run: |
          # 2 GB tmpfs: 64 collections × data+index files + WiredTiger journal
          # easily exceed 512 MB once eviction starts flushing dirty pages.
          # Cache is kept at 0.25 GB (pure RAM) — sufficient for a 30-second run.
          # MongoDB 4.0+ (WiredTiger) always journals; no --journal flag needed.
          # The j:true write concern in the Rust client enforces fsync per-write.
          sudo mkdir -p /tmp/mongodb
          sudo mount -t tmpfs -o size=2g tmpfs /tmp/mongodb
          docker run -d \
            --name mongodb \
            -p 27017:27017 \
            --tmpfs /data/db \
            mongo:7 \
            mongod --quiet --bind_ip_all --replSet rs0 --wiredTigerCacheSizeGB 0.25
          echo "Waiting for MongoDB to be ready..."
          for i in $(seq 1 30); do
            docker exec mongodb mongosh --quiet --eval "db.adminCommand('ping').ok" \
              mongodb://localhost:27017/admin 2>/dev/null && break || sleep 2
          done
          docker exec mongodb mongosh --quiet --eval "db.adminCommand('ping').ok" \
            mongodb://localhost:27017/admin || { echo "MongoDB failed to start"; docker logs mongodb --tail 20; exit 1; }

      - name: Initialise MongoDB replica set
        run: |
          docker exec mongodb mongosh --quiet --eval "rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]})"
          echo "Waiting for RS primary..."
          for i in $(seq 1 20); do
            docker exec mongodb mongosh --quiet --eval \
              "if (rs.isMaster().ismaster !== true) { throw 'no primary'; }" \
              2>/dev/null && echo "RS primary ready" && break
            echo "  attempt $i/20 — waiting 3 s..."
            sleep 3
          done

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-app/target
          key: event-sourcing-testbed-${{ runner.os }}-cargo-${{ hashFiles('rust-app/Cargo.lock') }}

      - name: Build benchmark binary
        run: cargo build --release --manifest-path rust-app/Cargo.toml

      - name: Run MongoDB benchmark (Docker, event-store mode)
        id: bench
        run: |
          RESULT=$(rust-app/target/release/testbed \
            --mongodb-url "mongodb://localhost:27017" \
            mongo-bench \
            --target-rate 10000 \
            --concurrency 64 \
            --batch-size 1 \
            --duration-secs 30 \
            --event-store-mode \
            --json)
          echo "$RESULT"
          echo "rate=$(echo "$RESULT"    | python3 -c "import sys,json; d=json.load(sys.stdin); print(round(d['actual_rate_eps'],1))")"
          echo "rate=$(echo "$RESULT"    | python3 -c "import sys,json; d=json.load(sys.stdin); print(round(d['actual_rate_eps'],1))")" >> "$GITHUB_OUTPUT"
          echo "p50_us=$(echo "$RESULT"  | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['p50_us'])")"  >> "$GITHUB_OUTPUT"
          echo "p95_us=$(echo "$RESULT"  | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['p95_us'])")"  >> "$GITHUB_OUTPUT"
          echo "p99_us=$(echo "$RESULT"  | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['p99_us'])")"  >> "$GITHUB_OUTPUT"
          echo "p999_us=$(echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['p999_us'])")" >> "$GITHUB_OUTPUT"

      - name: Validate MongoDB event-store features
        run: |
          rust-app/target/release/testbed \
            --mongodb-url "mongodb://localhost:27017/?replicaSet=rs0" \
            mongo-event-store-demo \
            --database eventstoredemo \
            --events 5

      - name: Dump MongoDB logs on failure
        if: failure()
        run: docker logs mongodb --tail 50 || true

  # ── Job 5: MongoDB — single-node replica set on Kubernetes (k3d) ──────────
  #
  # Mirrors bench-k8s but targets the MongoDB event-store scenario.
  # Runs both the write-latency benchmark (event-store mode) and the
  # mongo-event-store-demo command so all 8 event-sourcing properties are
  # exercised against a real k8s-hosted MongoDB with WiredTiger on-disk
  # journaling.
  bench-mongodb-k8s:
    name: MongoDB — Kubernetes (single-node replica set)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install k3d
        run: curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | TAG=v5.8.3 bash

      - name: Create k3d cluster (1 server + 1 agent)
        run: |
          k3d cluster create testbed \
            --agents 1 \
            --wait \
            --timeout 120s

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-app/target
          key: event-sourcing-testbed-${{ runner.os }}-cargo-${{ hashFiles('rust-app/Cargo.lock') }}

      - name: Build benchmark binary
        run: cargo build --release --manifest-path rust-app/Cargo.toml

      - name: Pre-pull MongoDB image into k3d
        run: |
          docker pull mongo:7
          k3d image import mongo:7 -c testbed

      - name: Deploy Kubernetes manifests
        run: |
          kubectl apply -f k8s/00-namespace.yaml
          kubectl apply -f k8s/01-storageclass.yaml
          kubectl apply -f k8s/05-mongodb/

      - name: Wait for MongoDB to be ready
        run: |
          kubectl rollout status statefulset/mongodb \
            -n event-store \
            --timeout=300s
          # Extra gate: wait until the RS primary is stable and the Rust driver
          # can discover it via the replicaSet URI parameter.  rollout status
          # only waits for the readiness probe to pass once; primary election
          # may still be settling when the next step opens a connection.
          echo "Waiting for RS primary to stabilise..."
          for i in $(seq 1 24); do
            kubectl exec -n event-store mongodb-0 -- \
              mongosh --quiet mongodb://127.0.0.1:27017/admin \
              --eval "if (rs.isMaster().ismaster !== true) { throw 'no primary'; }" \
              2>/dev/null && echo "RS primary is ready" && break
            echo "  attempt $i/24 — waiting 5 s..."
            sleep 5
          done

      - name: Dump pod diagnostics on failure
        if: failure()
        run: |
          # Bail out cleanly if the k3d cluster was never created (e.g. build
          # step failed before kubectl had a valid context).
          kubectl cluster-info 2>/dev/null || {
            echo "No k8s cluster reachable — skipping pod diagnostics"
            exit 0
          }
          echo "=== Pod status ==="
          kubectl get pods -n event-store -o wide || true
          echo "=== PVC status ==="
          kubectl get pvc -n event-store || true
          echo "=== Events ==="
          kubectl get events -n event-store --sort-by='.lastTimestamp' 2>/dev/null | tail -40 || true
          echo "=== Pod descriptions ==="
          kubectl describe pods -n event-store || true
          echo "=== Logs (last 50 lines per pod) ==="
          for pod in $(kubectl get pods -n event-store -o name 2>/dev/null); do
            echo "--- $pod ---"
            kubectl logs "$pod" -n event-store --tail=50 2>&1 || true
          done

      - name: Port-forward MongoDB
        run: |
          kubectl port-forward -n event-store pod/mongodb-0 27017:27017 &
          echo "PF_PID=$!" >> "$GITHUB_ENV"
          # Give the tunnel a moment to establish before writes begin.
          sleep 3

      - name: Run MongoDB benchmark (Kubernetes, event-store mode)
        run: |
          rust-app/target/release/testbed \
            --mongodb-url "mongodb://localhost:27017" \
            mongo-bench \
            --target-rate 10000 \
            --concurrency 64 \
            --batch-size 1 \
            --duration-secs 30 \
            --event-store-mode

      - name: Validate MongoDB event-store features
        run: |
          rust-app/target/release/testbed \
            --mongodb-url "mongodb://localhost:27017/?replicaSet=rs0" \
            mongo-event-store-demo \
            --database eventstoredemo \
            --events 5

      - name: Stop port-forward
        if: always()
        run: kill "$PF_PID" 2>/dev/null || true

  # ── Job 6: PostgreSQL — standalone Docker ─────────────────────────────────
  bench-postgres:
    name: PostgreSQL — Docker (tmpfs)
    runs-on: ubuntu-22.04
    outputs:
      rate:    ${{ steps.bench.outputs.rate }}
      p50_us:  ${{ steps.bench.outputs.p50_us }}
      p95_us:  ${{ steps.bench.outputs.p95_us }}
      p99_us:  ${{ steps.bench.outputs.p99_us }}
      p999_us: ${{ steps.bench.outputs.p999_us }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry + build artefacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-app/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-app/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build release binary
        run: cargo build --release --manifest-path rust-app/Cargo.toml

      - name: Start PostgreSQL container
        run: |
          docker run -d --name pg \
            -e POSTGRES_DB=eventbench \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -p 5432:5432 \
            --tmpfs /var/lib/postgresql/data \
            postgres:16 \
            -c fsync=off \
            -c full_page_writes=off \
            -c max_connections=200

      - name: Wait for PostgreSQL to be ready
        run: |
          for i in $(seq 1 30); do
            docker exec pg pg_isready -U postgres -d eventbench && break
            echo "Attempt $i/30: waiting for PostgreSQL..."
            sleep 2
          done
          docker exec pg pg_isready -U postgres -d eventbench

      - name: Run PostgreSQL benchmark (Docker, event-store mode)
        id: bench
        run: |
          RESULT=$(rust-app/target/release/testbed \
            --postgres-url "postgres://postgres:postgres@localhost:5432/eventbench" \
            pg-bench \
            --target-rate 10000 \
            --concurrency 64 \
            --batch-size 1 \
            --duration-secs 30 \
            --event-store-mode \
            --json)
          echo "$RESULT"
          echo "rate=$(echo "$RESULT"    | python3 -c "import sys,json; d=json.load(sys.stdin); print(round(d['actual_rate_eps'],1))")"
          echo "rate=$(echo "$RESULT"    | python3 -c "import sys,json; d=json.load(sys.stdin); print(round(d['actual_rate_eps'],1))")" >> "$GITHUB_OUTPUT"
          echo "p50_us=$(echo "$RESULT"  | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['p50_us'])")"  >> "$GITHUB_OUTPUT"
          echo "p95_us=$(echo "$RESULT"  | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['p95_us'])")"  >> "$GITHUB_OUTPUT"
          echo "p99_us=$(echo "$RESULT"  | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['p99_us'])")"  >> "$GITHUB_OUTPUT"
          echo "p999_us=$(echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['p999_us'])")" >> "$GITHUB_OUTPUT"

      - name: Validate PostgreSQL event-store features
        run: |
          rust-app/target/release/testbed \
            --postgres-url "postgres://postgres:postgres@localhost:5432/eventbench" \
            pg-event-store-demo \
            --events 5

      - name: Stop PostgreSQL container
        if: always()
        run: docker stop pg && docker rm pg || true

  # ── Job 7: PostgreSQL — Kubernetes (single-node) ────────────────────────
  bench-postgres-k8s:
    name: PostgreSQL — Kubernetes (single-node)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry + build artefacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-app/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-app/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build release binary
        run: cargo build --release --manifest-path rust-app/Cargo.toml

      - name: Install k3d + kubectl
        run: |
          curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | TAG=v5.8.3 bash
          curl -LO "https://dl.k8s.io/release/$(curl -sSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/

      - name: Create k3d cluster
        run: |
          k3d cluster create bench \
            --servers 1 \
            --agents 1 \
            --no-lb \
            --wait

      - name: Pre-pull postgres:16 image into k3d
        run: |
          docker pull postgres:16
          k3d image import postgres:16 -c bench

      - name: Deploy PostgreSQL into Kubernetes
        run: |
          kubectl apply -f k8s/00-namespace.yaml
          kubectl apply -f k8s/01-storageclass.yaml
          kubectl apply -f k8s/06-postgres/

      - name: Wait for PostgreSQL StatefulSet rollout
        run: kubectl rollout status statefulset/postgres -n event-store --timeout=300s

      - name: Wait for PostgreSQL to accept connections
        run: |
          for i in $(seq 1 40); do
            kubectl exec -n event-store postgres-0 -- \
              pg_isready -U postgres -d eventbench 2>/dev/null && break
            echo "Attempt $i/40: waiting for pg_isready..."
            sleep 5
          done
          kubectl exec -n event-store postgres-0 -- \
            pg_isready -U postgres -d eventbench

      - name: Port-forward PostgreSQL
        run: |
          kubectl port-forward -n event-store pod/postgres-0 5432:5432 &
          echo "PF_PID=$!" >> "$GITHUB_ENV"
          sleep 3

      - name: Run PostgreSQL benchmark (Kubernetes, event-store mode)
        run: |
          rust-app/target/release/testbed \
            --postgres-url "postgres://postgres:postgres@localhost:5432/eventbench" \
            pg-bench \
            --target-rate 5000 \
            --concurrency 32 \
            --batch-size 1 \
            --duration-secs 20 \
            --event-store-mode

      - name: Validate PostgreSQL event-store features
        run: |
          rust-app/target/release/testbed \
            --postgres-url "postgres://postgres:postgres@localhost:5432/eventbench" \
            pg-event-store-demo \
            --events 5

      - name: Stop port-forward
        if: always()
        run: kill "$PF_PID" 2>/dev/null || true

      - name: Cluster diagnostics (on failure)
        if: failure()
        run: |
          kubectl cluster-info 2>/dev/null || { echo "No k8s cluster reachable"; exit 0; }
          kubectl get pods -n event-store || true
          kubectl describe statefulset/postgres -n event-store || true
          kubectl logs statefulset/postgres -n event-store --tail=50 || true

  # ── Report: side-by-side comparison of the three Docker backends ───────────
  report:
    name: Benchmark Comparison Summary
    runs-on: ubuntu-22.04
    if: always()
    needs: [bench-kurrentdb, bench-mongodb, bench-postgres]

    steps:
      - name: Write comparison table to job summary
        env:
          KDB_RATE:    ${{ needs.bench-kurrentdb.outputs.rate }}
          KDB_P50:     ${{ needs.bench-kurrentdb.outputs.p50_us }}
          KDB_P95:     ${{ needs.bench-kurrentdb.outputs.p95_us }}
          KDB_P99:     ${{ needs.bench-kurrentdb.outputs.p99_us }}
          KDB_P999:    ${{ needs.bench-kurrentdb.outputs.p999_us }}
          MDB_RATE:    ${{ needs.bench-mongodb.outputs.rate }}
          MDB_P50:     ${{ needs.bench-mongodb.outputs.p50_us }}
          MDB_P95:     ${{ needs.bench-mongodb.outputs.p95_us }}
          MDB_P99:     ${{ needs.bench-mongodb.outputs.p99_us }}
          MDB_P999:    ${{ needs.bench-mongodb.outputs.p999_us }}
          PG_RATE:     ${{ needs.bench-postgres.outputs.rate }}
          PG_P50:      ${{ needs.bench-postgres.outputs.p50_us }}
          PG_P95:      ${{ needs.bench-postgres.outputs.p95_us }}
          PG_P99:      ${{ needs.bench-postgres.outputs.p99_us }}
          PG_P999:     ${{ needs.bench-postgres.outputs.p999_us }}
        run: |
          # Convert microseconds to ms string; emit "n/a" when the value is empty
          # (happens when a bench job was skipped or failed).
          fmt_ms()   { [ -n "$1" ] && awk "BEGIN{printf \"%.2f\", $1/1000}" || echo "n/a"; }
          fmt_rate() { [ -n "$1" ] && echo "$1"                             || echo "n/a"; }

          {
            echo "## Docker Benchmark Comparison"
            echo ""
            echo "> **Conditions:** event-store mode · 10 k ev/s target · 30 s · 64 concurrent tasks · ubuntu-22.04 runner"
            echo "> **Durability level:** OS-buffer write, no fsync (all three backends equivalent)"
            echo ""
            echo "| Backend | Storage / flags | Rate (ev/s) | p50 (ms) | p95 (ms) | p99 (ms) | p99.9 (ms) |"
            echo "|---------|-----------------|------------:|:--------:|:--------:|:--------:|:----------:|"
            printf "| **KurrentDB** | tmpfs + UNSAFE_DISABLE_FLUSH_TO_DISK=true | %s | %s | %s | %s | %s |\n" \
              "$(fmt_rate "$KDB_RATE")" "$(fmt_ms "$KDB_P50")" "$(fmt_ms "$KDB_P95")" "$(fmt_ms "$KDB_P99")" "$(fmt_ms "$KDB_P999")"
            printf "| **MongoDB** | tmpfs + j:true write concern | %s | %s | %s | %s | %s |\n" \
              "$(fmt_rate "$MDB_RATE")" "$(fmt_ms "$MDB_P50")" "$(fmt_ms "$MDB_P95")" "$(fmt_ms "$MDB_P99")" "$(fmt_ms "$MDB_P999")"
            printf "| **PostgreSQL** | tmpfs + fsync=off + synchronous_commit=on | %s | %s | %s | %s | %s |\n" \
              "$(fmt_rate "$PG_RATE")" "$(fmt_ms "$PG_P50")" "$(fmt_ms "$PG_P95")" "$(fmt_ms "$PG_P99")" "$(fmt_ms "$PG_P999")"
            echo ""
            echo "_Lower latency and higher rate is better._"
            echo "_All backends write to tmpfs (RAM). Numbers reflect protocol + semantic overhead only, not production throughput._"
          } >> "$GITHUB_STEP_SUMMARY"
