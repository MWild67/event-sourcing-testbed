  # ════════════════════════════════════════════════════════════════════════════
  # Monitoring Integration
  #   Deploys all three backends (KurrentDB, MongoDB, PostgreSQL) plus the full
  #   monitoring stack (Prometheus, Grafana, node-exporter, exporters) into a
  #   k3d cluster and runs tests/04-monitoring-check.sh to assert that:
  #     • Prometheus has active scrape targets for all five jobs
  #     • All nine metric families return data
  #     • Grafana serves the Event Store dashboard
  # ════════════════════════════════════════════════════════════════════════════

  monitoring-check:
    name: "Monitoring: KurrentDB + MongoDB + PostgreSQL"
    runs-on: ubuntu-22.04
    if: github.event_name != 'workflow_dispatch' || inputs.job == '' || inputs.job == 'monitoring-check'
    timeout-minutes: 25
    outputs:
      passed: ${{ steps.check.outputs.passed }}
    steps:
      - uses: actions/checkout@v6

      - name: Install k3d
        run: curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | TAG=v5.8.3 bash

      - name: Create k3d cluster (1 server + 2 agents — DaemonSet needs ≥2 worker nodes)
        run: |
          k3d cluster create monitoring-check --servers 1 --agents 2 --wait --timeout 120s
          kubectl get nodes -o wide

      - name: Pre-pull KurrentDB image
        run: |
          docker pull kurrentplatform/kurrentdb:latest
          k3d image import kurrentplatform/kurrentdb:latest -c monitoring-check

      - name: Deploy namespace
        run: kubectl apply -f k8s/00-namespace.yaml

      - name: Deploy KurrentDB (single-node, MEM_DB)
        run: |
          kubectl apply -f k8s/02-kurrentdb/01-services.yaml
          kubectl apply -f - <<'EOF'
          apiVersion: apps/v1
          kind: StatefulSet
          metadata:
            name: kurrentdb
            namespace: event-store
          spec:
            serviceName: kurrentdb-headless
            replicas: 1
            selector:
              matchLabels:
                app: kurrentdb
            template:
              metadata:
                labels:
                  app: kurrentdb
              spec:
                enableServiceLinks: false
                terminationGracePeriodSeconds: 10
                containers:
                  - name: kurrentdb
                    image: kurrentplatform/kurrentdb:latest
                    imagePullPolicy: IfNotPresent
                    ports:
                      - {name: http, containerPort: 2113}
                      - {name: grpc, containerPort: 2114}
                    env:
                      - {name: KURRENTDB_CLUSTER_SIZE,                 value: "1"}
                      - {name: KURRENTDB_INSECURE,                     value: "true"}
                      - {name: KURRENTDB_RUN_PROJECTIONS,              value: "None"}
                      - {name: KURRENTDB_UNSAFE_DISABLE_FLUSH_TO_DISK, value: "true"}
                      - {name: KURRENTDB_MEM_DB,                       value: "true"}
                    readinessProbe:
                      httpGet: {path: /health/live, port: 2113}
                      initialDelaySeconds: 10
                      periodSeconds: 5
                      failureThreshold: 6
                    resources:
                      requests: {cpu: "200m", memory: "256Mi"}
                      limits:   {cpu: "1",    memory: "1Gi"}
                    volumeMounts:
                      - {name: data, mountPath: /data}
                volumes:
                  - name: data
                    emptyDir: {medium: Memory, sizeLimit: 256Mi}
          EOF

      - name: Deploy RabbitMQ (single-node, prometheus plugin enabled)
        run: |
          kubectl apply -f - <<'EOF'
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: rabbitmq-plugins
            namespace: event-store
          data:
            enabled_plugins: "[rabbitmq_management,rabbitmq_prometheus]."
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: rabbitmq
            namespace: event-store
            labels:
              app: rabbitmq
          spec:
            selector:
              app: rabbitmq
            ports:
              - {name: amqp,       port: 5672,  targetPort: 5672}
              - {name: management, port: 15672, targetPort: 15672}
              - {name: metrics,    port: 15692, targetPort: 15692}
          ---
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: rabbitmq
            namespace: event-store
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: rabbitmq
            template:
              metadata:
                labels:
                  app: rabbitmq
                annotations:
                  prometheus.io/scrape: "true"
                  prometheus.io/port: "15692"
                  prometheus.io/path: "/metrics"
              spec:
                containers:
                  - name: rabbitmq
                    image: rabbitmq:3.13-management
                    imagePullPolicy: IfNotPresent
                    ports:
                      - {name: amqp,       containerPort: 5672}
                      - {name: management, containerPort: 15672}
                      - {name: metrics,    containerPort: 15692}
                    env:
                      - name: RABBITMQ_ENABLED_PLUGINS_FILE
                        value: /etc/rabbitmq-plugins/enabled_plugins
                    volumeMounts:
                      - name: plugins
                        mountPath: /etc/rabbitmq-plugins
                    readinessProbe:
                      exec:
                        command: [rabbitmq-diagnostics, -q, ping]
                      initialDelaySeconds: 30
                      periodSeconds: 5
                      failureThreshold: 12
                    resources:
                      requests: {cpu: "100m", memory: "256Mi"}
                      limits:   {cpu: "1",    memory: "512Mi"}
                volumes:
                  - name: plugins
                    configMap:
                      name: rabbitmq-plugins
          EOF

      - name: Deploy monitoring stack (Prometheus, Grafana, node-exporter)
        run: kubectl apply -f k8s/04-monitoring/

      - name: Deploy MongoDB with exporter sidecar
        run: kubectl apply -f k8s/05-mongodb/

      - name: Deploy PostgreSQL with exporter sidecar
        run: kubectl apply -f k8s/06-postgres/

      - name: Wait for all components ready
        run: |
          kubectl rollout status statefulset/kurrentdb  -n event-store --timeout=180s
          kubectl rollout status deployment/rabbitmq    -n event-store --timeout=180s
          kubectl rollout status statefulset/mongodb    -n event-store --timeout=180s
          kubectl rollout status statefulset/postgres   -n event-store --timeout=180s
          kubectl rollout status deployment/prometheus  -n event-store --timeout=120s
          kubectl rollout status deployment/grafana     -n event-store --timeout=120s
          kubectl get pods -n event-store -o wide

      - name: Wait for Prometheus to complete two scrape intervals (30 s each)
        run: sleep 65

      - name: Run monitoring integration check
        id: check
        run: |
          chmod +x tests/04-monitoring-check.sh
          if bash tests/04-monitoring-check.sh | tee monitoring-check.log; then
            echo "passed=True" >> "$GITHUB_OUTPUT"
            printf '{"passed":true,"targets_checked":["node-exporter","kurrentdb","rabbitmq","mongodb","postgres"],"grafana_ok":true}\n' \
              > monitoring-check.json
          else
            echo "passed=False" >> "$GITHUB_OUTPUT"
            printf '{"passed":false,"targets_checked":[],"grafana_ok":false}\n' \
              > monitoring-check.json
            exit 1
          fi

      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: monitoring-check-result
          path: monitoring-check.json
          if-no-files-found: warn

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          kubectl get nodes -o wide || true
          kubectl get pods -n event-store -o wide || true
          kubectl get events -n event-store --sort-by='.lastTimestamp' 2>/dev/null | tail -60 || true
          kubectl describe pods -n event-store || true
          for pod in $(kubectl get pods -n event-store -o name 2>/dev/null); do
            echo "=== logs: $pod ==="
            kubectl logs "$pod" -n event-store --tail=40 --all-containers 2>&1 || true
          done

  # ════════════════════════════════════════════════════════════════════════════
  # Combined Report — runs once, after all bench jobs complete
  # ════════════════════════════════════════════════════════════════════════════

  report:
    name: Benchmark Report
    runs-on: ubuntu-22.04
    if: always() && (github.event_name != 'workflow_dispatch' || inputs.job == '')
    permissions:
      actions: read
      contents: read
    needs:
      - kdb-memdb
      - kdb-docker
      - kdb-k8s
      - kdb-rehydrate
      - kdb-failover
      - kdb-failover-impact
      - kdb-rate-ramp
      - kdb-replay-under-write
      - kdb-hot-stream-contention
      - kdb-hot-cold-view
      - kdb-hot-cache
      - kdb-memcached
      - mdb-docker
      - mdb-k8s
      - mdb-rehydrate
      - mdb-rate-ramp
      - mdb-replay-under-write
      - mdb-hot-stream-contention
      - mdb-memcached
      - pg-docker
      - pg-k8s
      - pg-rehydrate
      - pg-rate-ramp
      - pg-replay-under-write
      - pg-hot-stream-contention
      - pg-memcached
      - monitoring-check
      - payload-batch-sensitivity
    steps:
      - name: Download benchmark and ramp artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! command -v gh >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y gh
          fi

          mkdir -p bench-artifacts
          rm -rf bench-artifacts/*

          # Artifact indexing can lag a little; retry listing a few times.
          ARTIFACT_NAMES=""
          for attempt in 1 2 3 4 5 6; do
            ARTIFACT_NAMES=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
              --jq '.artifacts[] | select(.expired==false) | .name' | sort -u || true)
            if [ -n "${ARTIFACT_NAMES}" ]; then
              break
            fi
            echo "No artifacts indexed yet (attempt ${attempt}/6); retrying in 10s..."
            sleep 10
          done

          if [ -z "${ARTIFACT_NAMES}" ]; then
            echo "No non-expired artifacts found for this run."
          else
            echo "Artifacts discovered:"
            printf '%s\n' "${ARTIFACT_NAMES}"

            while IFS= read -r artifact; do
              [ -n "${artifact}" ] || continue
              ok=0
              for dl_try in 1 2 3; do
                if gh run download "${GITHUB_RUN_ID}" \
                  --repo "${GITHUB_REPOSITORY}" \
                  --name "${artifact}" \
                  --dir "bench-artifacts/${artifact}"; then
                  ok=1
                  break
                fi
                echo "Download failed for ${artifact} (attempt ${dl_try}/3), retrying..."
                sleep 3
              done
              if [ "${ok}" -ne 1 ]; then
                echo "Failed to download artifact: ${artifact}"
                exit 1
              fi
            done <<< "${ARTIFACT_NAMES}"
          fi

          echo "Downloaded files:"
          find bench-artifacts -type f | sort || true

          JSON_COUNT=$(find bench-artifacts -type f -name '*.json' | wc -l | tr -d ' ')
          echo "Downloaded JSON count: ${JSON_COUNT}"
          if [ "${JSON_COUNT}" -eq 0 ]; then
            echo "No JSON artifacts were downloaded; failing report early."
            exit 1
          fi

      - name: Generate combined summary
        env:
          KDB_MEMDB_RATE:    ${{ needs.kdb-memdb.outputs.rate }}
          KDB_MEMDB_P50:     ${{ needs.kdb-memdb.outputs.p50_us }}
          KDB_MEMDB_P95:     ${{ needs.kdb-memdb.outputs.p95_us }}
          KDB_MEMDB_P99:     ${{ needs.kdb-memdb.outputs.p99_us }}
          KDB_MEMDB_P999:    ${{ needs.kdb-memdb.outputs.p999_us }}
          KDB_RH_WRITE_MS:   ${{ needs.kdb-rehydrate.outputs.write_ms }}
          KDB_RH_REPLAY_MS:  ${{ needs.kdb-rehydrate.outputs.replay_ms }}
          KDB_RH_WRITE_RATE: ${{ needs.kdb-rehydrate.outputs.write_rate }}
          KDB_RH_REPLAY_RATE: ${{ needs.kdb-rehydrate.outputs.replay_rate }}
          KDB_RH_PASSED:     ${{ needs.kdb-rehydrate.outputs.passed }}
          KDB_SC_WRITE_EPS:  ${{ needs.kdb-rehydrate.outputs.sc_write_eps }}
          KDB_SC_TAIL_MS:    ${{ needs.kdb-rehydrate.outputs.sc_tail_ms }}
          KDB_SC_REHY_EPS:   ${{ needs.kdb-rehydrate.outputs.sc_rehydrate_eps }}
          KDB_SC_REHY_MS:    ${{ needs.kdb-rehydrate.outputs.sc_rehydrate_ms }}
          KDB_FO_PASSED:     ${{ needs.kdb-failover.outputs.passed }}
          MDB_RH_WRITE_MS:   ${{ needs.mdb-rehydrate.outputs.write_ms }}
          MDB_RH_REPLAY_MS:  ${{ needs.mdb-rehydrate.outputs.replay_ms }}
          MDB_RH_WRITE_RATE: ${{ needs.mdb-rehydrate.outputs.write_rate }}
          MDB_RH_REPLAY_RATE: ${{ needs.mdb-rehydrate.outputs.replay_rate }}
          MDB_RH_PASSED:     ${{ needs.mdb-rehydrate.outputs.passed }}
          PG_RH_WRITE_MS:    ${{ needs.pg-rehydrate.outputs.write_ms }}
          PG_RH_REPLAY_MS:   ${{ needs.pg-rehydrate.outputs.replay_ms }}
          PG_RH_WRITE_RATE:  ${{ needs.pg-rehydrate.outputs.write_rate }}
          PG_RH_REPLAY_RATE: ${{ needs.pg-rehydrate.outputs.replay_rate }}
          PG_RH_PASSED:      ${{ needs.pg-rehydrate.outputs.passed }}
          MONITORING_PASSED: ${{ needs.monitoring-check.outputs.passed }}
        run: |
          python3 << 'PYEOF'
          import json
          import os
          from pathlib import Path

          def e(v):
            return os.getenv(v, '') or 'n/a'

          def ms(v):
            val = os.getenv(v, '')
            if not val:
              return 'n/a'
            try:
              return f'{int(val)/1000:.2f}'
            except Exception:
              return 'n/a'

          def result(v):
            return {'True': '✓ PASS', 'False': '✗ FAIL'}.get(os.getenv(v, ''), 'n/a')

          def ms_num(v):
            try:
              return f'{int(v)/1000:.2f}'
            except Exception:
              return 'n/a'

          def load_jsons(base_dir, file_map):
            base = Path(base_dir)
            out = {}
            for key, name in file_map.items():
              candidates = [base / name]
              if not candidates[0].exists():
                candidates = list(base.rglob(name))
              for p in candidates:
                if not p.exists():
                  continue
                try:
                  out[key] = json.loads(p.read_text(encoding='utf-8'))
                  break
                except Exception:
                  continue
            return out

          mode_data = load_jsons('bench-artifacts', {
            'kdb-docker-peak': 'kdb-docker-peak.json',
            'kdb-docker-durable': 'kdb-docker-durable.json',
            'kdb-k8s-peak': 'kdb-k8s-peak.json',
            'kdb-k8s-durable': 'kdb-k8s-durable.json',
            'mdb-docker-peak': 'mdb-docker-peak.json',
            'mdb-docker-durable': 'mdb-docker-durable.json',
            'mdb-k8s-peak': 'mdb-k8s-peak.json',
            'mdb-k8s-durable': 'mdb-k8s-durable.json',
            'pg-docker-peak': 'pg-docker-peak.json',
            'pg-docker-durable': 'pg-docker-durable.json',
            'pg-k8s-peak': 'pg-k8s-peak.json',
            'pg-k8s-durable': 'pg-k8s-durable.json',
          })

          ramp_data = load_jsons('bench-artifacts', {
            'kdb-peak': 'kdb-rate-ramp-peak.json',
            'kdb-durable': 'kdb-rate-ramp-durable.json',
            'mdb-peak': 'mdb-rate-ramp-peak.json',
            'mdb-durable': 'mdb-rate-ramp-durable.json',
            'pg-peak': 'pg-rate-ramp-peak.json',
            'pg-durable': 'pg-rate-ramp-durable.json',
          })

          replay_data = load_jsons('bench-artifacts', {
            'kdb-peak': 'kdb-replay-under-write-peak.json',
            'kdb-durable': 'kdb-replay-under-write-durable.json',
            'mdb-peak': 'mdb-replay-under-write-peak.json',
            'mdb-durable': 'mdb-replay-under-write-durable.json',
            'pg-peak': 'pg-replay-under-write-peak.json',
            'pg-durable': 'pg-replay-under-write-durable.json',
          })

          contention_data = load_jsons('bench-artifacts', {
            'kdb': 'kdb-hot-stream-contention.json',
            'mdb': 'mdb-hot-stream-contention.json',
            'pg': 'pg-hot-stream-contention.json',
          })

          hot_cold_data = load_jsons('bench-artifacts', {
            'kdb': 'kdb-hot-cold-view.json',
          })

          hot_cache_data = load_jsons('bench-artifacts', {
            'kdb': 'kdb-hot-cache.json',
          })

          mc_data = load_jsons('bench-artifacts', {
            'kdb': 'kdb-memcached-bench.json',
            'mdb': 'mdb-memcached-bench.json',
            'pg':  'pg-memcached-bench.json',
          })

          payload_batch_data = load_jsons('bench-artifacts', {
            'matrix': 'payload-batch-sensitivity.json',
          })

          failover_impact = load_jsons('bench-artifacts', {
            'kdb': 'kdb-failover-impact.json',
          })

          artifact_json_count = len(list(Path('bench-artifacts').rglob('*.json')))

          replay_expected = {
            'kdb-peak': 'KurrentDB Peak',
            'kdb-durable': 'KurrentDB Durable',
            'mdb-peak': 'MongoDB Peak',
            'mdb-durable': 'MongoDB Durable',
            'pg-peak': 'PostgreSQL Peak',
            'pg-durable': 'PostgreSQL Durable',
          }
          replay_required_fields = ['baseline_p99_us', 'concurrent_p99_us', 'regression_factor']
          replay_errors = []
          for key, label in replay_expected.items():
            if key not in replay_data:
              replay_errors.append(f'{label}: missing replay artifact')
              continue
            d = replay_data.get(key)
            if not isinstance(d, dict):
              replay_errors.append(f'{label}: invalid replay JSON object')
              continue
            missing = [fld for fld in replay_required_fields if fld not in d or d.get(fld) in (None, '')]
            if missing:
              replay_errors.append(f'{label}: missing fields: {", ".join(missing)}')

          from datetime import datetime, timezone

          current_bundle = {
            'schema_version': 1,
            'generated_at': datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z'),
            'repository': os.getenv('GITHUB_REPOSITORY', 'unknown'),
            'run_id': os.getenv('GITHUB_RUN_ID', 'unknown'),
            'run_attempt': os.getenv('GITHUB_RUN_ATTEMPT', 'unknown'),
            'run_number': os.getenv('GITHUB_RUN_NUMBER', 'unknown'),
            'sha': os.getenv('GITHUB_SHA', ''),
            'ref': os.getenv('GITHUB_REF', ''),
            'artifact_json_count': artifact_json_count,
            'sections': {
              'throughput': mode_data,
              'rate_ramp': ramp_data,
              'replay_under_write': replay_data,
              'hot_stream_contention': contention_data,
              'payload_batch_sensitivity': payload_batch_data,
              'failover_impact': failover_impact,
            },
          }

          Path('public').mkdir(parents=True, exist_ok=True)
          Path('public/bench-current.json').write_text(
            json.dumps(current_bundle, ensure_ascii=False, indent=2),
            encoding='utf-8'
          )

          if replay_errors:
            print('Replay data validation warning:')
            for err in replay_errors:
              print(f'- {err}')

          def write_mode_rows(f, backend_rows):
            for env_name, mode_name, key in backend_rows:
              if key not in mode_data:
                continue
              d = mode_data[key]
              f.write(
                f'| {env_name} | {mode_name} | {d.get("actual_rate_eps", "n/a")} | '
                f'{ms_num(d.get("p50_us", "n/a"))} | {ms_num(d.get("p95_us", "n/a"))} | '
                f'{ms_num(d.get("p99_us", "n/a"))} | {ms_num(d.get("p999_us", "n/a"))} |\n'
              )

          summary = os.environ.get('GITHUB_STEP_SUMMARY', '/dev/stdout')
          with open(summary, 'a', encoding='utf-8') as f:
            f.write('## Benchmark Results\n\n')
            f.write(f'> **Artifacts discovered:** {artifact_json_count} JSON files in bench-artifacts\n')
            f.write(f'> **Parsed sections:** throughput={len(mode_data)}, ramp={len(ramp_data)}, replay={len(replay_data)}, payload_batch={len(payload_batch_data)}, failover_impact={len(failover_impact)}\n')
            f.write(f'> **Hot-stream contention artifacts:** {len(contention_data)}\n')
            f.write('> **Conditions:** peak + durable modes · 10 k ev/s target · 30 s · 64 concurrent tasks · ubuntu-22.04\n')
            f.write('> **Rehydration:** 50 000 events · sequential write then full replay\n')
            f.write('> **Scale:** 100 k events · CI loopback (no VM bridge)\n\n')

            f.write('### Test Coverage Overview\n\n')
            f.write('- **Cross-backend (KurrentDB + MongoDB + PostgreSQL):** write throughput, rehydration/replay, rate-ramp knee-point, write regression under replay, hot-stream contention, payload + batch sensitivity\n')
            f.write('- **KurrentDB-only:** MEM_DB throughput ceiling, 100 k scale, 3-node leader-election failover, failover under write load, hot/cold read cache strategies\n\n')
            f.write('> Why KurrentDB-only here: these are HA/failover readiness checks, not just throughput checks.\n')
            f.write('> MongoDB/PostgreSQL failover parity needs dedicated HA control planes (Mongo replica-set election scenarios and PostgreSQL Patroni/repmgr-style promotion scenarios) to remain apples-to-apples.\n')
            f.write('> Next step: add MongoDB and PostgreSQL failover-impact jobs with the same output schema used by KurrentDB for full cross-backend reliability parity.\n\n')

            f.write('### KurrentDB — Write Throughput, Rehydration & Reliability\n\n')
            f.write('> **Backends:** KurrentDB · MEM_DB (no persistence) · Docker tmpfs · k3d emptyDir Memory\n')
            f.write('> **Conditions:** 10 k ev/s target · 30 s · 64 concurrent tasks · peak (no fsync) and durable (OS-buffer) modes\n')
            f.write('> **Measures:** write throughput + latency percentiles, rehydration round-trip, scale at 100 k events, failover recovery\n\n')
            f.write('**Write Throughput (10 k ev/s target · 30 s · 64 tasks)**\n\n')
            f.write('| Environment | Mode | Rate (ev/s) | p50 (ms) | p95 (ms) | p99 (ms) | p99.9 (ms) |\n')
            f.write('|-------------|------|------------:|:--------:|:--------:|:--------:|:----------:|\n')
            f.write(f'| In-memory (MEM_DB) | Peak baseline | {e("KDB_MEMDB_RATE")} | {ms("KDB_MEMDB_P50")} | {ms("KDB_MEMDB_P95")} | {ms("KDB_MEMDB_P99")} | {ms("KDB_MEMDB_P999")} |\n')
            write_mode_rows(f, [
              ('Docker (tmpfs)', 'Peak', 'kdb-docker-peak'),
              ('Docker (tmpfs)', 'Durable', 'kdb-docker-durable'),
              ('Kubernetes k3d (emptyDir Memory)', 'Peak', 'kdb-k8s-peak'),
              ('Kubernetes k3d (emptyDir Memory)', 'Durable', 'kdb-k8s-durable'),
            ])
            f.write('\n')

            f.write('**Rehydration / Replay — Write then Full Sequential Replay (50 k events)**\n\n')
            f.write('| Phase | Duration (ms) | Throughput (ev/s) | Result |\n')
            f.write('|-------|-------------:|------------------:|:------:|\n')
            f.write(f'| Write — batched 500 ev/gRPC | {e("KDB_RH_WRITE_MS")} | {e("KDB_RH_WRITE_RATE")} | |\n')
            f.write(f'| Replay — gRPC server-stream | {e("KDB_RH_REPLAY_MS")} | {e("KDB_RH_REPLAY_RATE")} | {result("KDB_RH_PASSED")} |\n\n')

            f.write('**Scale — Tail Read + Full Rehydration at 100 k Events (KurrentDB only)**\n\n')
            f.write('| Metric | Value |\n')
            f.write('|--------|------:|\n')
            f.write(f'| Write throughput (ev/s) | {e("KDB_SC_WRITE_EPS")} |\n')
            f.write(f'| Tail read — last 500 from 100 k (ms) | {e("KDB_SC_TAIL_MS")} |\n')
            f.write(f'| Full rehydration throughput (ev/s) | {e("KDB_SC_REHY_EPS")} |\n')
            f.write(f'| Full rehydration elapsed (ms) | {e("KDB_SC_REHY_MS")} |\n\n')

            f.write('**Node Failover — 3-Node Cluster Leader Election (KurrentDB only)**\n\n')
            f.write('| Test | Result |\n')
            f.write('|------|:------:|\n')
            f.write(f'| Leader evicted · new quorum elected · recovery ≤ 60 s | {result("KDB_FO_PASSED")} |\n\n')

            f.write('**Failover Under Write Load — Pause Window, Error Spike & Recovery (KurrentDB only)**\n\n')
            if 'kdb' in failover_impact:
              d = failover_impact['kdb']
              pause_window = d.get("pause_window_ms", "n/a")
              error_spike = d.get("error_spike_count", "n/a")
              write_errors = d.get("write_error_count", "n/a")
              recovery_time = d.get("recovery_time_ms", "n/a")

              def _as_int(value):
                try:
                  return int(value)
                except Exception:
                  return None

              pw = _as_int(pause_window)
              es = _as_int(error_spike)
              we = _as_int(write_errors)
              rt = _as_int(recovery_time)

              if pw == 0 and es == 0 and we == 0 and rt == 0:
                f.write('> Interpretation: no client-visible outage or error spike was observed during the failover window in this run.\n\n')
              else:
                f.write('> Interpretation: non-zero values below indicate client-visible disruption during failover (outage window, probe failures, write errors, or delayed recovery).\n\n')

              f.write('| Metric | Value |\n')
              f.write('|--------|------:|\n')
              f.write(f'| Pause window (ms) | {pause_window} |\n')
              f.write(f'| Probe error spike (count) | {error_spike} |\n')
              f.write(f'| Write error count | {write_errors} |\n')
              f.write(f'| Recovery time (ms) | {recovery_time} |\n')
              f.write(f'| Baseline p99 (us) | {d.get("baseline_p99_us", "n/a")} |\n')
              f.write(f'| Impact p99 (us) | {d.get("impact_p99_us", "n/a")} |\n')
              f.write(f'| Tail latency factor | {d.get("tail_latency_factor", "n/a")}x |\n\n')
            else:
              f.write('_Failover-impact artifact missing._\n\n')

            f.write('### MongoDB — Write Throughput & Rehydration\n\n')
            f.write('> **Backends:** MongoDB 7 · Docker tmpfs · k3d emptyDir Memory · replica-set rs0\n')
            f.write('> **Conditions:** 10 k ev/s target · 30 s · 64 concurrent tasks · peak (j:false) and durable (j:true, fdatasync no-op on tmpfs) modes\n')
            f.write('> **Measures:** write throughput + latency percentiles, rehydration round-trip\n\n')
            f.write('**Write Throughput (10 k ev/s target · 30 s · 64 tasks)**\n\n')
            f.write('| Environment | Mode | Rate (ev/s) | p50 (ms) | p95 (ms) | p99 (ms) | p99.9 (ms) |\n')
            f.write('|-------------|------|------------:|:--------:|:--------:|:--------:|:----------:|\n')
            write_mode_rows(f, [
              ('Docker (tmpfs)', 'Peak', 'mdb-docker-peak'),
              ('Docker (tmpfs)', 'Durable', 'mdb-docker-durable'),
              ('Kubernetes k3d (emptyDir Memory)', 'Peak', 'mdb-k8s-peak'),
              ('Kubernetes k3d (emptyDir Memory)', 'Durable', 'mdb-k8s-durable'),
            ])
            f.write('\n')

            f.write('**Rehydration / Replay — Write then Full Sequential Replay (50 k events)**\n\n')
            f.write('| Phase | Duration (ms) | Throughput (ev/s) | Result |\n')
            f.write('|-------|-------------:|------------------:|:------:|\n')
            f.write(f'| Write — one insertOne() per event | {e("MDB_RH_WRITE_MS")} | {e("MDB_RH_WRITE_RATE")} | |\n')
            f.write(f'| Replay — bulk cursor (16 MB batch) | {e("MDB_RH_REPLAY_MS")} | {e("MDB_RH_REPLAY_RATE")} | {result("MDB_RH_PASSED")} |\n\n')

            f.write('### PostgreSQL — Write Throughput & Rehydration\n\n')
            f.write('> **Backends:** PostgreSQL 16 · Docker tmpfs · k3d emptyDir Memory\n')
            f.write('> **Conditions:** 10 k ev/s target · 30 s · 64 concurrent tasks · peak (fsync=off) and durable (fsync=off + synchronous_commit=on) modes\n')
            f.write('> **Measures:** write throughput + latency percentiles, rehydration round-trip\n\n')
            f.write('**Write Throughput (10 k ev/s target · 30 s · 64 tasks)**\n\n')
            f.write('| Environment | Mode | Rate (ev/s) | p50 (ms) | p95 (ms) | p99 (ms) | p99.9 (ms) |\n')
            f.write('|-------------|------|------------:|:--------:|:--------:|:--------:|:----------:|\n')
            write_mode_rows(f, [
              ('Docker (tmpfs · fsync=off)', 'Peak', 'pg-docker-peak'),
              ('Docker (tmpfs · fsync=off)', 'Durable', 'pg-docker-durable'),
              ('Kubernetes k3d (emptyDir Memory)', 'Peak', 'pg-k8s-peak'),
              ('Kubernetes k3d (emptyDir Memory)', 'Durable', 'pg-k8s-durable'),
            ])
            f.write('\n')

            f.write('**Rehydration / Replay — Write then Full Sequential Replay (50 k events)**\n\n')
            f.write('| Phase | Duration (ms) | Throughput (ev/s) | Result |\n')
            f.write('|-------|-------------:|------------------:|:------:|\n')
            f.write(f'| Write — one INSERT per event | {e("PG_RH_WRITE_MS")} | {e("PG_RH_WRITE_RATE")} | |\n')
            f.write(f'| Replay — SELECT ... ORDER BY stream_version | {e("PG_RH_REPLAY_MS")} | {e("PG_RH_REPLAY_RATE")} | {result("PG_RH_PASSED")} |\n\n')

            f.write('### Observability — Prometheus Scraping & Grafana Dashboard\n\n')
            f.write('> **Backends:** KurrentDB (MEM_DB) · RabbitMQ · MongoDB (exporter :9216) · PostgreSQL (exporter :9187)\n')
            f.write('> **Conditions:** single-node Docker compose · all exporters running · Grafana provisioned\n')
            f.write('> **Measures:** Prometheus scrape targets active · 9 metric families return data · Grafana dashboard present\n\n')
            f.write('| Check | Result |\n')
            f.write('|-------|:------:|\n')
            f.write(f'| All targets + metrics + Grafana dashboard | {result("MONITORING_PASSED")} |\n\n')

            f.write('### Write Throughput Scaling — Rate Ramp Knee-Point (Cross-Backend)\n\n')
            f.write('> **Backends:** KurrentDB · MongoDB · PostgreSQL\n')
            f.write('> **Conditions:** rate steps 1 k → 3 k → 5 k → 8 k → 10 k ev/s · 20 s per step · 64 tasks · peak mode\n')
            f.write('> **Measures:** rate at which p99 latency jumps ≥ 2× (the knee-point); no knee = linear scaling holds through 10 k\n\n')
            if ramp_data:
              for key, label in [('kdb-peak', 'KurrentDB Peak'), ('kdb-durable', 'KurrentDB Durable'), ('mdb-peak', 'MongoDB Peak'), ('mdb-durable', 'MongoDB Durable'), ('pg-peak', 'PostgreSQL Peak'), ('pg-durable', 'PostgreSQL Durable')]:
                if key not in ramp_data:
                  continue
                d = ramp_data[key]
                if d.get('knee_detected'):
                  f.write(f'- **{label}:** knee {d.get("knee_rate_eps", "n/a")} ev/s, p99 {d.get("knee_p99_us", "n/a")} us, jump {d.get("knee_jump", "n/a")}x\n')
                else:
                  f.write(f'- **{label}:** no knee detected in tested range\n')
              f.write('\n')
            else:
              f.write('_Rate ramp tests did not produce artifacts._\n\n')

            f.write('### Write Latency Under Concurrent Replay — Regression Check (Cross-Backend)\n\n')
            f.write('> **Backends:** KurrentDB · MongoDB · PostgreSQL\n')
            f.write('> **Conditions:** 100 k seeded events · full replay from position 0 concurrently with live writes at 10 k ev/s · 30 s\n')
            f.write('> **Measures:** concurrent p99 ÷ baseline p99 (regression factor); pass = factor ≤ 3×\n\n')
            if replay_errors:
              f.write('> ⚠ Replay data validation warnings:\n')
              for err in replay_errors:
                f.write(f'> - {err}\n')
              f.write('\n')
            if replay_data:
              for key, label in [('kdb-peak', 'KurrentDB Peak'), ('kdb-durable', 'KurrentDB Durable'), ('mdb-peak', 'MongoDB Peak'), ('mdb-durable', 'MongoDB Durable'), ('pg-peak', 'PostgreSQL Peak'), ('pg-durable', 'PostgreSQL Durable')]:
                if key not in replay_data:
                  continue
                d = replay_data[key]
                f.write(f'- **{label}:** baseline {d.get("baseline_p99_us", "n/a")} us -> concurrent {d.get("concurrent_p99_us", "n/a")} us ({d.get("regression_factor", "n/a")}x)\n')
              f.write('\n')
            else:
              f.write('_Replay-under-write tests did not produce artifacts._\n\n')

            f.write('### Hot-Stream Contention — Optimistic Concurrency Conflicts, Retries & Tail Latency (Cross-Backend)\n\n')
            f.write('> **Backends:** KurrentDB · MongoDB · PostgreSQL\n')
            f.write('> **Conditions:** 90% of writes to 4 hot streams · 128 cold streams · 8 k ev/s · up to 8 retries per conflict\n')
            f.write('> **Measures:** conflict count · retry success/exhaustion · tail latency factor (contention p99 ÷ baseline p99)\n\n')
            if contention_data:
              for key, label in [('kdb', 'KurrentDB'), ('mdb', 'MongoDB'), ('pg', 'PostgreSQL')]:
                if key not in contention_data:
                  continue
                d = contention_data[key]
                f.write(f'**{label}**\n\n')
                f.write('| Metric | Value |\n')
                f.write('|--------|------:|\n')
                f.write(f'| Baseline p99 (us) | {d.get("baseline_p99_us", "n/a")} |\n')
                f.write(f'| Contention p99 (us) | {d.get("contention_p99_us", "n/a")} |\n')
                f.write(f'| Tail latency factor | {d.get("tail_latency_factor", "n/a")}x |\n')
                f.write(f'| Hot writes | {d.get("hot_events", "n/a")} |\n')
                f.write(f'| Cold writes | {d.get("cold_events", "n/a")} |\n')
                f.write(f'| Conflict count | {d.get("conflict_count", "n/a")} |\n')
                f.write(f'| Retry count | {d.get("retry_count", "n/a")} |\n')
                f.write(f'| Retry success count | {d.get("retry_success_count", "n/a")} |\n')
                f.write(f'| Retry exhausted count | {d.get("retry_exhausted_count", "n/a")} |\n')
                f.write(f'| Failed writes | {d.get("failed_writes", "n/a")} |\n\n')
            else:
              f.write('_Hot-stream contention artifact missing._\n\n')

            # ── Hot/Cold Cache Comparison ──────────────────────────────────────
            f.write('### Hot/Cold Read Views — Cache Strategy Comparison (KurrentDB)\n\n')
            f.write('> Two ways to serve "most-recent N events" without a dedicated cache tier:\n')
            f.write('> **Strategy A** — application-side in-memory ring buffer, seeded with a single tail-read at startup.\n')
            f.write('> **Strategy B** — KurrentDB native `$maxCount` stream metadata + catch-up subscriptions; no application cache at all.\n\n')

            # Strategy A — in-memory ring buffer (hot-cache bench)
            f.write('#### Strategy A — Application Ring Buffer (one DB tail-read at startup, zero-latency reads thereafter)\n\n')
            hc = hot_cache_data.get('kdb')
            if isinstance(hc, dict):
              f.write(f'> seed={hc.get("seed_events", "n/a")} events · cache_size={hc.get("cache_size_after_startup", "n/a")} · live_writes={hc.get("live_writes", "n/a")}\n\n')
              f.write('| Phase | Metric | Value |\n')
              f.write('|-------|--------|------:|\n')
              f.write(f'| Startup | Load last N from DB (µs) | {hc.get("startup_load_us", "n/a")} |\n')
              f.write(f'| Cache reads | p50 (ns) | {hc.get("cache_read_p50_ns", "n/a")} |\n')
              f.write(f'| Cache reads | p99 (ns) | {hc.get("cache_read_p99_ns", "n/a")} |\n')
              f.write(f'| Live DB write | p50 (µs) | {hc.get("db_write_p50_us", "n/a")} |\n')
              f.write(f'| Live DB write | p95 (µs) | {hc.get("db_write_p95_us", "n/a")} |\n')
              f.write(f'| Live DB write | p99 (µs) | {hc.get("db_write_p99_us", "n/a")} |\n')
              f.write(f'| Cache push | p50 (ns) | {hc.get("cache_push_p50_ns", "n/a")} |\n')
              f.write(f'| Cache push | p99 (ns) | {hc.get("cache_push_p99_ns", "n/a")} |\n\n')
            else:
              f.write('_Hot-cache artifact missing._\n\n')

            # Strategy B — KurrentDB onboard features
            f.write('#### Strategy B — KurrentDB Native Features ($maxCount sliding window + catch-up subscriptions, no application cache)\n\n')
            hcv = hot_cold_data.get('kdb')
            if isinstance(hcv, dict):
              seed   = hcv.get('seed_events', 'n/a')
              hw     = hcv.get('hot_window', 'n/a')
              cold_n = hcv.get('cold_stream_event_count', 'n/a')
              hot_n  = hcv.get('hot_stream_event_count', 'n/a')
              scavd  = cold_n - hot_n if isinstance(cold_n, int) and isinstance(hot_n, int) else 'n/a'
              f.write(f'> seed={seed} events · hot_window={hw} (`$maxCount`) · live_writes={hcv.get("live_writes", "n/a")}\n\n')
              f.write('**`$maxCount` stream metadata — server-enforced sliding window**\n\n')
              f.write('| Stream | Events returned | Read time (µs) | µs / event |\n')
              f.write('|--------|----------------:|---------------:|-----------:|\n')
              f.write(f'| Cold (no limit) | {cold_n} | {hcv.get("cold_read_elapsed_us", "n/a")} | {hcv.get("cold_read_per_event_us", "n/a")} |\n')
              f.write(f'| Hot (`$maxCount`) | {hot_n} | {hcv.get("hot_read_elapsed_us", "n/a")} | {hcv.get("hot_read_per_event_us", "n/a")} |\n')
              f.write(f'| Scavenged by DB | {scavd} | — | — |\n\n')
              f.write('**Catch-up subscriptions — cold start vs live-only hot start**\n\n')
              f.write('| View | Metric | Value |\n')
              f.write('|------|--------|------:|\n')
              f.write(f'| Cold (from Start) | Replay {seed} events | {hcv.get("cold_sub_replay_ms", "n/a")} ms ({hcv.get("cold_sub_replay_rate_eps", "n/a")} ev/s) |\n')
              f.write(f'| Hot  (from End)   | Lag p50 | {hcv.get("hot_sub_lag_p50_us", "n/a")} µs |\n')
              f.write(f'| Hot  (from End)   | Lag p95 | {hcv.get("hot_sub_lag_p95_us", "n/a")} µs |\n')
              f.write(f'| Hot  (from End)   | Lag p99 | {hcv.get("hot_sub_lag_p99_us", "n/a")} µs |\n')
              f.write(f'| Hot  (from End)   | Lag max | {hcv.get("hot_sub_lag_max_us", "n/a")} µs |\n\n')
            else:
              f.write('_Hot/cold view artifact missing._\n\n')

            # Strategy C — Memcached write-through (all three backends)
            f.write('#### Strategy C — Memcached Write-Through (external network cache, all backends)\n\n')
            f.write('> **Backends:** KurrentDB · MongoDB · PostgreSQL · **Conditions:** Memcached 1.6 Docker · localhost loopback · 500 events in window · JSON serialisation\n')
            f.write('> **Measures:** cold-miss startup latency (DB load + MC SET), Memcached GET read latency (p50/p99), write-through overhead (DB write + MC SET p50/p99)\n\n')
            if mc_data:
              f.write('| Backend | Startup DB load (µs) | Startup MC SET (µs) | Read p50 (µs) | Read p99 (µs) | DB write p99 (µs) | MC SET p99 (µs) |\n')
              f.write('|---------|--------------------:|--------------------:|-------------:|-------------:|-------------------:|----------------:|\n')
              for key, label in [('kdb', 'KurrentDB'), ('mdb', 'MongoDB'), ('pg', 'PostgreSQL')]:
                if key not in mc_data:
                  continue
                d = mc_data[key]
                f.write(f'| {label} | {d.get("startup_db_load_us", "n/a")} | {d.get("startup_mc_set_us", "n/a")} | {d.get("cache_read_p50_us", "n/a")} | {d.get("cache_read_p99_us", "n/a")} | {d.get("db_write_p99_us", "n/a")} | {d.get("mc_set_p99_us", "n/a")} |\n')
              f.write('\n')
            else:
              f.write('_Memcached bench artifacts missing._\n\n')

            f.write('### Write Latency Sensitivity to Payload Size & Batch Shape (Cross-Backend)\n\n')
            f.write('> **Backends:** KurrentDB · MongoDB · PostgreSQL\n')
            f.write('> **Conditions:** payload sizes 256 B / 1 KB / 4 KB · batch sizes 1 / 8 · 5 k ev/s target · 12 s per shape · 64 tasks\n')
            f.write('> **Measures:** whether backend throughput ranking changes as payload size or batch size increases\n\n')
            matrix = payload_batch_data.get('matrix')
            if isinstance(matrix, dict):
              baseline = matrix.get('baseline_ranking', [])
              changed = matrix.get('ranking_changed', 'n/a')
              f.write(f'- **Baseline ranking:** {" > ".join(baseline) if baseline else "n/a"}\n')
              f.write(f'- **Ranking changed across shapes:** {changed}\n\n')
              for shape in matrix.get('shapes', []):
                payload = shape.get('payload_bytes', 'n/a')
                batch = shape.get('batch_size', 'n/a')
                ranking = shape.get('ranking', [])
                f.write(f'**Shape payload={payload}B, batch={batch}**\n\n')
                f.write(f'- Ranking: {" > ".join(ranking) if ranking else "n/a"}\n\n')
                f.write('| Backend | Rate (ev/s) | p99 (us) |\n')
                f.write('|---------|------------:|---------:|\n')
                for item in shape.get('results', []):
                  f.write(f'| {item.get("backend", "n/a")} | {item.get("actual_rate_eps", "n/a")} | {item.get("p99_us", "n/a")} |\n')
                f.write('\n')
            else:
              f.write('_Payload/batch-sensitivity artifact missing._\n\n')

            f.write('---\n')
            f.write('_All backends use RAM (tmpfs/emptyDir). Numbers reflect protocol + semantic overhead, not production throughput._\n')
            f.write('_K8s latency is higher than Docker due to the port-forward loopback tunnel._\n')
          PYEOF

      - name: Upload public benchmark bundle
        uses: actions/upload-artifact@v6
        with:
          name: bench-report-bundle
          path: public/bench-current.json
          if-no-files-found: error

  publish-history:
    name: Publish Bench History (Branch)
    runs-on: ubuntu-22.04
    needs: report
    if: needs.report.result == 'success' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.job == ''))
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout main repo (for scripts)
        uses: actions/checkout@v6

      - name: Detect bench-history branch
        id: bench_history_branch
        env:
          REPO_URL: https://github.com/${{ github.repository }}.git
        run: |
          if git ls-remote --exit-code --heads "$REPO_URL" bench-history >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout bench-history branch
        if: steps.bench_history_branch.outputs.exists == 'true'
        uses: actions/checkout@v6
        with:
          ref: bench-history
          path: bench-repo
          fetch-depth: 1

      - name: Init bench-repo if branch did not exist
        if: steps.bench_history_branch.outputs.exists != 'true'
        run: |
          mkdir -p bench-repo
          cd bench-repo
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://github.com/${{ github.repository }}.git"
          git checkout -B bench-history

      - name: Download current benchmark bundle
        uses: actions/download-artifact@v8
        with:
          name: bench-report-bundle
          path: bundle

      - name: Setup git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Build rolling history (last 10 runs)
        run: python3 .github/scripts/merge_bench_history.py

      - name: Commit and push
        run: |
          cd bench-repo
          git add history.json current.json README.md
          if git diff --quiet --cached; then
            echo "No bench-history changes detected"
            exit 0
          fi
          git commit -m "bench: update rolling history (run ${{ github.run_number }})"
          git push origin HEAD:bench-history
