      - name: Build
        run: cargo build --release --manifest-path rust-app/Cargo.toml

      - name: Hot-tail cache benchmark
        run: |
          RESULT=$(rust-app/target/release/testbed \
            --kurrentdb-url 'kurrentdb://localhost:2113?tls=false' \
            kurrentdb-hot-cache-bench \
            --seed-events 50000 \
            --cache-size  500 \
            --live-writes 500 \
            --json)
          echo "$RESULT"
          echo "$RESULT" > kdb-hot-cache.json
          # Sanity-check: startup load must be < 500 ms (500 000 µs)
          STARTUP_US=$(echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['startup_load_us'])")
          if [ "$STARTUP_US" -ge 500000 ]; then
            echo "FAIL: startup_load_us=${STARTUP_US} >= 500 ms limit" >&2
            exit 1
          fi

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: kdb-hot-cache-result
          path: kdb-hot-cache.json
          if-no-files-found: warn

