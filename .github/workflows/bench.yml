name: Benchmarks

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      job:
        description: 'Job to run (blank = all)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - kdb-memdb
          - kdb-docker
          - kdb-k8s
          - kdb-rehydrate
          - kdb-failover
          - kdb-failover-impact
          - kdb-rate-ramp
          - kdb-replay-under-write
          - kdb-hot-cache
          - kdb-hot-cold-view
          - kdb-hot-stream-contention
          - kdb-memcached
          - mdb-docker
          - mdb-k8s
          - mdb-rehydrate
          - mdb-rate-ramp
          - mdb-replay-under-write
          - mdb-hot-stream-contention
          - mdb-memcached
          - pg-docker
          - pg-k8s
          - pg-rehydrate
          - pg-rate-ramp
          - pg-replay-under-write
          - pg-hot-stream-contention
          - pg-memcached
          - monitoring-check
          - payload-batch-sensitivity

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# One run per ref; cancel in-progress on new push.
concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ════════════════════════════════════════════════════════════════════════════
  # KurrentDB
  #   - Core throughput (MEM_DB / Docker / Kubernetes)
  #   - Rehydration + scale
  #   - Reliability/failover
  #   - Scenario tests (rate ramp, replay-under-write, hot/cold-view, hot-stream-contention)
  # ════════════════════════════════════════════════════════════════════════════

  kdb-memdb:
    name: "KurrentDB: In-Memory (MEM_DB)"
    runs-on: ubuntu-22.04
    if: github.event_name != 'workflow_dispatch' || inputs.job == '' || inputs.job == 'kdb-memdb'
    outputs:
      rate:    ${{ steps.bench.outputs.rate }}
      p50_us:  ${{ steps.bench.outputs.p50_us }}
      p95_us:  ${{ steps.bench.outputs.p95_us }}
      p99_us:  ${{ steps.bench.outputs.p99_us }}
      p999_us: ${{ steps.bench.outputs.p999_us }}
    steps:
      - uses: actions/checkout@v6

      - name: Install KurrentDB (MEM_DB)
        run: |
          curl -1sLf 'https://dl.cloudsmith.io/public/eventstore/kurrent-latest/setup.deb.sh' | sudo -E bash
          sudo apt-get install -y kurrentdb
          sudo systemctl stop kurrentdb || true
          getent passwd kurrentdb > /dev/null || sudo useradd --system --no-create-home --shell /usr/sbin/nologin kurrentdb
          sudo mkdir -p /tmp/esdb /tmp/esdb-log
          sudo chown kurrentdb:kurrentdb /tmp/esdb /tmp/esdb-log
          sudo mkdir -p /etc/systemd/system/kurrentdb.service.d
          printf '[Service]\nEnvironment="KURRENTDB_DB=/tmp/esdb"\nEnvironment="KURRENTDB_LOG=/tmp/esdb-log"\nEnvironment="KURRENTDB_INSECURE=true"\nEnvironment="KURRENTDB_RUN_PROJECTIONS=None"\nEnvironment="KURRENTDB_UNSAFE_DISABLE_FLUSH_TO_DISK=true"\nEnvironment="KURRENTDB_CLUSTER_SIZE=1"\nEnvironment="KURRENTDB_MEM_DB=true"\n' \
            | sudo tee /etc/systemd/system/kurrentdb.service.d/bench.conf
          sudo systemctl daemon-reload
          sudo systemctl start kurrentdb
          for i in $(seq 1 30); do curl -sf http://localhost:2113/health/live && break || sleep 2; done
          ES_PID=$(systemctl show -p MainPID kurrentdb | cut -d= -f2)
          sudo renice -n -15 -p "$ES_PID"

      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-app/target
          key: bench-${{ runner.os }}-cargo-${{ hashFiles('rust-app/Cargo.lock') }}

      - name: Build
        run: cargo build --release --manifest-path rust-app/Cargo.toml

      - name: Benchmark
        id: bench
        run: |
          RESULT=$(rust-app/target/release/testbed \
            --kurrentdb-url "kurrentdb://localhost:2113?tls=false" \
            kurrentdb-bench --target-rate 10000 --concurrency 64 --batch-size 1 --duration-secs 30 --json)
          echo "$RESULT"
          echo "rate=$(echo    "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(round(d['actual_rate_eps'],1))")" >> "$GITHUB_OUTPUT"
          echo "p50_us=$(echo  "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['p50_us'])")"  >> "$GITHUB_OUTPUT"
          echo "p95_us=$(echo  "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['p95_us'])")"  >> "$GITHUB_OUTPUT"
          echo "p99_us=$(echo  "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['p99_us'])")"  >> "$GITHUB_OUTPUT"
          echo "p999_us=$(echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['p999_us'])")" >> "$GITHUB_OUTPUT"

  # ── KurrentDB: Docker Benchmark ──────────────────────────────────────────
  kdb-docker:
    name: "KurrentDB: Docker (tmpfs) [${{ matrix.mode }}]"
    runs-on: ubuntu-22.04
    if: github.event_name != 'workflow_dispatch' || inputs.job == '' || inputs.job == 'kdb-docker'
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: peak
            flush_to_disk_disable: "true"
          - mode: durable
            flush_to_disk_disable: "false"
    steps:
      - uses: actions/checkout@v6

      - name: Start KurrentDB on tmpfs
        run: |
          docker run -d --name kurrentdb -p 2113:2113 --tmpfs /data \
            -e KURRENTDB_CLUSTER_SIZE=1 \
            -e KURRENTDB_INSECURE=true \
            -e KURRENTDB_RUN_PROJECTIONS=None \
            -e KURRENTDB_START_STANDARD_PROJECTIONS=false \
            -e KURRENTDB_UNSAFE_DISABLE_FLUSH_TO_DISK=${{ matrix.flush_to_disk_disable }} \
            -e KURRENTDB_ENABLE_ATOM_PUB_OVER_HTTP=true \
            -e KURRENTDB_DB=/data/db \
            -e KURRENTDB_LOG=/data/log \
            kurrentplatform/kurrentdb:latest
          for i in $(seq 1 30); do curl -sf http://localhost:2113/health/live && break || sleep 2; done

      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-app/target
          key: bench-${{ runner.os }}-cargo-${{ hashFiles('rust-app/Cargo.lock') }}

      - name: Build
        run: cargo build --release --manifest-path rust-app/Cargo.toml

      - name: Benchmark
        id: bench
        run: |
          RESULT=$(rust-app/target/release/testbed \
            --kurrentdb-url "kurrentdb://localhost:2113?tls=false" \
            kurrentdb-bench --target-rate 10000 --concurrency 64 --batch-size 1 --duration-secs 30 --json)
          echo "$RESULT"
          echo "$RESULT" > "kdb-docker-${{ matrix.mode }}.json"
          echo "rate=$(echo    "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(round(d['actual_rate_eps'],1))")" >> "$GITHUB_OUTPUT"
          echo "p50_us=$(echo  "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['p50_us'])")"  >> "$GITHUB_OUTPUT"
          echo "p95_us=$(echo  "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['p95_us'])")"  >> "$GITHUB_OUTPUT"
          echo "p99_us=$(echo  "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['p99_us'])")"  >> "$GITHUB_OUTPUT"
          echo "p999_us=$(echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['p999_us'])")" >> "$GITHUB_OUTPUT"

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v6
        with:
          name: kdb-docker-bench-${{ matrix.mode }}
          path: kdb-docker-${{ matrix.mode }}.json
          if-no-files-found: error

      - name: Dump Docker logs on failure
        if: failure()
        run: docker logs kurrentdb --tail 50 || true

      - name: Stop KurrentDB
        if: always()
        run: docker stop kurrentdb && docker rm kurrentdb || true

  # ── KurrentDB: Kubernetes Benchmark ──────────────────────────────────────
  kdb-k8s:
    name: "KurrentDB: Kubernetes (single-node, tmpfs) [${{ matrix.mode }}]"
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: peak
            flush_to_disk_disable: "true"
          - mode: durable
            flush_to_disk_disable: "false"
    steps:
      - uses: actions/checkout@v6

      - name: Install k3d
        run: curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | TAG=v5.8.3 bash

      - name: Create k3d cluster
        run: k3d cluster create testbed --servers 1 --no-lb --wait --timeout 120s

      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-app/target
          key: bench-${{ runner.os }}-cargo-${{ hashFiles('rust-app/Cargo.lock') }}

      - name: Build
        run: cargo build --release --manifest-path rust-app/Cargo.toml

      - name: Pre-pull KurrentDB image
        run: |
          docker pull kurrentplatform/kurrentdb:latest
          k3d image import kurrentplatform/kurrentdb:latest -c testbed

      - name: Deploy KurrentDB (single-node, emptyDir Memory)
        run: |
          kubectl apply -f k8s/00-namespace.yaml
          kubectl apply -f k8s/02-kurrentdb/01-services.yaml
          kubectl apply -f - <<'EOF'
          apiVersion: apps/v1
          kind: StatefulSet
          metadata:
            name: kurrentdb
            namespace: event-store
          spec:
            serviceName: kurrentdb-headless
            replicas: 1
            selector:
              matchLabels:
                app: kurrentdb
            template:
              metadata:
                labels:
                  app: kurrentdb
              spec:
                enableServiceLinks: false
                containers:
                  - name: kurrentdb
                    image: kurrentplatform/kurrentdb:latest
                    imagePullPolicy: IfNotPresent
                    ports:
                      - containerPort: 2113
                    env:
                      - {name: KURRENTDB_CLUSTER_SIZE,                value: "1"}
                      - {name: KURRENTDB_INSECURE,                    value: "true"}
                      - {name: KURRENTDB_RUN_PROJECTIONS,             value: "None"}
                      - {name: KURRENTDB_START_STANDARD_PROJECTIONS,  value: "false"}
                      - {name: KURRENTDB_UNSAFE_DISABLE_FLUSH_TO_DISK,value: "${{ matrix.flush_to_disk_disable }}"}
                      - {name: KURRENTDB_DB,                          value: /data/db}
                      - {name: KURRENTDB_LOG,                         value: /data/log}
                      - {name: KURRENTDB_ENABLE_ATOM_PUB_OVER_HTTP,   value: "true"}
                    volumeMounts:
                      - {name: data, mountPath: /data}
                volumes:
                  - name: data
                    emptyDir: {medium: Memory, sizeLimit: 512Mi}
          EOF

      - name: Wait for KurrentDB
        run: |
          kubectl rollout status statefulset/kurrentdb -n event-store --timeout=120s
          start_pf() { kill "$PF_PID" 2>/dev/null || true; kubectl port-forward -n event-store pod/kurrentdb-0 2113:2113 & PF_PID=$!; sleep 3; }
          PF_PID=""; start_pf
          for i in $(seq 1 60); do
            kill -0 "$PF_PID" 2>/dev/null || { start_pf; }
            curl -sf --connect-timeout 5 http://localhost:2113/health/live 2>/dev/null && kill $PF_PID 2>/dev/null && exit 0
            [ $((i % 5)) -eq 0 ] && kubectl logs -n event-store pod/kurrentdb-0 --tail=20 2>&1 || true
            sleep 5
          done
          kill $PF_PID 2>/dev/null || true; exit 1

      - name: Dump pod diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -n event-store -o wide || true
          kubectl get events -n event-store --sort-by='.lastTimestamp' 2>/dev/null | tail -40 || true
          kubectl describe pods -n event-store || true
          for pod in $(kubectl get pods -n event-store -o name 2>/dev/null); do
            kubectl logs "$pod" -n event-store --tail=50 2>&1 || true
          done

      - name: Benchmark
        id: bench
        run: |
          kubectl port-forward -n event-store pod/kurrentdb-0 2113:2113 & PF_PID=$!; sleep 3
          RESULT=$(rust-app/target/release/testbed \
            --kurrentdb-url "kurrentdb://localhost:2113?tls=false" \
            kurrentdb-bench --target-rate 10000 --duration-secs 30 --concurrency 64 --batch-size 1 --json)
          kill $PF_PID 2>/dev/null || true
          echo "$RESULT"
          echo "$RESULT" > "kdb-k8s-${{ matrix.mode }}.json"
          echo "rate=$(echo    "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(round(d['actual_rate_eps'],1))")" >> "$GITHUB_OUTPUT"
          echo "p50_us=$(echo  "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['p50_us'])")"  >> "$GITHUB_OUTPUT"
          echo "p95_us=$(echo  "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['p95_us'])")"  >> "$GITHUB_OUTPUT"
          echo "p99_us=$(echo  "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['p99_us'])")"  >> "$GITHUB_OUTPUT"
          echo "p999_us=$(echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['p999_us'])")" >> "$GITHUB_OUTPUT"

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v6
        with:
          name: kdb-k8s-bench-${{ matrix.mode }}
          path: kdb-k8s-${{ matrix.mode }}.json
          if-no-files-found: error

  # ── KurrentDB: Rehydration + Scale (100k) ────────────────────────────────
  kdb-rehydrate:
    name: "KurrentDB: Rehydration / Replay + Scale (100k)"
    runs-on: ubuntu-22.04
    if: github.event_name != 'workflow_dispatch' || inputs.job == '' || inputs.job == 'kdb-rehydrate'
    outputs:
      write_ms:         ${{ steps.demo.outputs.write_ms }}
      replay_ms:        ${{ steps.demo.outputs.replay_ms }}
      write_rate:       ${{ steps.demo.outputs.write_rate }}
      replay_rate:      ${{ steps.demo.outputs.replay_rate }}
      passed:           ${{ steps.demo.outputs.passed }}
      sc_write_eps:     ${{ steps.scale.outputs.write_eps }}
      sc_tail_ms:       ${{ steps.scale.outputs.tail_ms }}
      sc_rehydrate_eps: ${{ steps.scale.outputs.rehydrate_eps }}
      sc_rehydrate_ms:  ${{ steps.scale.outputs.rehydrate_ms }}
    steps:
      - uses: actions/checkout@v6

      - name: Install KurrentDB (in-memory)
        run: |
          curl -1sLf 'https://dl.cloudsmith.io/public/eventstore/kurrent-latest/setup.deb.sh' | sudo -E bash
          sudo apt-get install -y kurrentdb
          sudo systemctl stop kurrentdb || true
          getent passwd kurrentdb > /dev/null || sudo useradd --system --no-create-home --shell /usr/sbin/nologin kurrentdb
          sudo mkdir -p /tmp/esdb /tmp/esdb-log
          sudo chown kurrentdb:kurrentdb /tmp/esdb /tmp/esdb-log
          sudo mkdir -p /etc/systemd/system/kurrentdb.service.d
          printf '[Service]\nEnvironment="KURRENTDB_DB=/tmp/esdb"\nEnvironment="KURRENTDB_LOG=/tmp/esdb-log"\nEnvironment="KURRENTDB_INSECURE=true"\nEnvironment="KURRENTDB_RUN_PROJECTIONS=None"\nEnvironment="KURRENTDB_UNSAFE_DISABLE_FLUSH_TO_DISK=true"\nEnvironment="KURRENTDB_CLUSTER_SIZE=1"\nEnvironment="KURRENTDB_MEM_DB=true"\n' \
            | sudo tee /etc/systemd/system/kurrentdb.service.d/bench.conf
          sudo systemctl daemon-reload
          sudo systemctl start kurrentdb
          for i in $(seq 1 30); do curl -sf http://localhost:2113/health/live && break || sleep 2; done

      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-app/target
          key: bench-${{ runner.os }}-cargo-${{ hashFiles('rust-app/Cargo.lock') }}

      - name: Build
        run: cargo build --release --manifest-path rust-app/Cargo.toml

      - name: Rehydration demo
        id: demo
        run: |
          RESULT=$(rust-app/target/release/testbed \
            --kurrentdb-url "kurrentdb://localhost:2113?tls=false" \
            kurrentdb-rehydrate-demo --json)
          echo "$RESULT"
          JSON=$(echo "$RESULT" | tail -n 1)
          echo "write_ms=$(echo    "$JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['write_ms'])")"                   >> "$GITHUB_OUTPUT"
          echo "replay_ms=$(echo   "$JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['replay_ms'])")"                  >> "$GITHUB_OUTPUT"
          echo "write_rate=$(echo  "$JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(round(d['write_rate_eps'],1))")"     >> "$GITHUB_OUTPUT"
          echo "replay_rate=$(echo "$JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(round(d['replay_rate_eps'],1))")"    >> "$GITHUB_OUTPUT"
          PASSED=$(echo "$JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['passed'])")
          echo "passed=$PASSED" >> "$GITHUB_OUTPUT"
          [ "$PASSED" = "True" ] || { echo "KurrentDB rehydration FAILED"; exit 1; }

      - name: Scale benchmark (100 k events, same instance)
        id: scale
        run: |
          RESULT=$(rust-app/target/release/testbed \
            --kurrentdb-url "kurrentdb://localhost:2113?tls=false" \
            kurrentdb-scale-bench --scale-events 100000 --batch-size 500 --stream-name ci-scale-test11 --json)
          echo "$RESULT"
          echo "write_eps=$(echo     "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(round(d['write_throughput_eps'],1))")"    >> "$GITHUB_OUTPUT"
          echo "tail_ms=$(echo       "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(round(d['tail_read_us']/1000.0,2))")"     >> "$GITHUB_OUTPUT"
          echo "rehydrate_eps=$(echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(round(d['rehydrate_throughput_eps'],1))")" >> "$GITHUB_OUTPUT"
          echo "rehydrate_ms=$(echo  "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(round(d['rehydrate_elapsed_ms'],0))")"    >> "$GITHUB_OUTPUT"

  # ── KurrentDB: Node Failover ───────────────────────────────────────────────
  kdb-failover:
    name: "KurrentDB: Node Failover (<= 60s)"
    runs-on: ubuntu-22.04
    if: github.event_name != 'workflow_dispatch' || inputs.job == '' || inputs.job == 'kdb-failover'
    timeout-minutes: 20
    outputs:
      passed: ${{ steps.test.outputs.passed }}
    steps:
      - uses: actions/checkout@v6

      - name: Install k3d
        run: curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | TAG=v5.8.3 bash

      - name: Create k3d cluster (1 server + 3 agents)
        run: |
          k3d cluster create failover --servers 1 --agents 3 --wait --timeout 120s
          kubectl get nodes -o wide

      - name: Pre-pull KurrentDB image
        run: |
          docker pull kurrentplatform/kurrentdb:latest
          k3d image import kurrentplatform/kurrentdb:latest -c failover

      - name: Deploy namespace and services
        run: |
          kubectl apply -f k8s/00-namespace.yaml
          kubectl apply -f k8s/02-kurrentdb/01-services.yaml

      - name: Deploy KurrentDB 3-node StatefulSet
        run: |
          kubectl apply -f - <<'EOF'
          apiVersion: apps/v1
          kind: StatefulSet
          metadata:
            name: kurrentdb
            namespace: event-store
          spec:
            serviceName: kurrentdb-headless
            replicas: 3
            podManagementPolicy: Parallel
            selector:
              matchLabels:
                app: kurrentdb
            template:
              metadata:
                labels:
                  app: kurrentdb
              spec:
                topologySpreadConstraints:
                  - maxSkew: 1
                    topologyKey: kubernetes.io/hostname
                    whenUnsatisfiable: DoNotSchedule
                    labelSelector:
                      matchLabels:
                        app: kurrentdb
                enableServiceLinks: false
                terminationGracePeriodSeconds: 10
                containers:
                  - name: kurrentdb
                    image: kurrentplatform/kurrentdb:latest
                    imagePullPolicy: IfNotPresent
                    ports:
                      - {name: http,  containerPort: 2113}
                      - {name: grpc,  containerPort: 2114}
                    env:
                      - {name: KURRENTDB_CLUSTER_SIZE,                value: "3"}
                      - {name: KURRENTDB_DISCOVER_VIA_DNS,            value: "true"}
                      - {name: KURRENTDB_CLUSTER_DNS,                 value: "kurrentdb-headless.event-store.svc.cluster.local"}
                      - {name: KURRENTDB_CLUSTER_GOSSIP_PORT,         value: "2113"}
                      - {name: KURRENTDB_NODE_PORT,                   value: "2113"}
                      - {name: KURRENTDB_INSECURE,                    value: "true"}
                      - {name: KURRENTDB_RUN_PROJECTIONS,             value: "None"}
                      - {name: KURRENTDB_START_STANDARD_PROJECTIONS,  value: "false"}
                      - {name: KURRENTDB_ENABLE_ATOM_PUB_OVER_HTTP,   value: "true"}
                      - {name: KURRENTDB_UNSAFE_DISABLE_FLUSH_TO_DISK,value: "true"}
                      - {name: KURRENTDB_DB,                          value: /data/db}
                      - {name: KURRENTDB_LOG,                         value: /data/log}
                    readinessProbe:
                      httpGet: {path: /health/live, port: 2113}
                      initialDelaySeconds: 20
                      periodSeconds: 5
                      failureThreshold: 6
                    resources:
                      requests: {cpu: "200m", memory: "256Mi"}
                      limits:   {cpu: "1",    memory: "1Gi"}
                    volumeMounts:
                      - {name: data, mountPath: /data}
                volumes:
                  - name: data
                    emptyDir: {medium: Memory, sizeLimit: 512Mi}
          EOF

      - name: Wait for 3/3 replicas ready
        run: |
          kubectl rollout status statefulset/kurrentdb -n event-store --timeout=300s
          kubectl get pods -n event-store -o wide

      - name: Wait for leader election
        run: |
          for i in $(seq 1 30); do
            for pod in kurrentdb-0 kurrentdb-1 kurrentdb-2; do
              STATE=$(kubectl exec "$pod" -n event-store -- \
                wget -qO- http://127.0.0.1:2113/info 2>/dev/null \
                | grep -oP '"state"\s*:\s*"\K[^"]+' || echo "unknown")
              [ "$STATE" = "Leader" ] && echo "Leader: $pod" && exit 0
            done
            sleep 5
          done
          echo "WARNING: no leader after 150 s — proceeding"

      - name: Run failover test
        id: test
        run: |
          chmod +x tests/03-failover-test.sh
          if ./tests/03-failover-test.sh; then
            echo "passed=True" >> "$GITHUB_OUTPUT"
          else
            echo "passed=False" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          kubectl get nodes -o wide || true
          kubectl get pods -n event-store -o wide || true
          kubectl get events -n event-store --sort-by='.lastTimestamp' 2>/dev/null | tail -40 || true
          kubectl describe pods -n event-store || true
          for pod in $(kubectl get pods -n event-store -o name 2>/dev/null); do
            kubectl logs "$pod" -n event-store --tail=50 2>&1 || true
          done

  # ── KurrentDB: Failover Impact Under Load ────────────────────────────────
  kdb-failover-impact:
    name: "KurrentDB: Short Failover Impact (Under Load)"
    runs-on: ubuntu-22.04
    if: github.event_name != 'workflow_dispatch' || inputs.job == '' || inputs.job == 'kdb-failover-impact'
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Install k3d
        run: curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | TAG=v5.8.3 bash

      - name: Create k3d cluster (1 server + 3 agents)
        run: |
          k3d cluster create failover-impact --servers 1 --agents 3 --wait --timeout 120s
          kubectl get nodes -o wide

      - name: Pre-pull KurrentDB image
        run: |
          docker pull kurrentplatform/kurrentdb:latest
          k3d image import kurrentplatform/kurrentdb:latest -c failover-impact

      - name: Deploy namespace and services
        run: |
          kubectl apply -f k8s/00-namespace.yaml
          kubectl apply -f k8s/02-kurrentdb/01-services.yaml

      - name: Deploy KurrentDB 3-node StatefulSet
        run: |
          kubectl apply -f - <<'EOF'
          apiVersion: apps/v1
          kind: StatefulSet
          metadata:
            name: kurrentdb
            namespace: event-store
          spec:
            serviceName: kurrentdb-headless
            replicas: 3
            podManagementPolicy: Parallel
            selector:
              matchLabels:
                app: kurrentdb
            template:
              metadata:
                labels:
                  app: kurrentdb
              spec:
                topologySpreadConstraints:
                  - maxSkew: 1
                    topologyKey: kubernetes.io/hostname
                    whenUnsatisfiable: DoNotSchedule
                    labelSelector:
                      matchLabels:
                        app: kurrentdb
                enableServiceLinks: false
                terminationGracePeriodSeconds: 10
                containers:
                  - name: kurrentdb
                    image: kurrentplatform/kurrentdb:latest
                    imagePullPolicy: IfNotPresent
                    ports:
                      - {name: http,  containerPort: 2113}
                      - {name: grpc,  containerPort: 2114}
                    env:
                      - {name: KURRENTDB_CLUSTER_SIZE,                value: "3"}
                      - {name: KURRENTDB_DISCOVER_VIA_DNS,            value: "true"}
                      - {name: KURRENTDB_CLUSTER_DNS,                 value: "kurrentdb-headless.event-store.svc.cluster.local"}
                      - {name: KURRENTDB_CLUSTER_GOSSIP_PORT,         value: "2113"}
                      - {name: KURRENTDB_NODE_PORT,                   value: "2113"}
                      - {name: KURRENTDB_INSECURE,                    value: "true"}
                      - {name: KURRENTDB_RUN_PROJECTIONS,             value: "None"}
                      - {name: KURRENTDB_START_STANDARD_PROJECTIONS,  value: "false"}
                      - {name: KURRENTDB_ENABLE_ATOM_PUB_OVER_HTTP,   value: "true"}
                      - {name: KURRENTDB_UNSAFE_DISABLE_FLUSH_TO_DISK,value: "true"}
                      - {name: KURRENTDB_DB,                          value: /data/db}
                      - {name: KURRENTDB_LOG,                         value: /data/log}
                    readinessProbe:
                      httpGet: {path: /health/live, port: 2113}
                      initialDelaySeconds: 20
                      periodSeconds: 5
                      failureThreshold: 6
                    resources:
                      requests: {cpu: "200m", memory: "256Mi"}
                      limits:   {cpu: "1",    memory: "1Gi"}
                    volumeMounts:
                      - {name: data, mountPath: /data}
                volumes:
                  - name: data
                    emptyDir: {medium: Memory, sizeLimit: 512Mi}
          EOF

      - name: Wait for cluster ready
        run: |
          kubectl rollout status statefulset/kurrentdb -n event-store --timeout=300s
          kubectl get pods -n event-store -o wide

      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-app/target
          key: bench-${{ runner.os }}-cargo-${{ hashFiles('rust-app/Cargo.lock') }}

      - name: Build
        run: cargo build --release --manifest-path rust-app/Cargo.toml

      - name: Run short failover-impact test
        run: |
          chmod +x tests/14-failover-impact-test.sh
          tests/14-failover-impact-test.sh | tee failover-impact.log
          if ! grep '^{' failover-impact.log > kdb-failover-impact.json; then
            echo "ERROR: Failover-impact test failed or produced no JSON output"
            tail -50 failover-impact.log >&2
            exit 1
          fi

      - name: Upload failover-impact artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: kdb-failover-impact-result
          path: kdb-failover-impact.json
          if-no-files-found: warn

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          kubectl get nodes -o wide || true
          kubectl get pods -n event-store -o wide || true
          kubectl get events -n event-store --sort-by='.lastTimestamp' 2>/dev/null | tail -60 || true
          kubectl describe pods -n event-store || true
          for pod in $(kubectl get pods -n event-store -o name 2>/dev/null); do
            kubectl logs "$pod" -n event-store --tail=80 2>&1 || true
          done

  # ── KurrentDB: Scenario — Rate Ramp (Knee-Point Discovery) ───────────────
  kdb-rate-ramp:
    name: "KurrentDB: Rate Ramp (Knee Point) [${{ matrix.mode }}]"
    runs-on: ubuntu-22.04
    if: github.event_name != 'workflow_dispatch' || inputs.job == '' || inputs.job == 'kdb-rate-ramp'
    strategy:
      fail-fast: false
      matrix:
        mode: [peak, durable]
        include:
          - {mode: peak,    event_store_mode: 0}
          - {mode: durable, event_store_mode: 1}
    steps:
      - uses: actions/checkout@v6

      - name: Install KurrentDB (MEM_DB)
        run: |
          curl -1sLf 'https://dl.cloudsmith.io/public/eventstore/kurrent-latest/setup.deb.sh' | sudo -E bash
          sudo apt-get install -y kurrentdb
          sudo systemctl stop kurrentdb || true
          getent passwd kurrentdb > /dev/null || sudo useradd --system --no-create-home --shell /usr/sbin/nologin kurrentdb
          sudo mkdir -p /tmp/esdb /tmp/esdb-log
          sudo chown kurrentdb:kurrentdb /tmp/esdb /tmp/esdb-log
          sudo mkdir -p /etc/systemd/system/kurrentdb.service.d
          printf '[Service]\nEnvironment="KURRENTDB_DB=/tmp/esdb"\nEnvironment="KURRENTDB_LOG=/tmp/esdb-log"\nEnvironment="KURRENTDB_INSECURE=true"\nEnvironment="KURRENTDB_RUN_PROJECTIONS=None"\nEnvironment="KURRENTDB_UNSAFE_DISABLE_FLUSH_TO_DISK=true"\nEnvironment="KURRENTDB_CLUSTER_SIZE=1"\nEnvironment="KURRENTDB_MEM_DB=true"\n' \
            | sudo tee /etc/systemd/system/kurrentdb.service.d/bench.conf
          sudo systemctl daemon-reload
          sudo systemctl start kurrentdb
          for i in $(seq 1 30); do curl -sf http://localhost:2113/health/live && break || sleep 2; done

      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-app/target
          key: bench-${{ runner.os }}-cargo-${{ hashFiles('rust-app/Cargo.lock') }}

      - name: Build
        run: cargo build --release --manifest-path rust-app/Cargo.toml

      - name: Rate ramp
        run: |
          DIRECT=1 BACKEND=kurrentdb EVENT_STORE_MODE=${{ matrix.event_store_mode }} KURRENT_URL_DIRECT='kurrentdb://localhost:2113?tls=false' bash tests/12-rate-ramp-test.sh | tee ramp-output.log
