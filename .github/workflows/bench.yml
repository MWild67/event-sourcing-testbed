  # ════════════════════════════════════════════════════════════════════════════
  # Combined Report — runs once, after all bench jobs complete
  # ════════════════════════════════════════════════════════════════════════════

  report:
    name: Benchmark Report
    runs-on: ubuntu-22.04
    if: always()
    needs:
      - kdb-memdb
      - kdb-docker
      - kdb-k8s
      - kdb-rehydrate
      - kdb-failover
      - mdb-docker
      - mdb-k8s
      - mdb-rehydrate
      - pg-docker
      - pg-k8s
      - pg-rehydrate
    steps:
      - name: Download mode benchmark artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: "*-bench-*"
          path: bench-artifacts
          merge-multiple: true

      - name: Generate combined summary
        env:
          KDB_MEMDB_RATE:    ${{ needs.kdb-memdb.outputs.rate }}
          KDB_MEMDB_P50:     ${{ needs.kdb-memdb.outputs.p50_us }}
          KDB_MEMDB_P95:     ${{ needs.kdb-memdb.outputs.p95_us }}
          KDB_MEMDB_P99:     ${{ needs.kdb-memdb.outputs.p99_us }}
          KDB_MEMDB_P999:    ${{ needs.kdb-memdb.outputs.p999_us }}
          KDB_DOCKER_RATE:   ${{ needs.kdb-docker.outputs.rate }}
          KDB_DOCKER_P50:    ${{ needs.kdb-docker.outputs.p50_us }}
          KDB_DOCKER_P95:    ${{ needs.kdb-docker.outputs.p95_us }}
          KDB_DOCKER_P99:    ${{ needs.kdb-docker.outputs.p99_us }}
          KDB_DOCKER_P999:   ${{ needs.kdb-docker.outputs.p999_us }}
          KDB_K8S_RATE:      ${{ needs.kdb-k8s.outputs.rate }}
          KDB_K8S_P50:       ${{ needs.kdb-k8s.outputs.p50_us }}
          KDB_K8S_P95:       ${{ needs.kdb-k8s.outputs.p95_us }}
          KDB_K8S_P99:       ${{ needs.kdb-k8s.outputs.p99_us }}
          KDB_K8S_P999:      ${{ needs.kdb-k8s.outputs.p999_us }}
          KDB_RH_WRITE_MS:   ${{ needs.kdb-rehydrate.outputs.write_ms }}
          KDB_RH_REPLAY_MS:  ${{ needs.kdb-rehydrate.outputs.replay_ms }}
          KDB_RH_WRITE_RATE: ${{ needs.kdb-rehydrate.outputs.write_rate }}
          KDB_RH_REPLAY_RATE: ${{ needs.kdb-rehydrate.outputs.replay_rate }}
          KDB_RH_PASSED:     ${{ needs.kdb-rehydrate.outputs.passed }}
          KDB_SC_WRITE_EPS:  ${{ needs.kdb-rehydrate.outputs.sc_write_eps }}
          KDB_SC_TAIL_MS:    ${{ needs.kdb-rehydrate.outputs.sc_tail_ms }}
          KDB_SC_REHY_EPS:   ${{ needs.kdb-rehydrate.outputs.sc_rehydrate_eps }}
          KDB_SC_REHY_MS:    ${{ needs.kdb-rehydrate.outputs.sc_rehydrate_ms }}
          KDB_FO_PASSED:     ${{ needs.kdb-failover.outputs.passed }}
          MDB_RH_WRITE_MS:   ${{ needs.mdb-rehydrate.outputs.write_ms }}
          MDB_RH_REPLAY_MS:  ${{ needs.mdb-rehydrate.outputs.replay_ms }}
          MDB_RH_WRITE_RATE: ${{ needs.mdb-rehydrate.outputs.write_rate }}
          MDB_RH_REPLAY_RATE: ${{ needs.mdb-rehydrate.outputs.replay_rate }}
          MDB_RH_PASSED:     ${{ needs.mdb-rehydrate.outputs.passed }}
          PG_RH_WRITE_MS:    ${{ needs.pg-rehydrate.outputs.write_ms }}
          PG_RH_REPLAY_MS:   ${{ needs.pg-rehydrate.outputs.replay_ms }}
          PG_RH_WRITE_RATE:  ${{ needs.pg-rehydrate.outputs.write_rate }}
          PG_RH_REPLAY_RATE: ${{ needs.pg-rehydrate.outputs.replay_rate }}
          PG_RH_PASSED:      ${{ needs.pg-rehydrate.outputs.passed }}
        run: |
          python3 << 'PYEOF'
          import os
          import json
          from pathlib import Path

          def e(v):   return os.getenv(v, '') or 'n/a'
          def ms(v):
              val = os.getenv(v, '')
              if not val: return 'n/a'
              try: return f'{int(val)/1000:.2f}'
              except: return 'n/a'
          def result(v):
              val = os.getenv(v, '')
              return {'True': '✓ PASS', 'False': '✗ FAIL'}.get(val, 'n/a')

          def ms_num(v):
              try:
                  return f'{int(v)/1000:.2f}'
              except Exception:
                  return 'n/a'

          def load_mode_results(base_dir: str):
              base = Path(base_dir)
              expected = [
                  'mdb-docker-peak.json',
                  'mdb-docker-durable.json',
                  'mdb-k8s-peak.json',
                  'mdb-k8s-durable.json',
                  'pg-docker-peak.json',
                  'pg-docker-durable.json',
                  'pg-k8s-peak.json',
                  'pg-k8s-durable.json',
              ]
              missing = [name for name in expected if not (base / name).exists()]
              if missing:
                  print('Missing mode benchmark artifacts:', ', '.join(missing))
                  raise SystemExit(1)

              data = {}
