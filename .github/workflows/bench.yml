  # ── Cross-Backend: Scenario — Payload + Batch-Shape Sensitivity ─────────
  payload-batch-sensitivity:
    name: "Cross-Backend: Payload + Batch-Shape Sensitivity"
    runs-on: ubuntu-22.04
    if: github.event_name != 'workflow_dispatch' || inputs.job == '' || inputs.job == 'payload-batch-sensitivity'
    steps:
      - uses: actions/checkout@v6

      - name: Start KurrentDB (MEM_DB)
        run: |
          curl -1sLf 'https://dl.cloudsmith.io/public/eventstore/kurrent-latest/setup.deb.sh' | sudo -E bash
          sudo apt-get install -y kurrentdb
          sudo systemctl stop kurrentdb || true
          getent passwd kurrentdb > /dev/null || sudo useradd --system --no-create-home --shell /usr/sbin/nologin kurrentdb
          sudo mkdir -p /tmp/esdb /tmp/esdb-log
          sudo chown kurrentdb:kurrentdb /tmp/esdb /tmp/esdb-log
          sudo mkdir -p /etc/systemd/system/kurrentdb.service.d
          printf '[Service]\nEnvironment="KURRENTDB_DB=/tmp/esdb"\nEnvironment="KURRENTDB_LOG=/tmp/esdb-log"\nEnvironment="KURRENTDB_INSECURE=true"\nEnvironment="KURRENTDB_RUN_PROJECTIONS=None"\nEnvironment="KURRENTDB_UNSAFE_DISABLE_FLUSH_TO_DISK=true"\nEnvironment="KURRENTDB_CLUSTER_SIZE=1"\nEnvironment="KURRENTDB_MEM_DB=true"\n' \
            | sudo tee /etc/systemd/system/kurrentdb.service.d/bench.conf
          sudo systemctl daemon-reload
          sudo systemctl start kurrentdb
          for i in $(seq 1 30); do curl -sf http://localhost:2113/health/live && break || sleep 2; done

      - name: Start MongoDB
        run: |
          docker run -d --name mongodb -p 27017:27017 --tmpfs /data/db \
            mongo:7 mongod --quiet --bind_ip_all --replSet rs0 --wiredTigerCacheSizeGB 0.25
          for i in $(seq 1 30); do
            docker exec mongodb mongosh --quiet --eval "db.adminCommand('ping').ok" \
              mongodb://localhost:27017/admin 2>/dev/null && break || sleep 2
          done
          docker exec mongodb mongosh --quiet --eval \
            "rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]})"
          for i in $(seq 1 20); do
            docker exec mongodb mongosh --quiet --eval \
              "if (rs.isMaster().ismaster !== true) { throw 'no primary'; }" \
              2>/dev/null && break || sleep 3
          done

      - name: Start PostgreSQL
        run: |
          docker run -d --name pg \
            -e POSTGRES_DB=eventbench -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres \
            -p 5432:5432 --tmpfs /var/lib/postgresql/data \
            postgres:16 -c fsync=off -c full_page_writes=off -c max_connections=200
          for i in $(seq 1 30); do
            docker exec pg pg_isready -U postgres -d eventbench && break || sleep 2
          done

      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-app/target
          key: bench-${{ runner.os }}-cargo-${{ hashFiles('rust-app/Cargo.lock') }}

      - name: Build
        run: cargo build --release --manifest-path rust-app/Cargo.toml

      - name: Payload + batch-shape sensitivity test
        run: |
          chmod +x tests/16-payload-batch-sensitivity-test.sh
          DIRECT=1 \
          TESTBED_BIN='rust-app/target/release/testbed' \
          BACKENDS='kurrentdb mongodb postgres' \
          KURRENT_URL_DIRECT='kurrentdb://localhost:2113?tls=false' \
          MONGO_URL_DIRECT='mongodb://localhost:27017/?directConnection=true' \
          POSTGRES_URL_DIRECT='postgres://postgres:postgres@localhost:5432/eventbench' \
          PAYLOAD_SIZES='256 1024 4096' \
          BATCH_SIZES='1 8' \
          TARGET_RATE=5000 \
          CONCURRENCY=64 \
          DURATION_SECS=12 \
          EVENT_STORE_MODE=0 \
          bash tests/16-payload-batch-sensitivity-test.sh | tee payload-batch-output.log
          if ! grep '^{' payload-batch-output.log > payload-batch-sensitivity.json; then
            echo "ERROR: Payload/batch-sensitivity test failed or produced no JSON output"
            tail -50 payload-batch-output.log >&2
            exit 1
          fi

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: payload-batch-sensitivity-result
          path: payload-batch-sensitivity.json
          if-no-files-found: warn

      - name: Cleanup
        if: always()
        run: |
          docker stop mongodb pg 2>/dev/null || true
          docker rm mongodb pg 2>/dev/null || true

  pg-docker:
    name: "PostgreSQL: Docker (tmpfs) [${{ matrix.mode }}]"
    runs-on: ubuntu-22.04
    if: github.event_name != 'workflow_dispatch' || inputs.job == '' || inputs.job == 'pg-docker'
    strategy:
      fail-fast: false
      matrix:
        mode: [peak, durable]
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-app/target
          key: bench-${{ runner.os }}-cargo-${{ hashFiles('rust-app/Cargo.lock') }}

      - name: Build
        run: cargo build --release --manifest-path rust-app/Cargo.toml

      - name: Start PostgreSQL
        run: |
          docker run -d --name pg \
            -e POSTGRES_DB=eventbench -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres \
            -p 5432:5432 --tmpfs /var/lib/postgresql/data \
            postgres:16 -c fsync=off -c full_page_writes=off -c max_connections=200
          for i in $(seq 1 30); do
            docker exec pg pg_isready -U postgres -d eventbench && break || sleep 2
          done

      - name: Benchmark
        id: bench
        run: |
          MODE_FLAG=""
          if [ "${{ matrix.mode }}" = "durable" ]; then
            MODE_FLAG="--event-store-mode"
          fi

          RESULT=$(rust-app/target/release/testbed \
            --postgres-url "postgres://postgres:postgres@localhost:5432/eventbench" \
            pg-bench --target-rate 10000 --concurrency 64 --batch-size 1 --duration-secs 30 ${MODE_FLAG} --json)
          echo "$RESULT"
          echo "$RESULT" > "pg-docker-${{ matrix.mode }}.json"
          echo "rate=$(echo    "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(round(d['actual_rate_eps'],1))")" >> "$GITHUB_OUTPUT"
          echo "p50_us=$(echo  "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['p50_us'])")"  >> "$GITHUB_OUTPUT"
          echo "p95_us=$(echo  "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['p95_us'])")"  >> "$GITHUB_OUTPUT"
          echo "p99_us=$(echo  "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['p99_us'])")"  >> "$GITHUB_OUTPUT"
          echo "p999_us=$(echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['p999_us'])")" >> "$GITHUB_OUTPUT"

      - name: Validate event-store features
        if: ${{ matrix.mode == 'durable' }}
        run: |
          rust-app/target/release/testbed \
            --postgres-url "postgres://postgres:postgres@localhost:5432/eventbench" \
            pg-event-store-demo --events 5

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v6
        with:
          name: pg-docker-bench-${{ matrix.mode }}
          path: pg-docker-${{ matrix.mode }}.json
          if-no-files-found: error

      - name: Stop PostgreSQL
        if: always()
        run: docker stop pg && docker rm pg || true

  # ── PostgreSQL: Kubernetes Benchmark ─────────────────────────────────────
  pg-k8s:
    name: "PostgreSQL: Kubernetes (single-node) [${{ matrix.mode }}]"
    runs-on: ubuntu-22.04
    if: github.event_name != 'workflow_dispatch' || inputs.job == '' || inputs.job == 'pg-k8s'
    strategy:
      fail-fast: false
      matrix:
        mode: [peak, durable]
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-app/target
          key: bench-${{ runner.os }}-cargo-${{ hashFiles('rust-app/Cargo.lock') }}

      - name: Build
        run: cargo build --release --manifest-path rust-app/Cargo.toml

      - name: Install k3d + kubectl
        run: |
          curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | TAG=v5.8.3 bash
          curl -LO "https://dl.k8s.io/release/$(curl -sSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/

      - name: Create k3d cluster
        run: k3d cluster create bench --servers 1 --agents 1 --no-lb --wait

      - name: Pre-pull postgres:16
        run: |
          docker pull postgres:16
          k3d image import postgres:16 -c bench

      - name: Deploy PostgreSQL
        run: |
          kubectl apply -f k8s/00-namespace.yaml
          kubectl apply -f k8s/06-postgres/

      - name: Wait for PostgreSQL
        run: |
          kubectl rollout status statefulset/postgres -n event-store --timeout=300s
          for i in $(seq 1 40); do
            kubectl exec -n event-store postgres-0 -- pg_isready -U postgres -d eventbench 2>/dev/null && break || sleep 5
          done

      - name: Port-forward PostgreSQL
        run: |
          kubectl port-forward -n event-store pod/postgres-0 5432:5432 &
          echo "PF_PID=$!" >> "$GITHUB_ENV"
          sleep 3

      - name: Benchmark
        id: bench
        run: |
          MODE_FLAG=""
          if [ "${{ matrix.mode }}" = "durable" ]; then
            MODE_FLAG="--event-store-mode"
          fi

          RESULT=$(rust-app/target/release/testbed \
            --postgres-url "postgres://postgres:postgres@localhost:5432/eventbench" \
            pg-bench --target-rate 10000 --concurrency 64 --batch-size 1 --duration-secs 30 ${MODE_FLAG} --json)
          echo "$RESULT"
          echo "$RESULT" > "pg-k8s-${{ matrix.mode }}.json"
          echo "rate=$(echo    "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(round(d['actual_rate_eps'],1))")" >> "$GITHUB_OUTPUT"
          echo "p50_us=$(echo  "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['p50_us'])")"  >> "$GITHUB_OUTPUT"
          echo "p95_us=$(echo  "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['p95_us'])")"  >> "$GITHUB_OUTPUT"
          echo "p99_us=$(echo  "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['p99_us'])")"  >> "$GITHUB_OUTPUT"
          echo "p999_us=$(echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['p999_us'])")" >> "$GITHUB_OUTPUT"

      - name: Validate event-store features
        if: ${{ matrix.mode == 'durable' }}
        run: |
          rust-app/target/release/testbed \
            --postgres-url "postgres://postgres:postgres@localhost:5432/eventbench" \
            pg-event-store-demo --events 5

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v6
        with:
          name: pg-k8s-bench-${{ matrix.mode }}
          path: pg-k8s-${{ matrix.mode }}.json
          if-no-files-found: error

      - name: Stop port-forward
        if: always()
        run: kill "$PF_PID" 2>/dev/null || true

      - name: Dump pod diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -n event-store -o wide || true
          kubectl get events -n event-store --sort-by='.lastTimestamp' 2>/dev/null | tail -40 || true
          kubectl describe pods -n event-store || true
          for pod in $(kubectl get pods -n event-store -o name 2>/dev/null); do
            kubectl logs "$pod" -n event-store --tail=50 2>&1 || true
          done

  # ── PostgreSQL: Rehydration / Replay ─────────────────────────────────────
  pg-rehydrate:
    name: "PostgreSQL: Rehydration / Replay"
    runs-on: ubuntu-22.04
    if: github.event_name != 'workflow_dispatch' || inputs.job == '' || inputs.job == 'pg-rehydrate'
    outputs:
      write_ms:    ${{ steps.demo.outputs.write_ms }}
      replay_ms:   ${{ steps.demo.outputs.replay_ms }}
      write_rate:  ${{ steps.demo.outputs.write_rate }}
      replay_rate: ${{ steps.demo.outputs.replay_rate }}
      passed:      ${{ steps.demo.outputs.passed }}
    steps:
      - uses: actions/checkout@v6

      - name: Start PostgreSQL
        run: |
          docker run -d --name pg \
            -e POSTGRES_DB=eventbench -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres \
            -p 5432:5432 --tmpfs /var/lib/postgresql/data \
            postgres:16 -c fsync=off -c full_page_writes=off -c max_connections=200
          for i in $(seq 1 30); do
            docker exec pg pg_isready -U postgres -d eventbench && break || sleep 2
          done

      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-app/target
          key: bench-${{ runner.os }}-cargo-${{ hashFiles('rust-app/Cargo.lock') }}

      - name: Build
        run: cargo build --release --manifest-path rust-app/Cargo.toml

      - name: Rehydration demo
        id: demo
        run: |
          RESULT=$(rust-app/target/release/testbed \
            --postgres-url "postgres://postgres:postgres@localhost:5432/eventbench" \
            pg-rehydrate-demo --json)
          echo "$RESULT"
          JSON=$(echo "$RESULT" | tail -n 1)
          echo "write_ms=$(echo    "$JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['write_ms'])")"                >> "$GITHUB_OUTPUT"
          echo "replay_ms=$(echo   "$JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['replay_ms'])")"               >> "$GITHUB_OUTPUT"
          echo "write_rate=$(echo  "$JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(round(d['write_rate_eps'],1))")"  >> "$GITHUB_OUTPUT"
          echo "replay_rate=$(echo "$JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(round(d['replay_rate_eps'],1))")" >> "$GITHUB_OUTPUT"
          PASSED=$(echo "$JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['passed'])")
          echo "passed=$PASSED" >> "$GITHUB_OUTPUT"
          [ "$PASSED" = "True" ] || { echo "PostgreSQL rehydration FAILED"; exit 1; }

      - name: Dump Docker logs on failure
        if: failure()
