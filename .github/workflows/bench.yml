name: Benchmarks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      job:
        description: 'Job to run (blank = all)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - kdb-memdb
          - kdb-docker
          - kdb-k8s
          - kdb-rehydrate
          - kdb-failover
          - kdb-failover-impact
          - kdb-rate-ramp
          - kdb-replay-under-write
          - mdb-docker
          - mdb-k8s
          - mdb-rehydrate
          - mdb-rate-ramp
          - mdb-replay-under-write
          - pg-docker
          - pg-k8s
          - pg-rehydrate
          - pg-rate-ramp
          - pg-replay-under-write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# One run per ref; cancel in-progress on new push.
concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ════════════════════════════════════════════════════════════════════════════
  # KurrentDB
  #   - Core throughput (MEM_DB / Docker / Kubernetes)
  #   - Rehydration + scale
  #   - Reliability/failover
  #   - Scenario tests (rate ramp, replay-under-write)
  # ════════════════════════════════════════════════════════════════════════════

  kdb-memdb:
    name: "KurrentDB: In-Memory (MEM_DB)"
    runs-on: ubuntu-22.04
    if: github.event_name != 'workflow_dispatch' || inputs.job == '' || inputs.job == 'kdb-memdb'
    outputs:
      rate:    ${{ steps.bench.outputs.rate }}
      p50_us:  ${{ steps.bench.outputs.p50_us }}
      p95_us:  ${{ steps.bench.outputs.p95_us }}
      p99_us:  ${{ steps.bench.outputs.p99_us }}
      p999_us: ${{ steps.bench.outputs.p999_us }}
    steps:
      - uses: actions/checkout@v6

      - name: Install KurrentDB (MEM_DB)
        run: |
          curl -1sLf 'https://dl.cloudsmith.io/public/eventstore/kurrent-latest/setup.deb.sh' | sudo -E bash
          sudo apt-get install -y kurrentdb
          sudo systemctl stop kurrentdb || true
          getent passwd kurrentdb > /dev/null || sudo useradd --system --no-create-home --shell /usr/sbin/nologin kurrentdb
          sudo mkdir -p /tmp/esdb /tmp/esdb-log
          sudo chown kurrentdb:kurrentdb /tmp/esdb /tmp/esdb-log
          sudo mkdir -p /etc/systemd/system/kurrentdb.service.d
          printf '[Service]\nEnvironment="KURRENTDB_DB=/tmp/esdb"\nEnvironment="KURRENTDB_LOG=/tmp/esdb-log"\nEnvironment="KURRENTDB_INSECURE=true"\nEnvironment="KURRENTDB_RUN_PROJECTIONS=None"\nEnvironment="KURRENTDB_UNSAFE_DISABLE_FLUSH_TO_DISK=true"\nEnvironment="KURRENTDB_CLUSTER_SIZE=1"\nEnvironment="KURRENTDB_MEM_DB=true"\n' \
            | sudo tee /etc/systemd/system/kurrentdb.service.d/bench.conf
          sudo systemctl daemon-reload
          sudo systemctl start kurrentdb
          for i in $(seq 1 30); do curl -sf http://localhost:2113/health/live && break || sleep 2; done
          ES_PID=$(systemctl show -p MainPID kurrentdb | cut -d= -f2)
          sudo renice -n -15 -p "$ES_PID"

      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-app/target
          key: bench-${{ runner.os }}-cargo-${{ hashFiles('rust-app/Cargo.lock') }}

      - name: Build
        run: cargo build --release --manifest-path rust-app/Cargo.toml

      - name: Benchmark
        id: bench
        run: |
          RESULT=$(rust-app/target/release/testbed \
            --kurrentdb-url "kurrentdb://localhost:2113?tls=false" \
            kurrentdb-bench --target-rate 10000 --concurrency 64 --batch-size 1 --duration-secs 30 --json)
          echo "$RESULT"
          echo "rate=$(echo    "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(round(d['actual_rate_eps'],1))")" >> "$GITHUB_OUTPUT"
          echo "p50_us=$(echo  "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['p50_us'])")"  >> "$GITHUB_OUTPUT"
          echo "p95_us=$(echo  "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['p95_us'])")"  >> "$GITHUB_OUTPUT"
          echo "p99_us=$(echo  "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['p99_us'])")"  >> "$GITHUB_OUTPUT"
          echo "p999_us=$(echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['p999_us'])")" >> "$GITHUB_OUTPUT"

  # ── KurrentDB: Docker Benchmark ──────────────────────────────────────────
  kdb-docker:
    name: "KurrentDB: Docker (tmpfs) [${{ matrix.mode }}]"
    runs-on: ubuntu-22.04
    if: github.event_name != 'workflow_dispatch' || inputs.job == '' || inputs.job == 'kdb-docker'
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: peak
            flush_to_disk_disable: "true"
          - mode: durable
            flush_to_disk_disable: "false"
    steps:
      - uses: actions/checkout@v6

      - name: Start KurrentDB on tmpfs
        run: |
          docker run -d --name kurrentdb -p 2113:2113 --tmpfs /data \
            -e KURRENTDB_CLUSTER_SIZE=1 \
            -e KURRENTDB_INSECURE=true \
            -e KURRENTDB_RUN_PROJECTIONS=None \
            -e KURRENTDB_START_STANDARD_PROJECTIONS=false \
            -e KURRENTDB_UNSAFE_DISABLE_FLUSH_TO_DISK=${{ matrix.flush_to_disk_disable }} \
            -e KURRENTDB_ENABLE_ATOM_PUB_OVER_HTTP=true \
            -e KURRENTDB_DB=/data/db \
            -e KURRENTDB_LOG=/data/log \
            kurrentplatform/kurrentdb:latest
          for i in $(seq 1 30); do curl -sf http://localhost:2113/health/live && break || sleep 2; done

      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-app/target
          key: bench-${{ runner.os }}-cargo-${{ hashFiles('rust-app/Cargo.lock') }}

      - name: Build
        run: cargo build --release --manifest-path rust-app/Cargo.toml

      - name: Benchmark
        id: bench
        run: |
          RESULT=$(rust-app/target/release/testbed \
            --kurrentdb-url "kurrentdb://localhost:2113?tls=false" \
            kurrentdb-bench --target-rate 10000 --concurrency 64 --batch-size 1 --duration-secs 30 --json)
          echo "$RESULT"
          echo "$RESULT" > "kdb-docker-${{ matrix.mode }}.json"
          echo "rate=$(echo    "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(round(d['actual_rate_eps'],1))")" >> "$GITHUB_OUTPUT"
          echo "p50_us=$(echo  "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['p50_us'])")"  >> "$GITHUB_OUTPUT"
          echo "p95_us=$(echo  "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['p95_us'])")"  >> "$GITHUB_OUTPUT"
          echo "p99_us=$(echo  "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['p99_us'])")"  >> "$GITHUB_OUTPUT"
          echo "p999_us=$(echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['p999_us'])")" >> "$GITHUB_OUTPUT"

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v6
        with:
          name: kdb-docker-bench-${{ matrix.mode }}
          path: kdb-docker-${{ matrix.mode }}.json
          if-no-files-found: error

      - name: Dump Docker logs on failure
        if: failure()
        run: docker logs kurrentdb --tail 50 || true

      - name: Stop KurrentDB
        if: always()
        run: docker stop kurrentdb && docker rm kurrentdb || true

  # ── KurrentDB: Kubernetes Benchmark ──────────────────────────────────────
  kdb-k8s:
    name: "KurrentDB: Kubernetes (single-node, tmpfs) [${{ matrix.mode }}]"
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: peak
            flush_to_disk_disable: "true"
          - mode: durable
            flush_to_disk_disable: "false"
    steps:
      - uses: actions/checkout@v6

      - name: Install k3d
        run: curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | TAG=v5.8.3 bash

      - name: Create k3d cluster
        run: k3d cluster create testbed --servers 1 --no-lb --wait --timeout 120s

      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-app/target
          key: bench-${{ runner.os }}-cargo-${{ hashFiles('rust-app/Cargo.lock') }}

      - name: Build
        run: cargo build --release --manifest-path rust-app/Cargo.toml

      - name: Pre-pull KurrentDB image
        run: |
          docker pull kurrentplatform/kurrentdb:latest
          k3d image import kurrentplatform/kurrentdb:latest -c testbed

      - name: Deploy KurrentDB (single-node, emptyDir Memory)
        run: |
          kubectl apply -f k8s/00-namespace.yaml
          kubectl apply -f k8s/02-kurrentdb/01-services.yaml
          kubectl apply -f - <<'EOF'
          apiVersion: apps/v1
          kind: StatefulSet
          metadata:
            name: kurrentdb
            namespace: event-store
          spec:
            serviceName: kurrentdb-headless
            replicas: 1
            selector:
              matchLabels:
                app: kurrentdb
            template:
              metadata:
                labels:
                  app: kurrentdb
              spec:
                enableServiceLinks: false
                containers:
                  - name: kurrentdb
                    image: kurrentplatform/kurrentdb:latest
                    imagePullPolicy: IfNotPresent
                    ports:
                      - containerPort: 2113
                    env:
                      - {name: KURRENTDB_CLUSTER_SIZE,                value: "1"}
                      - {name: KURRENTDB_INSECURE,                    value: "true"}
                      - {name: KURRENTDB_RUN_PROJECTIONS,             value: "None"}
                      - {name: KURRENTDB_START_STANDARD_PROJECTIONS,  value: "false"}
                      - {name: KURRENTDB_UNSAFE_DISABLE_FLUSH_TO_DISK,value: "${{ matrix.flush_to_disk_disable }}"}
                      - {name: KURRENTDB_DB,                          value: /data/db}
                      - {name: KURRENTDB_LOG,                         value: /data/log}
                      - {name: KURRENTDB_ENABLE_ATOM_PUB_OVER_HTTP,   value: "true"}
                    volumeMounts:
                      - {name: data, mountPath: /data}
                volumes:
                  - name: data
                    emptyDir: {medium: Memory, sizeLimit: 512Mi}
          EOF

      - name: Wait for KurrentDB
        run: |
          kubectl rollout status statefulset/kurrentdb -n event-store --timeout=120s
          start_pf() { kill "$PF_PID" 2>/dev/null || true; kubectl port-forward -n event-store pod/kurrentdb-0 2113:2113 & PF_PID=$!; sleep 3; }
          PF_PID=""; start_pf
          for i in $(seq 1 60); do
            kill -0 "$PF_PID" 2>/dev/null || { start_pf; }
            curl -sf --connect-timeout 5 http://localhost:2113/health/live 2>/dev/null && kill $PF_PID 2>/dev/null && exit 0
            [ $((i % 5)) -eq 0 ] && kubectl logs -n event-store pod/kurrentdb-0 --tail=20 2>&1 || true
            sleep 5
          done
          kill $PF_PID 2>/dev/null || true; exit 1

      - name: Dump pod diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -n event-store -o wide || true
          kubectl get events -n event-store --sort-by='.lastTimestamp' 2>/dev/null | tail -40 || true
          kubectl describe pods -n event-store || true
          for pod in $(kubectl get pods -n event-store -o name 2>/dev/null); do
            kubectl logs "$pod" -n event-store --tail=50 2>&1 || true
          done

      - name: Benchmark
        id: bench
        run: |
          kubectl port-forward -n event-store pod/kurrentdb-0 2113:2113 & PF_PID=$!; sleep 3
          RESULT=$(rust-app/target/release/testbed \
            --kurrentdb-url "kurrentdb://localhost:2113?tls=false" \
            kurrentdb-bench --target-rate 10000 --duration-secs 30 --concurrency 64 --batch-size 1 --json)
          kill $PF_PID 2>/dev/null || true
          echo "$RESULT"
          echo "$RESULT" > "kdb-k8s-${{ matrix.mode }}.json"
          echo "rate=$(echo    "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(round(d['actual_rate_eps'],1))")" >> "$GITHUB_OUTPUT"
          echo "p50_us=$(echo  "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['p50_us'])")"  >> "$GITHUB_OUTPUT"
          echo "p95_us=$(echo  "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['p95_us'])")"  >> "$GITHUB_OUTPUT"
          echo "p99_us=$(echo  "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['p99_us'])")"  >> "$GITHUB_OUTPUT"
          echo "p999_us=$(echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['p999_us'])")" >> "$GITHUB_OUTPUT"

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v6
        with:
          name: kdb-k8s-bench-${{ matrix.mode }}
          path: kdb-k8s-${{ matrix.mode }}.json
          if-no-files-found: error

  # ── KurrentDB: Rehydration + Scale (100k) ────────────────────────────────
  kdb-rehydrate:
    name: "KurrentDB: Rehydration / Replay + Scale (100k)"
    runs-on: ubuntu-22.04
    if: github.event_name != 'workflow_dispatch' || inputs.job == '' || inputs.job == 'kdb-rehydrate'
    outputs:
      write_ms:         ${{ steps.demo.outputs.write_ms }}
      replay_ms:        ${{ steps.demo.outputs.replay_ms }}
      write_rate:       ${{ steps.demo.outputs.write_rate }}
      replay_rate:      ${{ steps.demo.outputs.replay_rate }}
      passed:           ${{ steps.demo.outputs.passed }}
      sc_write_eps:     ${{ steps.scale.outputs.write_eps }}
      sc_tail_ms:       ${{ steps.scale.outputs.tail_ms }}
      sc_rehydrate_eps: ${{ steps.scale.outputs.rehydrate_eps }}
      sc_rehydrate_ms:  ${{ steps.scale.outputs.rehydrate_ms }}
    steps:
      - uses: actions/checkout@v6

      - name: Install KurrentDB (in-memory)
        run: |
          curl -1sLf 'https://dl.cloudsmith.io/public/eventstore/kurrent-latest/setup.deb.sh' | sudo -E bash
          sudo apt-get install -y kurrentdb
          sudo systemctl stop kurrentdb || true
          getent passwd kurrentdb > /dev/null || sudo useradd --system --no-create-home --shell /usr/sbin/nologin kurrentdb
          sudo mkdir -p /tmp/esdb /tmp/esdb-log
          sudo chown kurrentdb:kurrentdb /tmp/esdb /tmp/esdb-log
          sudo mkdir -p /etc/systemd/system/kurrentdb.service.d
          printf '[Service]\nEnvironment="KURRENTDB_DB=/tmp/esdb"\nEnvironment="KURRENTDB_LOG=/tmp/esdb-log"\nEnvironment="KURRENTDB_INSECURE=true"\nEnvironment="KURRENTDB_RUN_PROJECTIONS=None"\nEnvironment="KURRENTDB_UNSAFE_DISABLE_FLUSH_TO_DISK=true"\nEnvironment="KURRENTDB_CLUSTER_SIZE=1"\nEnvironment="KURRENTDB_MEM_DB=true"\n' \
            | sudo tee /etc/systemd/system/kurrentdb.service.d/bench.conf
          sudo systemctl daemon-reload
          sudo systemctl start kurrentdb
          for i in $(seq 1 30); do curl -sf http://localhost:2113/health/live && break || sleep 2; done

      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-app/target
          key: bench-${{ runner.os }}-cargo-${{ hashFiles('rust-app/Cargo.lock') }}

      - name: Build
        run: cargo build --release --manifest-path rust-app/Cargo.toml

      - name: Rehydration demo
        id: demo
        run: |
          RESULT=$(rust-app/target/release/testbed \
            --kurrentdb-url "kurrentdb://localhost:2113?tls=false" \
            kurrentdb-rehydrate-demo --json)
          echo "$RESULT"
          JSON=$(echo "$RESULT" | tail -n 1)
          echo "write_ms=$(echo    "$JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['write_ms'])")"                   >> "$GITHUB_OUTPUT"
          echo "replay_ms=$(echo   "$JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['replay_ms'])")"                  >> "$GITHUB_OUTPUT"
          echo "write_rate=$(echo  "$JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(round(d['write_rate_eps'],1))")"     >> "$GITHUB_OUTPUT"
          echo "replay_rate=$(echo "$JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(round(d['replay_rate_eps'],1))")"    >> "$GITHUB_OUTPUT"
          PASSED=$(echo "$JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['passed'])")
          echo "passed=$PASSED" >> "$GITHUB_OUTPUT"
          [ "$PASSED" = "True" ] || { echo "KurrentDB rehydration FAILED"; exit 1; }

      - name: Scale benchmark (100 k events, same instance)
        id: scale
        run: |
          RESULT=$(rust-app/target/release/testbed \
            --kurrentdb-url "kurrentdb://localhost:2113?tls=false" \
            kurrentdb-scale-bench --scale-events 100000 --batch-size 500 --stream-name ci-scale-test11 --json)
          echo "$RESULT"
          echo "write_eps=$(echo     "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(round(d['write_throughput_eps'],1))")"    >> "$GITHUB_OUTPUT"
          echo "tail_ms=$(echo       "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(round(d['tail_read_us']/1000.0,2))")"     >> "$GITHUB_OUTPUT"
          echo "rehydrate_eps=$(echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(round(d['rehydrate_throughput_eps'],1))")" >> "$GITHUB_OUTPUT"
          echo "rehydrate_ms=$(echo  "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(round(d['rehydrate_elapsed_ms'],0))")"    >> "$GITHUB_OUTPUT"

  # ── KurrentDB: Node Failover (AC-3) ──────────────────────────────────────
  kdb-failover:
    name: "KurrentDB: Node Failover (<= 60s)"
    runs-on: ubuntu-22.04
    if: github.event_name != 'workflow_dispatch' || inputs.job == '' || inputs.job == 'kdb-failover'
    timeout-minutes: 20
    outputs:
      passed: ${{ steps.test.outputs.passed }}
    steps:
      - uses: actions/checkout@v6

      - name: Install k3d
        run: curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | TAG=v5.8.3 bash

      - name: Create k3d cluster (1 server + 3 agents)
        run: |
          k3d cluster create failover --servers 1 --agents 3 --wait --timeout 120s
          kubectl get nodes -o wide

      - name: Pre-pull KurrentDB image
        run: |
          docker pull kurrentplatform/kurrentdb:latest
          k3d image import kurrentplatform/kurrentdb:latest -c failover

      - name: Deploy namespace and services
        run: |
          kubectl apply -f k8s/00-namespace.yaml
          kubectl apply -f k8s/02-kurrentdb/01-services.yaml

      - name: Deploy KurrentDB 3-node StatefulSet
        run: |
          kubectl apply -f - <<'EOF'
          apiVersion: apps/v1
          kind: StatefulSet
          metadata:
            name: kurrentdb
            namespace: event-store
          spec:
            serviceName: kurrentdb-headless
            replicas: 3
            podManagementPolicy: Parallel
            selector:
              matchLabels:
                app: kurrentdb
            template:
              metadata:
                labels:
                  app: kurrentdb
              spec:
                topologySpreadConstraints:
                  - maxSkew: 1
                    topologyKey: kubernetes.io/hostname
                    whenUnsatisfiable: DoNotSchedule
                    labelSelector:
                      matchLabels:
                        app: kurrentdb
                enableServiceLinks: false
                terminationGracePeriodSeconds: 10
                containers:
                  - name: kurrentdb
                    image: kurrentplatform/kurrentdb:latest
                    imagePullPolicy: IfNotPresent
                    ports:
                      - {name: http,  containerPort: 2113}
                      - {name: grpc,  containerPort: 2114}
                    env:
                      - {name: KURRENTDB_CLUSTER_SIZE,                value: "3"}
                      - {name: KURRENTDB_DISCOVER_VIA_DNS,            value: "true"}
                      - {name: KURRENTDB_CLUSTER_DNS,                 value: "kurrentdb-headless.event-store.svc.cluster.local"}
                      - {name: KURRENTDB_CLUSTER_GOSSIP_PORT,         value: "2113"}
                      - {name: KURRENTDB_NODE_PORT,                   value: "2113"}
                      - {name: KURRENTDB_INSECURE,                    value: "true"}
                      - {name: KURRENTDB_RUN_PROJECTIONS,             value: "None"}
                      - {name: KURRENTDB_START_STANDARD_PROJECTIONS,  value: "false"}
                      - {name: KURRENTDB_ENABLE_ATOM_PUB_OVER_HTTP,   value: "true"}
                      - {name: KURRENTDB_UNSAFE_DISABLE_FLUSH_TO_DISK,value: "true"}
                      - {name: KURRENTDB_DB,                          value: /data/db}
                      - {name: KURRENTDB_LOG,                         value: /data/log}
                    readinessProbe:
                      httpGet: {path: /health/live, port: 2113}
                      initialDelaySeconds: 20
                      periodSeconds: 5
                      failureThreshold: 6
                    resources:
                      requests: {cpu: "200m", memory: "256Mi"}
                      limits:   {cpu: "1",    memory: "1Gi"}
                    volumeMounts:
                      - {name: data, mountPath: /data}
                volumes:
                  - name: data
                    emptyDir: {medium: Memory, sizeLimit: 512Mi}
          EOF

      - name: Wait for 3/3 replicas ready
        run: |
          kubectl rollout status statefulset/kurrentdb -n event-store --timeout=300s
          kubectl get pods -n event-store -o wide

      - name: Wait for leader election
        run: |
          for i in $(seq 1 30); do
            for pod in kurrentdb-0 kurrentdb-1 kurrentdb-2; do
              STATE=$(kubectl exec "$pod" -n event-store -- \
                wget -qO- http://127.0.0.1:2113/info 2>/dev/null \
                | grep -oP '"state"\s*:\s*"\K[^"]+' || echo "unknown")
              [ "$STATE" = "Leader" ] && echo "Leader: $pod" && exit 0
            done
            sleep 5
          done
          echo "WARNING: no leader after 150 s — proceeding"

      - name: Run failover test
        id: test
        run: |
          chmod +x tests/03-failover-test.sh
          if ./tests/03-failover-test.sh; then
            echo "passed=True" >> "$GITHUB_OUTPUT"
          else
            echo "passed=False" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          kubectl get nodes -o wide || true
          kubectl get pods -n event-store -o wide || true
          kubectl get events -n event-store --sort-by='.lastTimestamp' 2>/dev/null | tail -40 || true
          kubectl describe pods -n event-store || true
          for pod in $(kubectl get pods -n event-store -o name 2>/dev/null); do
            kubectl logs "$pod" -n event-store --tail=50 2>&1 || true
          done

  # ── KurrentDB: Failover Impact Under Load ────────────────────────────────
  kdb-failover-impact:
    name: "KurrentDB: Short Failover Impact (Under Load)"
    runs-on: ubuntu-22.04
    if: github.event_name != 'workflow_dispatch' || inputs.job == '' || inputs.job == 'kdb-failover-impact'
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Install k3d
        run: curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | TAG=v5.8.3 bash

      - name: Create k3d cluster (1 server + 3 agents)
        run: |
          k3d cluster create failover-impact --servers 1 --agents 3 --wait --timeout 120s
          kubectl get nodes -o wide

      - name: Pre-pull KurrentDB image
        run: |
          docker pull kurrentplatform/kurrentdb:latest
          k3d image import kurrentplatform/kurrentdb:latest -c failover-impact

      - name: Deploy namespace and services
        run: |
          kubectl apply -f k8s/00-namespace.yaml
          kubectl apply -f k8s/02-kurrentdb/01-services.yaml

      - name: Deploy KurrentDB 3-node StatefulSet
        run: |
          kubectl apply -f - <<'EOF'
          apiVersion: apps/v1
          kind: StatefulSet
          metadata:
            name: kurrentdb
            namespace: event-store
          spec:
            serviceName: kurrentdb-headless
            replicas: 3
            podManagementPolicy: Parallel
            selector:
              matchLabels:
                app: kurrentdb
            template:
              metadata:
                labels:
                  app: kurrentdb
              spec:
                topologySpreadConstraints:
                  - maxSkew: 1
                    topologyKey: kubernetes.io/hostname
                    whenUnsatisfiable: DoNotSchedule
                    labelSelector:
                      matchLabels:
                        app: kurrentdb
                enableServiceLinks: false
                terminationGracePeriodSeconds: 10
                containers:
                  - name: kurrentdb
                    image: kurrentplatform/kurrentdb:latest
                    imagePullPolicy: IfNotPresent
                    ports:
                      - {name: http,  containerPort: 2113}
                      - {name: grpc,  containerPort: 2114}
                    env:
                      - {name: KURRENTDB_CLUSTER_SIZE,                value: "3"}
                      - {name: KURRENTDB_DISCOVER_VIA_DNS,            value: "true"}
                      - {name: KURRENTDB_CLUSTER_DNS,                 value: "kurrentdb-headless.event-store.svc.cluster.local"}
                      - {name: KURRENTDB_CLUSTER_GOSSIP_PORT,         value: "2113"}
                      - {name: KURRENTDB_NODE_PORT,                   value: "2113"}
                      - {name: KURRENTDB_INSECURE,                    value: "true"}
                      - {name: KURRENTDB_RUN_PROJECTIONS,             value: "None"}
                      - {name: KURRENTDB_START_STANDARD_PROJECTIONS,  value: "false"}
                      - {name: KURRENTDB_ENABLE_ATOM_PUB_OVER_HTTP,   value: "true"}
                      - {name: KURRENTDB_UNSAFE_DISABLE_FLUSH_TO_DISK,value: "true"}
                      - {name: KURRENTDB_DB,                          value: /data/db}
                      - {name: KURRENTDB_LOG,                         value: /data/log}
                    readinessProbe:
                      httpGet: {path: /health/live, port: 2113}
                      initialDelaySeconds: 20
                      periodSeconds: 5
                      failureThreshold: 6
                    resources:
                      requests: {cpu: "200m", memory: "256Mi"}
                      limits:   {cpu: "1",    memory: "1Gi"}
                    volumeMounts:
                      - {name: data, mountPath: /data}
                volumes:
                  - name: data
                    emptyDir: {medium: Memory, sizeLimit: 512Mi}
          EOF

      - name: Wait for cluster ready
        run: |
          kubectl rollout status statefulset/kurrentdb -n event-store --timeout=300s
          kubectl get pods -n event-store -o wide

      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-app/target
          key: bench-${{ runner.os }}-cargo-${{ hashFiles('rust-app/Cargo.lock') }}

      - name: Build
        run: cargo build --release --manifest-path rust-app/Cargo.toml

      - name: Run short failover-impact test
        run: |
          chmod +x tests/14-failover-impact-test.sh
          tests/14-failover-impact-test.sh | tee failover-impact.log
          if ! grep '^{' failover-impact.log > kdb-failover-impact.json; then
            echo "ERROR: Failover-impact test failed or produced no JSON output"
            tail -50 failover-impact.log >&2
            exit 1
          fi

      - name: Upload failover-impact artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: kdb-failover-impact-result
          path: kdb-failover-impact.json
          if-no-files-found: warn

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          kubectl get nodes -o wide || true
          kubectl get pods -n event-store -o wide || true
          kubectl get events -n event-store --sort-by='.lastTimestamp' 2>/dev/null | tail -60 || true
          kubectl describe pods -n event-store || true
          for pod in $(kubectl get pods -n event-store -o name 2>/dev/null); do
            kubectl logs "$pod" -n event-store --tail=80 2>&1 || true
          done

  # ── KurrentDB: Scenario — Rate Ramp (Knee-Point Discovery) ───────────────
  kdb-rate-ramp:
    name: "KurrentDB: Rate Ramp (Knee Point)"
    runs-on: ubuntu-22.04
    if: github.event_name != 'workflow_dispatch' || inputs.job == '' || inputs.job == 'kdb-rate-ramp'
    steps:
      - uses: actions/checkout@v6

      - name: Install KurrentDB (MEM_DB)
        run: |
          curl -1sLf 'https://dl.cloudsmith.io/public/eventstore/kurrent-latest/setup.deb.sh' | sudo -E bash
          sudo apt-get install -y kurrentdb
          sudo systemctl stop kurrentdb || true
          getent passwd kurrentdb > /dev/null || sudo useradd --system --no-create-home --shell /usr/sbin/nologin kurrentdb
          sudo mkdir -p /tmp/esdb /tmp/esdb-log
          sudo chown kurrentdb:kurrentdb /tmp/esdb /tmp/esdb-log
          sudo mkdir -p /etc/systemd/system/kurrentdb.service.d
          printf '[Service]\nEnvironment="KURRENTDB_DB=/tmp/esdb"\nEnvironment="KURRENTDB_LOG=/tmp/esdb-log"\nEnvironment="KURRENTDB_INSECURE=true"\nEnvironment="KURRENTDB_RUN_PROJECTIONS=None"\nEnvironment="KURRENTDB_UNSAFE_DISABLE_FLUSH_TO_DISK=true"\nEnvironment="KURRENTDB_CLUSTER_SIZE=1"\nEnvironment="KURRENTDB_MEM_DB=true"\n' \
            | sudo tee /etc/systemd/system/kurrentdb.service.d/bench.conf
          sudo systemctl daemon-reload
          sudo systemctl start kurrentdb
          for i in $(seq 1 30); do curl -sf http://localhost:2113/health/live && break || sleep 2; done

      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-app/target
          key: bench-${{ runner.os }}-cargo-${{ hashFiles('rust-app/Cargo.lock') }}

      - name: Build
        run: cargo build --release --manifest-path rust-app/Cargo.toml

      - name: Rate ramp
        run: |
          DIRECT=1 BACKEND=kurrentdb KURRENT_URL_DIRECT='kurrentdb://localhost:2113?tls=false' bash tests/12-rate-ramp-test.sh | tee ramp-output.log
          if ! grep '^{' ramp-output.log > kdb-rate-ramp.json; then
            echo "ERROR: Rate ramp test failed or produced no JSON output"
            tail -50 ramp-output.log >&2
            exit 1
          fi

      - name: Upload ramp result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: kdb-rate-ramp-result
          path: kdb-rate-ramp.json
          if-no-files-found: warn

  # ── KurrentDB: Scenario — Replay-Under-Write (Latency Regression) ────────
  kdb-replay-under-write:
    name: "KurrentDB: Replay-Under-Write"
    runs-on: ubuntu-22.04
    if: github.event_name != 'workflow_dispatch' || inputs.job == '' || inputs.job == 'kdb-replay-under-write'
    steps:
      - uses: actions/checkout@v6

      - name: Install KurrentDB (MEM_DB)
        run: |
          curl -1sLf 'https://dl.cloudsmith.io/public/eventstore/kurrent-latest/setup.deb.sh' | sudo -E bash
          sudo apt-get install -y kurrentdb
          sudo systemctl stop kurrentdb || true
          getent passwd kurrentdb > /dev/null || sudo useradd --system --no-create-home --shell /usr/sbin/nologin kurrentdb
          sudo mkdir -p /tmp/esdb /tmp/esdb-log
          sudo chown kurrentdb:kurrentdb /tmp/esdb /tmp/esdb-log
          sudo mkdir -p /etc/systemd/system/kurrentdb.service.d
          printf '[Service]\nEnvironment="KURRENTDB_DB=/tmp/esdb"\nEnvironment="KURRENTDB_LOG=/tmp/esdb-log"\nEnvironment="KURRENTDB_INSECURE=true"\nEnvironment="KURRENTDB_RUN_PROJECTIONS=None"\nEnvironment="KURRENTDB_UNSAFE_DISABLE_FLUSH_TO_DISK=true"\nEnvironment="KURRENTDB_CLUSTER_SIZE=1"\nEnvironment="KURRENTDB_MEM_DB=true"\n' \
            | sudo tee /etc/systemd/system/kurrentdb.service.d/bench.conf
          sudo systemctl daemon-reload
          sudo systemctl start kurrentdb
          for i in $(seq 1 30); do curl -sf http://localhost:2113/health/live && break || sleep 2; done

      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-app/target
          key: bench-${{ runner.os }}-cargo-${{ hashFiles('rust-app/Cargo.lock') }}

      - name: Build
        run: cargo build --release --manifest-path rust-app/Cargo.toml

      - name: Replay-under-write test
        run: |
          DIRECT=1 BACKEND=kurrentdb KURRENT_URL_DIRECT='kurrentdb://localhost:2113?tls=false' bash tests/13-replay-under-write-test.sh | tee replay-output.log
          if ! grep '^{' replay-output.log > kdb-replay-under-write.json; then
            echo "ERROR: Replay-under-write test failed or produced no JSON output"
            tail -50 replay-output.log >&2
            exit 1
          fi

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: kdb-replay-under-write-result
          path: kdb-replay-under-write.json
          if-no-files-found: warn

  # ════════════════════════════════════════════════════════════════════════════
  # MongoDB
  #   - Core throughput (Docker / Kubernetes)
  #   - Rehydration / replay
  # ════════════════════════════════════════════════════════════════════════════

  mdb-docker:
    name: "MongoDB: Docker (tmpfs) [${{ matrix.mode }}]"
    runs-on: ubuntu-22.04
    if: github.event_name != 'workflow_dispatch' || inputs.job == '' || inputs.job == 'mdb-docker'
    strategy:
      fail-fast: false
      matrix:
        mode: [peak, durable]
    steps:
      - uses: actions/checkout@v6

      - name: Start MongoDB on tmpfs
        run: |
          docker run -d --name mongodb -p 27017:27017 --tmpfs /data/db \
            mongo:7 mongod --quiet --bind_ip_all --replSet rs0 --wiredTigerCacheSizeGB 0.25
          for i in $(seq 1 30); do
            docker exec mongodb mongosh --quiet --eval "db.adminCommand('ping').ok" \
              mongodb://localhost:27017/admin 2>/dev/null && break || sleep 2
          done

      - name: Initialise replica set
        run: |
          docker exec mongodb mongosh --quiet --eval \
            "rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]})"
          for i in $(seq 1 20); do
            docker exec mongodb mongosh --quiet --eval \
              "if (rs.isMaster().ismaster !== true) { throw 'no primary'; }" \
              2>/dev/null && break || sleep 3
          done

      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-app/target
          key: bench-${{ runner.os }}-cargo-${{ hashFiles('rust-app/Cargo.lock') }}

      - name: Build
        run: cargo build --release --manifest-path rust-app/Cargo.toml

      - name: Benchmark
        id: bench
        run: |
          MODE_FLAG=""
          if [ "${{ matrix.mode }}" = "durable" ]; then
            MODE_FLAG="--event-store-mode"
          fi

          RESULT=$(rust-app/target/release/testbed \
            --mongodb-url "mongodb://localhost:27017" \
            mongo-bench --target-rate 10000 --concurrency 64 --batch-size 1 --duration-secs 30 ${MODE_FLAG} --json)
          echo "$RESULT"
          echo "$RESULT" > "mdb-docker-${{ matrix.mode }}.json"
          echo "rate=$(echo    "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(round(d['actual_rate_eps'],1))")" >> "$GITHUB_OUTPUT"
          echo "p50_us=$(echo  "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['p50_us'])")"  >> "$GITHUB_OUTPUT"
          echo "p95_us=$(echo  "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['p95_us'])")"  >> "$GITHUB_OUTPUT"
          echo "p99_us=$(echo  "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['p99_us'])")"  >> "$GITHUB_OUTPUT"
          echo "p999_us=$(echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['p999_us'])")" >> "$GITHUB_OUTPUT"

      - name: Validate event-store features
        if: ${{ matrix.mode == 'durable' }}
        run: |
          rust-app/target/release/testbed \
            --mongodb-url "mongodb://localhost:27017/?replicaSet=rs0" \
            mongo-event-store-demo --database eventstoredemo --events 5

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v6
        with:
          name: mdb-docker-bench-${{ matrix.mode }}
          path: mdb-docker-${{ matrix.mode }}.json
          if-no-files-found: error

      - name: Dump Docker logs on failure
        if: failure()
        run: docker logs mongodb --tail 50 || true

  # ── MongoDB: Kubernetes Benchmark ────────────────────────────────────────
  mdb-k8s:
    name: "MongoDB: Kubernetes (single-node replica set) [${{ matrix.mode }}]"
    runs-on: ubuntu-22.04
    if: github.event_name != 'workflow_dispatch' || inputs.job == '' || inputs.job == 'mdb-k8s'
    strategy:
      fail-fast: false
      matrix:
        mode: [peak, durable]
    steps:
      - uses: actions/checkout@v6

      - name: Install k3d
        run: curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | TAG=v5.8.3 bash

      - name: Create k3d cluster
        run: k3d cluster create testbed --agents 1 --wait --timeout 120s

      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-app/target
          key: bench-${{ runner.os }}-cargo-${{ hashFiles('rust-app/Cargo.lock') }}

      - name: Build
        run: cargo build --release --manifest-path rust-app/Cargo.toml

      - name: Pre-pull MongoDB image
        run: |
          docker pull mongo:7
          k3d image import mongo:7 -c testbed

      - name: Deploy MongoDB
        run: |
          kubectl apply -f k8s/00-namespace.yaml
          kubectl apply -f k8s/05-mongodb/

      - name: Wait for MongoDB
        run: |
          kubectl rollout status statefulset/mongodb -n event-store --timeout=300s
          for i in $(seq 1 24); do
            kubectl exec -n event-store mongodb-0 -- \
              mongosh --quiet mongodb://127.0.0.1:27017/admin \
              --eval "if (rs.isMaster().ismaster !== true) { throw 'no primary'; }" \
              2>/dev/null && break || sleep 5
          done

      - name: Port-forward MongoDB
        run: |
          kubectl port-forward -n event-store pod/mongodb-0 27017:27017 &
          echo "PF_PID=$!" >> "$GITHUB_ENV"
          sleep 3

      - name: Benchmark
        id: bench
        run: |
          MODE_FLAG=""
          if [ "${{ matrix.mode }}" = "durable" ]; then
            MODE_FLAG="--event-store-mode"
          fi

          RESULT=$(rust-app/target/release/testbed \
            --mongodb-url "mongodb://localhost:27017" \
            mongo-bench --target-rate 10000 --concurrency 64 --batch-size 1 --duration-secs 30 ${MODE_FLAG} --json)
          echo "$RESULT"
          echo "$RESULT" > "mdb-k8s-${{ matrix.mode }}.json"
          echo "rate=$(echo    "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(round(d['actual_rate_eps'],1))")" >> "$GITHUB_OUTPUT"
          echo "p50_us=$(echo  "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['p50_us'])")"  >> "$GITHUB_OUTPUT"
          echo "p95_us=$(echo  "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['p95_us'])")"  >> "$GITHUB_OUTPUT"
          echo "p99_us=$(echo  "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['p99_us'])")"  >> "$GITHUB_OUTPUT"
          echo "p999_us=$(echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['p999_us'])")" >> "$GITHUB_OUTPUT"

      - name: Validate event-store features
        if: ${{ matrix.mode == 'durable' }}
        run: |
          rust-app/target/release/testbed \
            --mongodb-url "mongodb://localhost:27017/?replicaSet=rs0" \
            mongo-event-store-demo --database eventstoredemo --events 5

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v6
        with:
          name: mdb-k8s-bench-${{ matrix.mode }}
          path: mdb-k8s-${{ matrix.mode }}.json
          if-no-files-found: error

      - name: Stop port-forward
        if: always()
        run: kill "$PF_PID" 2>/dev/null || true

      - name: Dump pod diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -n event-store -o wide || true
          kubectl get events -n event-store --sort-by='.lastTimestamp' 2>/dev/null | tail -40 || true
          kubectl describe pods -n event-store || true
          for pod in $(kubectl get pods -n event-store -o name 2>/dev/null); do
            kubectl logs "$pod" -n event-store --tail=50 2>&1 || true
          done

  # ── MongoDB: Rehydration / Replay ────────────────────────────────────────
  mdb-rehydrate:
    name: "MongoDB: Rehydration / Replay"
    runs-on: ubuntu-22.04
    if: github.event_name != 'workflow_dispatch' || inputs.job == '' || inputs.job == 'mdb-rehydrate'
    outputs:
      write_ms:    ${{ steps.demo.outputs.write_ms }}
      replay_ms:   ${{ steps.demo.outputs.replay_ms }}
      write_rate:  ${{ steps.demo.outputs.write_rate }}
      replay_rate: ${{ steps.demo.outputs.replay_rate }}
      passed:      ${{ steps.demo.outputs.passed }}
    steps:
      - uses: actions/checkout@v6

      - name: Start MongoDB (Docker, replica set)
        run: |
          docker run -d --name mongodb -p 27017:27017 --tmpfs /data/db \
            mongo:7 mongod --quiet --bind_ip_all --replSet rs0 --wiredTigerCacheSizeGB 0.25
          for i in $(seq 1 30); do
            docker exec mongodb mongosh --quiet --eval "db.adminCommand('ping').ok" \
              mongodb://localhost:27017/admin 2>/dev/null && break || sleep 2
          done
          docker exec mongodb mongosh --quiet --eval \
            "rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]})"
          for i in $(seq 1 20); do
            docker exec mongodb mongosh --quiet --eval \
              "if (rs.isMaster().ismaster !== true) { throw 'no primary'; }" \
              2>/dev/null && break || sleep 3
          done

      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-app/target
          key: bench-${{ runner.os }}-cargo-${{ hashFiles('rust-app/Cargo.lock') }}

      - name: Build
        run: cargo build --release --manifest-path rust-app/Cargo.toml

      - name: Rehydration demo
        id: demo
        run: |
          RESULT=$(rust-app/target/release/testbed \
            --mongodb-url "mongodb://localhost:27017/?replicaSet=rs0" \
            mongo-rehydrate-demo --database rehydrate-ci --json)
          echo "$RESULT"
          JSON=$(echo "$RESULT" | tail -n 1)
          echo "write_ms=$(echo    "$JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['write_ms'])")"                >> "$GITHUB_OUTPUT"
          echo "replay_ms=$(echo   "$JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['replay_ms'])")"               >> "$GITHUB_OUTPUT"
          echo "write_rate=$(echo  "$JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(round(d['write_rate_eps'],1))")"  >> "$GITHUB_OUTPUT"
          echo "replay_rate=$(echo "$JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(round(d['replay_rate_eps'],1))")" >> "$GITHUB_OUTPUT"
          PASSED=$(echo "$JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['passed'])")
          echo "passed=$PASSED" >> "$GITHUB_OUTPUT"
          [ "$PASSED" = "True" ] || { echo "MongoDB rehydration FAILED"; exit 1; }

      - name: Dump Docker logs on failure
        if: failure()
        run: docker logs mongodb --tail 30 2>/dev/null || true

  # ── MongoDB: Scenario — Rate Ramp (Knee-Point Discovery) ────────────────
  mdb-rate-ramp:
    name: "MongoDB: Rate Ramp (Knee Point)"
    runs-on: ubuntu-22.04
    if: github.event_name != 'workflow_dispatch' || inputs.job == '' || inputs.job == 'mdb-rate-ramp'
    steps:
      - uses: actions/checkout@v6

      - name: Start MongoDB
        run: |
          docker run -d --name mongodb -p 27017:27017 --tmpfs /data/db \
            mongo:7 mongod --quiet --bind_ip_all --replSet rs0 --wiredTigerCacheSizeGB 0.25
          for i in $(seq 1 30); do
            docker exec mongodb mongosh --quiet --eval "db.adminCommand('ping').ok" \
              mongodb://localhost:27017/admin 2>/dev/null && break || sleep 2
          done
          docker exec mongodb mongosh --quiet --eval \
            "rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]})"
          for i in $(seq 1 20); do
            docker exec mongodb mongosh --quiet --eval \
              "if (rs.isMaster().ismaster !== true) { throw 'no primary'; }" \
              2>/dev/null && break || sleep 3
          done

      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-app/target
          key: bench-${{ runner.os }}-cargo-${{ hashFiles('rust-app/Cargo.lock') }}

      - name: Build
        run: cargo build --release --manifest-path rust-app/Cargo.toml

      - name: Rate ramp (Peak mode)
        run: |
          DIRECT=1 BACKEND=mongodb EVENT_STORE_MODE=0 bash tests/12-rate-ramp-test.sh | tee ramp-peak.log
          if ! grep '^{' ramp-peak.log > mdb-rate-ramp-peak.json; then
            echo "ERROR: Rate ramp (Peak) test failed or produced no JSON output"
            tail -50 ramp-peak.log >&2
            exit 1
          fi

      - name: Rate ramp (Durable mode)
        run: |
          DIRECT=1 BACKEND=mongodb EVENT_STORE_MODE=1 bash tests/12-rate-ramp-test.sh | tee ramp-durable.log
          if ! grep '^{' ramp-durable.log > mdb-rate-ramp-durable.json; then
            echo "ERROR: Rate ramp (Durable) test failed or produced no JSON output"
            tail -50 ramp-durable.log >&2
            exit 1
          fi

      - name: Upload ramp results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mdb-rate-ramp-results
          path: mdb-rate-ramp-*.json
          if-no-files-found: warn

      - name: Cleanup
        if: always()
        run: docker stop mongodb && docker rm mongodb || true

  # ── MongoDB: Scenario — Replay-Under-Write (Latency Regression) ──────────
  mdb-replay-under-write:
    name: "MongoDB: Replay-Under-Write [${{ matrix.mode }}]"
    runs-on: ubuntu-22.04
    if: github.event_name != 'workflow_dispatch' || inputs.job == '' || inputs.job == 'mdb-replay-under-write'
    strategy:
      fail-fast: false
      matrix:
        mode: [peak, durable]
        include:
          - {mode: peak,    event_store_mode: 0}
          - {mode: durable, event_store_mode: 1}
    steps:
      - uses: actions/checkout@v6

      - name: Start MongoDB
        run: |
          docker run -d --name mongodb -p 27017:27017 --tmpfs /data/db \
            mongo:7 mongod --quiet --bind_ip_all --replSet rs0 --wiredTigerCacheSizeGB 0.25
          for i in $(seq 1 30); do
            docker exec mongodb mongosh --quiet --eval "db.adminCommand('ping').ok" \
              mongodb://localhost:27017/admin 2>/dev/null && break || sleep 2
          done
          docker exec mongodb mongosh --quiet --eval \
            "rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]})"
          for i in $(seq 1 20); do
            docker exec mongodb mongosh --quiet --eval \
              "if (rs.isMaster().ismaster !== true) { throw 'no primary'; }" \
              2>/dev/null && break || sleep 3
          done

      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-app/target
          key: bench-${{ runner.os }}-cargo-${{ hashFiles('rust-app/Cargo.lock') }}

      - name: Build
        run: cargo build --release --manifest-path rust-app/Cargo.toml

      - name: Replay-under-write test
        run: |
          DIRECT=1 BACKEND=mongodb EVENT_STORE_MODE=${{ matrix.event_store_mode }} bash tests/13-replay-under-write-test.sh | tee replay-output.log
          if ! grep '^{' replay-output.log > mdb-replay-under-write-${{ matrix.mode }}.json; then
            echo "ERROR: Replay-under-write test failed or produced no JSON output"
            tail -50 replay-output.log >&2
            exit 1
          fi

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mdb-replay-under-write-${{ matrix.mode }}
          path: mdb-replay-under-write-*.json
          if-no-files-found: warn

      - name: Cleanup
        if: always()
        run: docker stop mongodb && docker rm mongodb || true

  # ════════════════════════════════════════════════════════════════════════════
  # PostgreSQL
  #   - Core throughput (Docker / Kubernetes)
  #   - Rehydration / replay
  # ════════════════════════════════════════════════════════════════════════════

  pg-docker:
    name: "PostgreSQL: Docker (tmpfs) [${{ matrix.mode }}]"
    runs-on: ubuntu-22.04
    if: github.event_name != 'workflow_dispatch' || inputs.job == '' || inputs.job == 'pg-docker'
    strategy:
      fail-fast: false
      matrix:
        mode: [peak, durable]
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-app/target
          key: bench-${{ runner.os }}-cargo-${{ hashFiles('rust-app/Cargo.lock') }}

      - name: Build
        run: cargo build --release --manifest-path rust-app/Cargo.toml

      - name: Start PostgreSQL
        run: |
          docker run -d --name pg \
            -e POSTGRES_DB=eventbench -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres \
            -p 5432:5432 --tmpfs /var/lib/postgresql/data \
            postgres:16 -c fsync=off -c full_page_writes=off -c max_connections=200
          for i in $(seq 1 30); do
            docker exec pg pg_isready -U postgres -d eventbench && break || sleep 2
          done

      - name: Benchmark
        id: bench
        run: |
          MODE_FLAG=""
          if [ "${{ matrix.mode }}" = "durable" ]; then
            MODE_FLAG="--event-store-mode"
          fi

          RESULT=$(rust-app/target/release/testbed \
            --postgres-url "postgres://postgres:postgres@localhost:5432/eventbench" \
            pg-bench --target-rate 10000 --concurrency 64 --batch-size 1 --duration-secs 30 ${MODE_FLAG} --json)
          echo "$RESULT"
          echo "$RESULT" > "pg-docker-${{ matrix.mode }}.json"
          echo "rate=$(echo    "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(round(d['actual_rate_eps'],1))")" >> "$GITHUB_OUTPUT"
          echo "p50_us=$(echo  "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['p50_us'])")"  >> "$GITHUB_OUTPUT"
          echo "p95_us=$(echo  "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['p95_us'])")"  >> "$GITHUB_OUTPUT"
          echo "p99_us=$(echo  "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['p99_us'])")"  >> "$GITHUB_OUTPUT"
          echo "p999_us=$(echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['p999_us'])")" >> "$GITHUB_OUTPUT"

      - name: Validate event-store features
        if: ${{ matrix.mode == 'durable' }}
        run: |
          rust-app/target/release/testbed \
            --postgres-url "postgres://postgres:postgres@localhost:5432/eventbench" \
            pg-event-store-demo --events 5

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v6
        with:
          name: pg-docker-bench-${{ matrix.mode }}
          path: pg-docker-${{ matrix.mode }}.json
          if-no-files-found: error

      - name: Stop PostgreSQL
        if: always()
        run: docker stop pg && docker rm pg || true

  # ── PostgreSQL: Kubernetes Benchmark ─────────────────────────────────────
  pg-k8s:
    name: "PostgreSQL: Kubernetes (single-node) [${{ matrix.mode }}]"
    runs-on: ubuntu-22.04
    if: github.event_name != 'workflow_dispatch' || inputs.job == '' || inputs.job == 'pg-k8s'
    strategy:
      fail-fast: false
      matrix:
        mode: [peak, durable]
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-app/target
          key: bench-${{ runner.os }}-cargo-${{ hashFiles('rust-app/Cargo.lock') }}

      - name: Build
        run: cargo build --release --manifest-path rust-app/Cargo.toml

      - name: Install k3d + kubectl
        run: |
          curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | TAG=v5.8.3 bash
          curl -LO "https://dl.k8s.io/release/$(curl -sSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/

      - name: Create k3d cluster
        run: k3d cluster create bench --servers 1 --agents 1 --no-lb --wait

      - name: Pre-pull postgres:16
        run: |
          docker pull postgres:16
          k3d image import postgres:16 -c bench

      - name: Deploy PostgreSQL
        run: |
          kubectl apply -f k8s/00-namespace.yaml
          kubectl apply -f k8s/06-postgres/

      - name: Wait for PostgreSQL
        run: |
          kubectl rollout status statefulset/postgres -n event-store --timeout=300s
          for i in $(seq 1 40); do
            kubectl exec -n event-store postgres-0 -- pg_isready -U postgres -d eventbench 2>/dev/null && break || sleep 5
          done

      - name: Port-forward PostgreSQL
        run: |
          kubectl port-forward -n event-store pod/postgres-0 5432:5432 &
          echo "PF_PID=$!" >> "$GITHUB_ENV"
          sleep 3

      - name: Benchmark
        id: bench
        run: |
          MODE_FLAG=""
          if [ "${{ matrix.mode }}" = "durable" ]; then
            MODE_FLAG="--event-store-mode"
          fi

          RESULT=$(rust-app/target/release/testbed \
            --postgres-url "postgres://postgres:postgres@localhost:5432/eventbench" \
            pg-bench --target-rate 10000 --concurrency 64 --batch-size 1 --duration-secs 30 ${MODE_FLAG} --json)
          echo "$RESULT"
          echo "$RESULT" > "pg-k8s-${{ matrix.mode }}.json"
          echo "rate=$(echo    "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(round(d['actual_rate_eps'],1))")" >> "$GITHUB_OUTPUT"
          echo "p50_us=$(echo  "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['p50_us'])")"  >> "$GITHUB_OUTPUT"
          echo "p95_us=$(echo  "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['p95_us'])")"  >> "$GITHUB_OUTPUT"
          echo "p99_us=$(echo  "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['p99_us'])")"  >> "$GITHUB_OUTPUT"
          echo "p999_us=$(echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['p999_us'])")" >> "$GITHUB_OUTPUT"

      - name: Validate event-store features
        if: ${{ matrix.mode == 'durable' }}
        run: |
          rust-app/target/release/testbed \
            --postgres-url "postgres://postgres:postgres@localhost:5432/eventbench" \
            pg-event-store-demo --events 5

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v6
        with:
          name: pg-k8s-bench-${{ matrix.mode }}
          path: pg-k8s-${{ matrix.mode }}.json
          if-no-files-found: error

      - name: Stop port-forward
        if: always()
        run: kill "$PF_PID" 2>/dev/null || true

      - name: Dump pod diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -n event-store -o wide || true
          kubectl get events -n event-store --sort-by='.lastTimestamp' 2>/dev/null | tail -40 || true
          kubectl describe pods -n event-store || true
          for pod in $(kubectl get pods -n event-store -o name 2>/dev/null); do
            kubectl logs "$pod" -n event-store --tail=50 2>&1 || true
          done

  # ── PostgreSQL: Rehydration / Replay ─────────────────────────────────────
  pg-rehydrate:
    name: "PostgreSQL: Rehydration / Replay"
    runs-on: ubuntu-22.04
    if: github.event_name != 'workflow_dispatch' || inputs.job == '' || inputs.job == 'pg-rehydrate'
    outputs:
      write_ms:    ${{ steps.demo.outputs.write_ms }}
      replay_ms:   ${{ steps.demo.outputs.replay_ms }}
      write_rate:  ${{ steps.demo.outputs.write_rate }}
      replay_rate: ${{ steps.demo.outputs.replay_rate }}
      passed:      ${{ steps.demo.outputs.passed }}
    steps:
      - uses: actions/checkout@v6

      - name: Start PostgreSQL
        run: |
          docker run -d --name pg \
            -e POSTGRES_DB=eventbench -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres \
            -p 5432:5432 --tmpfs /var/lib/postgresql/data \
            postgres:16 -c fsync=off -c full_page_writes=off -c max_connections=200
          for i in $(seq 1 30); do
            docker exec pg pg_isready -U postgres -d eventbench && break || sleep 2
          done

      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-app/target
          key: bench-${{ runner.os }}-cargo-${{ hashFiles('rust-app/Cargo.lock') }}

      - name: Build
        run: cargo build --release --manifest-path rust-app/Cargo.toml

      - name: Rehydration demo
        id: demo
        run: |
          RESULT=$(rust-app/target/release/testbed \
            --postgres-url "postgres://postgres:postgres@localhost:5432/eventbench" \
            pg-rehydrate-demo --json)
          echo "$RESULT"
          JSON=$(echo "$RESULT" | tail -n 1)
          echo "write_ms=$(echo    "$JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['write_ms'])")"                >> "$GITHUB_OUTPUT"
          echo "replay_ms=$(echo   "$JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['replay_ms'])")"               >> "$GITHUB_OUTPUT"
          echo "write_rate=$(echo  "$JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(round(d['write_rate_eps'],1))")"  >> "$GITHUB_OUTPUT"
          echo "replay_rate=$(echo "$JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(round(d['replay_rate_eps'],1))")" >> "$GITHUB_OUTPUT"
          PASSED=$(echo "$JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['passed'])")
          echo "passed=$PASSED" >> "$GITHUB_OUTPUT"
          [ "$PASSED" = "True" ] || { echo "PostgreSQL rehydration FAILED"; exit 1; }

      - name: Dump Docker logs on failure
        if: failure()
        run: docker logs pg --tail 30 2>/dev/null || true

  # ── PostgreSQL: Scenario — Rate Ramp (Knee-Point Discovery) ──────────────
  pg-rate-ramp:
    name: "PostgreSQL: Rate Ramp (Knee Point)"
    runs-on: ubuntu-22.04
    if: github.event_name != 'workflow_dispatch' || inputs.job == '' || inputs.job == 'pg-rate-ramp'
    steps:
      - uses: actions/checkout@v6

      - name: Start PostgreSQL
        run: |
          docker run -d --name pg \
            -e POSTGRES_DB=eventbench -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres \
            -p 5432:5432 --tmpfs /var/lib/postgresql/data \
            postgres:16 -c fsync=off -c full_page_writes=off -c max_connections=200
          for i in $(seq 1 30); do
            docker exec pg pg_isready -U postgres -d eventbench && break || sleep 2
          done

      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-app/target
          key: bench-${{ runner.os }}-cargo-${{ hashFiles('rust-app/Cargo.lock') }}

      - name: Build
        run: cargo build --release --manifest-path rust-app/Cargo.toml

      - name: Rate ramp (Peak mode)
        run: |
          DIRECT=1 BACKEND=postgres EVENT_STORE_MODE=0 bash tests/12-rate-ramp-test.sh | tee ramp-peak.log
          if ! grep '^{' ramp-peak.log > pg-rate-ramp-peak.json; then
            echo "ERROR: Rate ramp (Peak) test failed or produced no JSON output"
            tail -50 ramp-peak.log >&2
            exit 1
          fi

      - name: Rate ramp (Durable mode)
        run: |
          DIRECT=1 BACKEND=postgres EVENT_STORE_MODE=1 bash tests/12-rate-ramp-test.sh | tee ramp-durable.log
          if ! grep '^{' ramp-durable.log > pg-rate-ramp-durable.json; then
            echo "ERROR: Rate ramp (Durable) test failed or produced no JSON output"
            tail -50 ramp-durable.log >&2
            exit 1
          fi

      - name: Upload ramp results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pg-rate-ramp-results
          path: pg-rate-ramp-*.json
          if-no-files-found: warn

      - name: Cleanup
        if: always()
        run: docker stop pg && docker rm pg || true

  # ── PostgreSQL: Scenario — Replay-Under-Write (Latency Regression) ───────
  pg-replay-under-write:
    name: "PostgreSQL: Replay-Under-Write [${{ matrix.mode }}]"
    runs-on: ubuntu-22.04
    if: github.event_name != 'workflow_dispatch' || inputs.job == '' || inputs.job == 'pg-replay-under-write'
    strategy:
      fail-fast: false
      matrix:
        mode: [peak, durable]
        include:
          - {mode: peak,    event_store_mode: 0}
          - {mode: durable, event_store_mode: 1}
    steps:
      - uses: actions/checkout@v6

      - name: Start PostgreSQL
        run: |
          docker run -d --name pg \
            -e POSTGRES_DB=eventbench -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres \
            -p 5432:5432 --tmpfs /var/lib/postgresql/data \
            postgres:16 -c fsync=off -c full_page_writes=off -c max_connections=200
          for i in $(seq 1 30); do
            docker exec pg pg_isready -U postgres -d eventbench && break || sleep 2
          done

      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-app/target
          key: bench-${{ runner.os }}-cargo-${{ hashFiles('rust-app/Cargo.lock') }}

      - name: Build
        run: cargo build --release --manifest-path rust-app/Cargo.toml

      - name: Replay-under-write test
        run: |
          DIRECT=1 BACKEND=postgres EVENT_STORE_MODE=${{ matrix.event_store_mode }} bash tests/13-replay-under-write-test.sh | tee replay-output.log
          if ! grep '^{' replay-output.log > pg-replay-under-write-${{ matrix.mode }}.json; then
            echo "ERROR: Replay-under-write test failed or produced no JSON output"
            tail -50 replay-output.log >&2
            exit 1
          fi

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pg-replay-under-write-${{ matrix.mode }}
          path: pg-replay-under-write-*.json
          if-no-files-found: warn

      - name: Cleanup
        if: always()
        run: docker stop pg && docker rm pg || true

  # ════════════════════════════════════════════════════════════════════════════
  # Combined Report — runs once, after all bench jobs complete
  # ════════════════════════════════════════════════════════════════════════════

  report:
    name: Benchmark Report
    runs-on: ubuntu-22.04
    if: always() && (github.event_name != 'workflow_dispatch' || inputs.job == '')
    permissions:
      actions: read
      contents: read
    needs:
      - kdb-memdb
      - kdb-docker
      - kdb-k8s
      - mdb-docker
      - mdb-k8s
      - pg-docker
      - pg-k8s
      - kdb-rehydrate
      - mdb-rehydrate
      - pg-rehydrate
      - kdb-failover
      - kdb-failover-impact
      - kdb-rate-ramp
      - mdb-rate-ramp
      - pg-rate-ramp
      - kdb-replay-under-write
      - mdb-replay-under-write
      - pg-replay-under-write
    steps:
      - name: Download benchmark and ramp artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! command -v gh >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y gh
          fi

          mkdir -p bench-artifacts
          rm -rf bench-artifacts/*

          # Artifact indexing can lag a little; retry listing a few times.
          ARTIFACT_NAMES=""
          for attempt in 1 2 3 4 5 6; do
            ARTIFACT_NAMES=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
              --jq '.artifacts[] | select(.expired==false) | .name' | sort -u || true)
            if [ -n "${ARTIFACT_NAMES}" ]; then
              break
            fi
            echo "No artifacts indexed yet (attempt ${attempt}/6); retrying in 10s..."
            sleep 10
          done

          if [ -z "${ARTIFACT_NAMES}" ]; then
            echo "No non-expired artifacts found for this run."
          else
            echo "Artifacts discovered:"
            printf '%s\n' "${ARTIFACT_NAMES}"

            while IFS= read -r artifact; do
              [ -n "${artifact}" ] || continue
              ok=0
              for dl_try in 1 2 3; do
                if gh run download "${GITHUB_RUN_ID}" \
                  --repo "${GITHUB_REPOSITORY}" \
                  --name "${artifact}" \
                  --dir "bench-artifacts/${artifact}"; then
                  ok=1
                  break
                fi
                echo "Download failed for ${artifact} (attempt ${dl_try}/3), retrying..."
                sleep 3
              done
              if [ "${ok}" -ne 1 ]; then
                echo "Failed to download artifact: ${artifact}"
                exit 1
              fi
            done <<< "${ARTIFACT_NAMES}"
          fi

          echo "Downloaded files:"
          find bench-artifacts -type f | sort || true

          JSON_COUNT=$(find bench-artifacts -type f -name '*.json' | wc -l | tr -d ' ')
          echo "Downloaded JSON count: ${JSON_COUNT}"
          if [ "${JSON_COUNT}" -eq 0 ]; then
            echo "No JSON artifacts were downloaded; failing report early."
            exit 1
          fi

      - name: Generate combined summary
        env:
          KDB_MEMDB_RATE:    ${{ needs.kdb-memdb.outputs.rate }}
          KDB_MEMDB_P50:     ${{ needs.kdb-memdb.outputs.p50_us }}
          KDB_MEMDB_P95:     ${{ needs.kdb-memdb.outputs.p95_us }}
          KDB_MEMDB_P99:     ${{ needs.kdb-memdb.outputs.p99_us }}
          KDB_MEMDB_P999:    ${{ needs.kdb-memdb.outputs.p999_us }}
          KDB_RH_WRITE_MS:   ${{ needs.kdb-rehydrate.outputs.write_ms }}
          KDB_RH_REPLAY_MS:  ${{ needs.kdb-rehydrate.outputs.replay_ms }}
          KDB_RH_WRITE_RATE: ${{ needs.kdb-rehydrate.outputs.write_rate }}
          KDB_RH_REPLAY_RATE: ${{ needs.kdb-rehydrate.outputs.replay_rate }}
          KDB_RH_PASSED:     ${{ needs.kdb-rehydrate.outputs.passed }}
          KDB_SC_WRITE_EPS:  ${{ needs.kdb-rehydrate.outputs.sc_write_eps }}
          KDB_SC_TAIL_MS:    ${{ needs.kdb-rehydrate.outputs.sc_tail_ms }}
          KDB_SC_REHY_EPS:   ${{ needs.kdb-rehydrate.outputs.sc_rehydrate_eps }}
          KDB_SC_REHY_MS:    ${{ needs.kdb-rehydrate.outputs.sc_rehydrate_ms }}
          KDB_FO_PASSED:     ${{ needs.kdb-failover.outputs.passed }}
          MDB_RH_WRITE_MS:   ${{ needs.mdb-rehydrate.outputs.write_ms }}
          MDB_RH_REPLAY_MS:  ${{ needs.mdb-rehydrate.outputs.replay_ms }}
          MDB_RH_WRITE_RATE: ${{ needs.mdb-rehydrate.outputs.write_rate }}
          MDB_RH_REPLAY_RATE: ${{ needs.mdb-rehydrate.outputs.replay_rate }}
          MDB_RH_PASSED:     ${{ needs.mdb-rehydrate.outputs.passed }}
          PG_RH_WRITE_MS:    ${{ needs.pg-rehydrate.outputs.write_ms }}
          PG_RH_REPLAY_MS:   ${{ needs.pg-rehydrate.outputs.replay_ms }}
          PG_RH_WRITE_RATE:  ${{ needs.pg-rehydrate.outputs.write_rate }}
          PG_RH_REPLAY_RATE: ${{ needs.pg-rehydrate.outputs.replay_rate }}
          PG_RH_PASSED:      ${{ needs.pg-rehydrate.outputs.passed }}
        run: |
          python3 << 'PYEOF'
          import json
          import os
          from pathlib import Path

          def e(v):
            return os.getenv(v, '') or 'n/a'

          def ms(v):
            val = os.getenv(v, '')
            if not val:
              return 'n/a'
            try:
              return f'{int(val)/1000:.2f}'
            except Exception:
              return 'n/a'

          def result(v):
            return {'True': '✓ PASS', 'False': '✗ FAIL'}.get(os.getenv(v, ''), 'n/a')

          def ms_num(v):
            try:
              return f'{int(v)/1000:.2f}'
            except Exception:
              return 'n/a'

          def load_jsons(base_dir, file_map):
            base = Path(base_dir)
            out = {}
            for key, name in file_map.items():
              candidates = [base / name]
              if not candidates[0].exists():
                candidates = list(base.rglob(name))
              for p in candidates:
                if not p.exists():
                  continue
                try:
                  out[key] = json.loads(p.read_text(encoding='utf-8'))
                  break
                except Exception:
                  continue
            return out

          mode_data = load_jsons('bench-artifacts', {
            'kdb-docker-peak': 'kdb-docker-peak.json',
            'kdb-docker-durable': 'kdb-docker-durable.json',
            'kdb-k8s-peak': 'kdb-k8s-peak.json',
            'kdb-k8s-durable': 'kdb-k8s-durable.json',
            'mdb-docker-peak': 'mdb-docker-peak.json',
            'mdb-docker-durable': 'mdb-docker-durable.json',
            'mdb-k8s-peak': 'mdb-k8s-peak.json',
            'mdb-k8s-durable': 'mdb-k8s-durable.json',
            'pg-docker-peak': 'pg-docker-peak.json',
            'pg-docker-durable': 'pg-docker-durable.json',
            'pg-k8s-peak': 'pg-k8s-peak.json',
            'pg-k8s-durable': 'pg-k8s-durable.json',
          })

          ramp_data = load_jsons('bench-artifacts', {
            'kdb': 'kdb-rate-ramp.json',
            'mdb-peak': 'mdb-rate-ramp-peak.json',
            'mdb-durable': 'mdb-rate-ramp-durable.json',
            'pg-peak': 'pg-rate-ramp-peak.json',
            'pg-durable': 'pg-rate-ramp-durable.json',
          })

          replay_data = load_jsons('bench-artifacts', {
            'kdb': 'kdb-replay-under-write.json',
            'mdb-peak': 'mdb-replay-under-write-peak.json',
            'mdb-durable': 'mdb-replay-under-write-durable.json',
            'pg-peak': 'pg-replay-under-write-peak.json',
            'pg-durable': 'pg-replay-under-write-durable.json',
          })

          failover_impact = load_jsons('bench-artifacts', {
            'kdb': 'kdb-failover-impact.json',
          })

          artifact_json_count = len(list(Path('bench-artifacts').rglob('*.json')))

          replay_expected = {
            'kdb': 'KurrentDB',
            'mdb-peak': 'MongoDB Peak',
            'mdb-durable': 'MongoDB Durable',
            'pg-peak': 'PostgreSQL Peak',
            'pg-durable': 'PostgreSQL Durable',
          }
          replay_required_fields = ['baseline_p99_us', 'concurrent_p99_us', 'regression_factor']
          replay_errors = []
          for key, label in replay_expected.items():
            if key not in replay_data:
              replay_errors.append(f'{label}: missing replay artifact')
              continue
            d = replay_data.get(key)
            if not isinstance(d, dict):
              replay_errors.append(f'{label}: invalid replay JSON object')
              continue
            missing = [fld for fld in replay_required_fields if fld not in d or d.get(fld) in (None, '')]
            if missing:
              replay_errors.append(f'{label}: missing fields: {", ".join(missing)}')

          if replay_errors:
            print('Replay data validation warning:')
            for err in replay_errors:
              print(f'- {err}')

          def write_mode_rows(f, backend_rows):
            for env_name, mode_name, key in backend_rows:
              if key not in mode_data:
                continue
              d = mode_data[key]
              f.write(
                f'| {env_name} | {mode_name} | {d.get("actual_rate_eps", "n/a")} | '
                f'{ms_num(d.get("p50_us", "n/a"))} | {ms_num(d.get("p95_us", "n/a"))} | '
                f'{ms_num(d.get("p99_us", "n/a"))} | {ms_num(d.get("p999_us", "n/a"))} |\n'
              )

          summary = os.environ.get('GITHUB_STEP_SUMMARY', '/dev/stdout')
          with open(summary, 'a', encoding='utf-8') as f:
            f.write('## Benchmark Results\n\n')
            f.write(f'> **Artifacts discovered:** {artifact_json_count} JSON files in bench-artifacts\n')
            f.write(f'> **Parsed sections:** throughput={len(mode_data)}, ramp={len(ramp_data)}, replay={len(replay_data)}, failover_impact={len(failover_impact)}\n')
            f.write('> **Conditions:** peak + durable modes · 10 k ev/s target · 30 s · 64 concurrent tasks · ubuntu-22.04\n')
            f.write('> **Rehydration:** 50 000 events · sequential write then full replay\n')
            f.write('> **Scale:** 100 k events · CI loopback (no VM bridge)\n\n')

            f.write('### KurrentDB\n\n')
            f.write('**Sustained Write Benchmark**\n\n')
            f.write('| Environment | Mode | Rate (ev/s) | p50 (ms) | p95 (ms) | p99 (ms) | p99.9 (ms) |\n')
            f.write('|-------------|------|------------:|:--------:|:--------:|:--------:|:----------:|\n')
            f.write(f'| In-memory (MEM_DB) | Peak baseline | {e("KDB_MEMDB_RATE")} | {ms("KDB_MEMDB_P50")} | {ms("KDB_MEMDB_P95")} | {ms("KDB_MEMDB_P99")} | {ms("KDB_MEMDB_P999")} |\n')
            write_mode_rows(f, [
              ('Docker (tmpfs)', 'Peak', 'kdb-docker-peak'),
              ('Docker (tmpfs)', 'Durable', 'kdb-docker-durable'),
              ('Kubernetes k3d (emptyDir Memory)', 'Peak', 'kdb-k8s-peak'),
              ('Kubernetes k3d (emptyDir Memory)', 'Durable', 'kdb-k8s-durable'),
            ])
            f.write('\n')

            f.write('**Rehydration / Replay (50 k events)**\n\n')
            f.write('| Phase | Duration (ms) | Throughput (ev/s) | Result |\n')
            f.write('|-------|-------------:|------------------:|:------:|\n')
            f.write(f'| Write — batched 500 ev/gRPC | {e("KDB_RH_WRITE_MS")} | {e("KDB_RH_WRITE_RATE")} | |\n')
            f.write(f'| Replay — gRPC server-stream | {e("KDB_RH_REPLAY_MS")} | {e("KDB_RH_REPLAY_RATE")} | {result("KDB_RH_PASSED")} |\n\n')

            f.write('**Scale Benchmark — 100 k events (CI, loopback gRPC)**\n\n')
            f.write('| Metric | Value |\n')
            f.write('|--------|------:|\n')
            f.write(f'| Write throughput (ev/s) | {e("KDB_SC_WRITE_EPS")} |\n')
            f.write(f'| Tail read — last 500 from 100 k (ms) | {e("KDB_SC_TAIL_MS")} |\n')
            f.write(f'| Full rehydration throughput (ev/s) | {e("KDB_SC_REHY_EPS")} |\n')
            f.write(f'| Full rehydration elapsed (ms) | {e("KDB_SC_REHY_MS")} |\n\n')

            f.write('**Node Failover (AC-3)**\n\n')
            f.write('| Test | Result |\n')
            f.write('|------|:------:|\n')
            f.write(f'| 3-node cluster · leader evicted · quorum ≤ 60 s | {result("KDB_FO_PASSED")} |\n\n')

            f.write('**Short Failover Impact (Under Load)**\n\n')
            if 'kdb' in failover_impact:
              d = failover_impact['kdb']
              f.write('| Metric | Value |\n')
              f.write('|--------|------:|\n')
              f.write(f'| Pause window (ms) | {d.get("pause_window_ms", "n/a")} |\n')
              f.write(f'| Probe error spike (count) | {d.get("error_spike_count", "n/a")} |\n')
              f.write(f'| Write error count | {d.get("write_error_count", "n/a")} |\n')
              f.write(f'| Recovery time (ms) | {d.get("recovery_time_ms", "n/a")} |\n')
              f.write(f'| Baseline p99 (us) | {d.get("baseline_p99_us", "n/a")} |\n')
              f.write(f'| Impact p99 (us) | {d.get("impact_p99_us", "n/a")} |\n')
              f.write(f'| Tail latency factor | {d.get("tail_latency_factor", "n/a")}x |\n\n')
            else:
              f.write('_Failover-impact artifact missing._\n\n')

            f.write('### MongoDB\n\n')
            f.write('**Sustained Write Benchmark**\n\n')
            f.write('| Environment | Mode | Rate (ev/s) | p50 (ms) | p95 (ms) | p99 (ms) | p99.9 (ms) |\n')
            f.write('|-------------|------|------------:|:--------:|:--------:|:--------:|:----------:|\n')
            write_mode_rows(f, [
              ('Docker (tmpfs)', 'Peak', 'mdb-docker-peak'),
              ('Docker (tmpfs)', 'Durable', 'mdb-docker-durable'),
              ('Kubernetes k3d (emptyDir Memory)', 'Peak', 'mdb-k8s-peak'),
              ('Kubernetes k3d (emptyDir Memory)', 'Durable', 'mdb-k8s-durable'),
            ])
            f.write('\n')

            f.write('### PostgreSQL\n\n')
            f.write('**Sustained Write Benchmark**\n\n')
            f.write('| Environment | Mode | Rate (ev/s) | p50 (ms) | p95 (ms) | p99 (ms) | p99.9 (ms) |\n')
            f.write('|-------------|------|------------:|:--------:|:--------:|:--------:|:----------:|\n')
            write_mode_rows(f, [
              ('Docker (tmpfs · fsync=off)', 'Peak', 'pg-docker-peak'),
              ('Docker (tmpfs · fsync=off)', 'Durable', 'pg-docker-durable'),
              ('Kubernetes k3d (emptyDir Memory)', 'Peak', 'pg-k8s-peak'),
              ('Kubernetes k3d (emptyDir Memory)', 'Durable', 'pg-k8s-durable'),
            ])
            f.write('\n')

            f.write('### Rate Ramp — Knee-Point Analysis\n\n')
            if ramp_data:
              for key, label in [('kdb', 'KurrentDB'), ('mdb-peak', 'MongoDB Peak'), ('mdb-durable', 'MongoDB Durable'), ('pg-peak', 'PostgreSQL Peak'), ('pg-durable', 'PostgreSQL Durable')]:
                if key not in ramp_data:
                  continue
                d = ramp_data[key]
                if d.get('knee_detected'):
                  f.write(f'- **{label}:** knee {d.get("knee_rate_eps", "n/a")} ev/s, p99 {d.get("knee_p99_us", "n/a")} us, jump {d.get("knee_jump", "n/a")}x\n')
                else:
                  f.write(f'- **{label}:** no knee detected in tested range\n')
              f.write('\n')
            else:
              f.write('_Rate ramp tests did not produce artifacts._\n\n')

            f.write('### Replay-Under-Write — Latency Regression\n\n')
            if replay_errors:
              f.write('> ⚠ Replay data validation warnings:\n')
              for err in replay_errors:
                f.write(f'> - {err}\n')
              f.write('\n')
            if replay_data:
              for key, label in [('kdb', 'KurrentDB'), ('mdb-peak', 'MongoDB Peak'), ('mdb-durable', 'MongoDB Durable'), ('pg-peak', 'PostgreSQL Peak'), ('pg-durable', 'PostgreSQL Durable')]:
                if key not in replay_data:
                  continue
                d = replay_data[key]
                f.write(f'- **{label}:** baseline {d.get("baseline_p99_us", "n/a")} us -> concurrent {d.get("concurrent_p99_us", "n/a")} us ({d.get("regression_factor", "n/a")}x)\n')
              f.write('\n')
            else:
              f.write('_Replay-under-write tests did not produce artifacts._\n\n')

            f.write('---\n')
            f.write('_All backends use RAM (tmpfs/emptyDir). Numbers reflect protocol + semantic overhead, not production throughput._\n')
            f.write('_K8s latency is higher than Docker due to the port-forward loopback tunnel._\n')
          PYEOF
