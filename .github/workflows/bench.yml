name: event-sourcing-testbed — Performance Benchmark

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:   # allow manual trigger from GitHub UI

jobs:
  # ── Job 1: in-memory storage — tests gRPC API + write path throughput ──────
  bench-memdb:
    name: Bench — MEM_DB
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install EventStoreDB natively
        run: |
          curl -s https://packagecloud.io/install/repositories/EventStore/EventStore-OSS/script.deb.sh | sudo bash
          sudo apt-get install -y eventstore-oss=23.10.8
          sudo systemctl stop eventstore || true
          sudo mkdir -p /tmp/esdb /tmp/esdb-log
          sudo chown eventstore:eventstore /tmp/esdb /tmp/esdb-log
          sudo mkdir -p /etc/systemd/system/eventstore.service.d
          printf '[Service]\nEnvironment="EVENTSTORE_DB=/tmp/esdb"\nEnvironment="EVENTSTORE_LOG=/tmp/esdb-log"\nEnvironment="EVENTSTORE_INSECURE=true"\nEnvironment="EVENTSTORE_RUN_PROJECTIONS=None"\nEnvironment="EVENTSTORE_UNSAFE_DISABLE_FLUSH_TO_DISK=true"\nEnvironment="EVENTSTORE_CLUSTER_SIZE=1"\nEnvironment="EVENTSTORE_MEM_DB=true"\n' \
            | sudo tee /etc/systemd/system/eventstore.service.d/bench.conf
          sudo systemctl daemon-reload
          sudo systemctl start eventstore
          echo "Waiting for EventStoreDB to be ready..."
          for i in $(seq 1 30); do
            curl -sf http://localhost:2113/health/live && break || sleep 2
          done
          ES_PID=$(systemctl show -p MainPID eventstore | cut -d= -f2)
          sudo renice -n -15 -p "$ES_PID"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-app/target
          key: event-sourcing-testbed-${{ runner.os }}-cargo-${{ hashFiles('rust-app/Cargo.lock') }}

      - name: Build benchmark binary
        run: cargo build --release --manifest-path rust-app/Cargo.toml

      - name: Run benchmark (MEM_DB, p99 < 5ms)
        run: |
          rust-app/target/release/testbed \
            --eventstore-url "esdb://localhost:2113?tls=false" \
            bench \
            --target-rate 10000 \
            --concurrency 64 \
            --batch-size 1 \
            --duration-secs 30 \
            --p99-limit-ms 5

  # ── Job 2: real storage on tmpfs, fsync off — tests full write pipeline ─────
  bench-disk:
    name: Bench — Real storage / tmpfs
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install EventStoreDB natively
        run: |
          curl -s https://packagecloud.io/install/repositories/EventStore/EventStore-OSS/script.deb.sh | sudo bash
          sudo apt-get install -y eventstore-oss=23.10.8
          sudo systemctl stop eventstore || true
          sudo mkdir -p /tmp/esdb /tmp/esdb-log
          sudo mount -t tmpfs -o size=512m tmpfs /tmp/esdb
          sudo chown eventstore:eventstore /tmp/esdb /tmp/esdb-log
          sudo mkdir -p /etc/systemd/system/eventstore.service.d
          printf '[Service]\nEnvironment="EVENTSTORE_DB=/tmp/esdb"\nEnvironment="EVENTSTORE_LOG=/tmp/esdb-log"\nEnvironment="EVENTSTORE_INSECURE=true"\nEnvironment="EVENTSTORE_RUN_PROJECTIONS=None"\nEnvironment="EVENTSTORE_UNSAFE_DISABLE_FLUSH_TO_DISK=true"\nEnvironment="EVENTSTORE_CLUSTER_SIZE=1"\n' \
            | sudo tee /etc/systemd/system/eventstore.service.d/bench.conf
          sudo systemctl daemon-reload
          sudo systemctl start eventstore
          echo "Waiting for EventStoreDB to be ready..."
          for i in $(seq 1 30); do
            curl -sf http://localhost:2113/health/live && break || sleep 2
          done
          ES_PID=$(systemctl show -p MainPID eventstore | cut -d= -f2)
          sudo renice -n -15 -p "$ES_PID"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-app/target
          key: event-sourcing-testbed-${{ runner.os }}-cargo-${{ hashFiles('rust-app/Cargo.lock') }}

      - name: Build benchmark binary
        run: cargo build --release --manifest-path rust-app/Cargo.toml

      - name: Run benchmark (real storage, p99 < 45ms)
        run: |
          rust-app/target/release/testbed \
            --eventstore-url "esdb://localhost:2113?tls=false" \
            bench \
            --target-rate 10000 \
            --concurrency 40 \
            --batch-size 1 \
            --duration-secs 30 \
            --p99-limit-ms 45

  # ── Job 3: Kubernetes 3-node cluster — real quorum writes + real disk ───────
  bench-k8s:
    name: Bench — Kubernetes 3-node cluster
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install k3d
        run: curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash

      - name: Create k3d cluster (1 server + 3 agents)
        run: |
          k3d cluster create testbed \
            --agents 3 \
            --wait \
            --timeout 120s

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-app/target
          key: event-sourcing-testbed-${{ runner.os }}-cargo-${{ hashFiles('rust-app/Cargo.lock') }}

      - name: Build benchmark binary
        run: cargo build --release --manifest-path rust-app/Cargo.toml

      - name: Pre-pull EventStoreDB image into k3d
        run: |
          docker pull eventstore/eventstore:23.10.0-jammy
          k3d image import eventstore/eventstore:23.10.0-jammy -c testbed

      - name: Deploy Kubernetes manifests
        run: |
          kubectl apply -f k8s/00-namespace.yaml
          kubectl apply -f k8s/01-storageclass.yaml
          kubectl apply -f k8s/02-eventstore/

      - name: Wait for EventStoreDB cluster to be ready
        run: |
          kubectl rollout status statefulset/eventstore \
            -n event-store \
            --timeout=600s

      - name: Dump pod diagnostics on failure
        if: failure()
        run: |
          echo "=== Pod status ==="
          kubectl get pods -n event-store -o wide
          echo "=== PVC status ==="
          kubectl get pvc -n event-store
          echo "=== Events ==="
          kubectl get events -n event-store --sort-by='.lastTimestamp' | tail -40
          echo "=== Pod descriptions ==="
          kubectl describe pods -n event-store
          echo "=== Logs (last 50 lines per pod) ==="
          for pod in $(kubectl get pods -n event-store -o name); do
            echo "--- $pod ---"
            kubectl logs "$pod" -n event-store --tail=50 2>&1 || true
          done

      - name: Run benchmark (Kubernetes, 3-node quorum writes)
        run: |
          kubectl port-forward -n event-store svc/eventstore 2113:2113 &
          PF_PID=$!
          sleep 3

          rust-app/target/release/testbed \
            --eventstore-url "esdb://localhost:2113?tls=false" \
            bench \
            --target-rate 10000 \
            --duration-secs 30 \
            --concurrency 50 \
            --batch-size 1

          kill $PF_PID 2>/dev/null || true
