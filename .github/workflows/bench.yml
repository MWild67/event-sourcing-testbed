            --mongodb-url 'mongodb://localhost:27017/?directConnection=true' \
            --memcached-url 'memcache://localhost:11211' \
            mongo-memcached \
            --seed-events 50000 --cache-size 500 --live-writes 500 \
            --database mcbench --json)
          echo "$RESULT"
          echo "$RESULT" > mdb-memcached-bench.json

      - name: Upload result
