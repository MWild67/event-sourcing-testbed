services:

  # ── EventStoreDB node 0 ────────────────────────────────────────────────────
  eventstore-0:
    image: docker.io/eventstore/eventstore:23.10.8-jammy
    container_name: eventstore-0
    environment:
      EVENTSTORE_CLUSTER_SIZE: 3
      EVENTSTORE_GOSSIP_SEED: "eventstore-1:2113,eventstore-2:2113"
      EVENTSTORE_CLUSTER_GOSSIP_PORT: 2113
      EVENTSTORE_DISCOVER_VIA_DNS: "false"
      EVENTSTORE_INSECURE: "true"
      EVENTSTORE_INT_IP: "0.0.0.0"
      EVENTSTORE_EXT_IP: "0.0.0.0"
      EVENTSTORE_HTTP_PORT: 2113
      EVENTSTORE_ADVERTISE_HOST_TO_CLIENT_AS: "localhost"
      EVENTSTORE_ADVERTISE_HTTP_PORT_TO_CLIENT_AS: 2113
      EVENTSTORE_RUN_PROJECTIONS: "None"
      EVENTSTORE_START_STANDARD_PROJECTIONS: "false"
      EVENTSTORE_ENABLE_ATOM_PUB_OVER_HTTP: "true"
      EVENTSTORE_UNSAFE_DISABLE_FLUSH_TO_DISK: "true"
      EVENTSTORE_DB: /data/db
      EVENTSTORE_LOG: /data/log
    tmpfs:
      - /data/db
      - /data/log
    ports:
      - "2113:2113"
    networks:
      - event-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2113/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── EventStoreDB node 1 ────────────────────────────────────────────────────
  eventstore-1:
    image: docker.io/eventstore/eventstore:23.10.8-jammy
    container_name: eventstore-1
    environment:
      EVENTSTORE_CLUSTER_SIZE: 3
      EVENTSTORE_GOSSIP_SEED: "eventstore-0:2113,eventstore-2:2113"
      EVENTSTORE_CLUSTER_GOSSIP_PORT: 2113
      EVENTSTORE_DISCOVER_VIA_DNS: "false"
      EVENTSTORE_INSECURE: "true"
      EVENTSTORE_INT_IP: "0.0.0.0"
      EVENTSTORE_EXT_IP: "0.0.0.0"
      EVENTSTORE_HTTP_PORT: 2113
      EVENTSTORE_ADVERTISE_HOST_TO_CLIENT_AS: "localhost"
      EVENTSTORE_ADVERTISE_HTTP_PORT_TO_CLIENT_AS: 2114
      EVENTSTORE_RUN_PROJECTIONS: "None"
      EVENTSTORE_START_STANDARD_PROJECTIONS: "false"
      EVENTSTORE_ENABLE_ATOM_PUB_OVER_HTTP: "true"
      EVENTSTORE_UNSAFE_DISABLE_FLUSH_TO_DISK: "true"
      EVENTSTORE_DB: /data/db
      EVENTSTORE_LOG: /data/log
    tmpfs:
      - /data/db
      - /data/log
    ports:
      - "2114:2113"
    networks:
      - event-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2113/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── EventStoreDB node 2 ────────────────────────────────────────────────────
  eventstore-2:
    image: docker.io/eventstore/eventstore:23.10.8-jammy
    container_name: eventstore-2
    environment:
      EVENTSTORE_CLUSTER_SIZE: 3
      EVENTSTORE_GOSSIP_SEED: "eventstore-0:2113,eventstore-1:2113"
      EVENTSTORE_CLUSTER_GOSSIP_PORT: 2113
      EVENTSTORE_DISCOVER_VIA_DNS: "false"
      EVENTSTORE_INSECURE: "true"
      EVENTSTORE_INT_IP: "0.0.0.0"
      EVENTSTORE_EXT_IP: "0.0.0.0"
      EVENTSTORE_HTTP_PORT: 2113
      EVENTSTORE_ADVERTISE_HOST_TO_CLIENT_AS: "localhost"
      EVENTSTORE_ADVERTISE_HTTP_PORT_TO_CLIENT_AS: 2115
      EVENTSTORE_RUN_PROJECTIONS: "None"
      EVENTSTORE_START_STANDARD_PROJECTIONS: "false"
      EVENTSTORE_ENABLE_ATOM_PUB_OVER_HTTP: "true"
      EVENTSTORE_UNSAFE_DISABLE_FLUSH_TO_DISK: "true"
      EVENTSTORE_DB: /data/db
      EVENTSTORE_LOG: /data/log
    tmpfs:
      - /data/db
      - /data/log
    ports:
      - "2115:2113"
    networks:
      - event-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2113/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── EventStoreDB single-node (benchmark only) ─────────────────────────────
  # Used by the local stress-test to eliminate 3-node quorum latency over the
  # Podman VM bridge network (adds ~100 ms per write on Windows).
  # Production/Kubernetes benchmarks use the 3-node cluster (real hardware).
  eventstore-bench:
    image: docker.io/eventstore/eventstore:23.10.8-jammy
    container_name: eventstore-bench
    environment:
      EVENTSTORE_CLUSTER_SIZE: 1
      EVENTSTORE_INSECURE: "true"
      EVENTSTORE_INT_IP: "0.0.0.0"
      EVENTSTORE_EXT_IP: "0.0.0.0"
      EVENTSTORE_HTTP_PORT: 2113
      EVENTSTORE_RUN_PROJECTIONS: "None"
      EVENTSTORE_START_STANDARD_PROJECTIONS: "false"
      EVENTSTORE_ENABLE_ATOM_PUB_OVER_HTTP: "true"
      EVENTSTORE_UNSAFE_DISABLE_FLUSH_TO_DISK: "true"
      EVENTSTORE_DB: /data/db
      EVENTSTORE_LOG: /data/log
      EVENTSTORE_INDEX: /data/index
    tmpfs:
      - /data/db
      - /data/log
      - /data/index
    ports:
      - "2116:2113"
    networks:
      - event-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2113/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── MongoDB single-node (event-sourcing benchmark) ────────────────────────
  # Intentionally single-node to match the eventstore-bench service and give a
  # fair apples-to-apples latency comparison.  journalCommitInterval is left at
  # its default (100 ms) to avoid artificially inflating performance.
  mongodb:
    image: docker.io/library/mongo:7
    container_name: mongodb
    environment:
      MONGO_INITDB_DATABASE: eventbench
    command:
      - mongod
      - --quiet
      - --bind_ip_all
      - --wiredTigerCacheSizeGB
      - "0.5"
    ports:
      - "27017:27017"
    tmpfs:
      - /data/db
    networks:
      - event-net
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "db.adminCommand('ping').ok",
          "mongodb://localhost:27017/admin",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── RabbitMQ ───────────────────────────────────────────────────────────────
  rabbitmq:
    image: docker.io/library/rabbitmq:3.13-management
    container_name: rabbitmq
    # Podman rootless workaround: pass the erlang cookie via ERL_FLAGS so the
    # erlang VM never tries to read/create ~/.erlang.cookie (which fails under
    # Podman rootless because chown to UID 999 is silently dropped, leaving the
    # file root-owned and unreadable by the rabbitmq process).
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      ERL_FLAGS: "-setcookie testbed_cookie"
    ports:
      - "5673:5672"       # 5672 in use by WSL; host port remapped to 5673
      - "15672:15672"     # Management UI
      - "15692:15692"     # Prometheus metrics
    tmpfs:
      - /var/lib/rabbitmq  # avoids Podman rootless named-volume UID issue
    networks:
      - event-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Prometheus ────────────────────────────────────────────────────────────
  prometheus:
    image: docker.io/prom/prometheus:v2.51.0
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - event-net

  # ── Grafana ───────────────────────────────────────────────────────────────
  grafana:
    image: docker.io/grafana/grafana:10.4.0
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - event-net
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:

networks:
  event-net:
    driver: bridge
    name: event-sourcing-testbed_event-net
