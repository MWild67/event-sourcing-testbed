global:
  scrape_interval: 15s

scrape_configs:

  - job_name: kurrentdb
    static_configs:
      - targets: ['kurrentdb-0:2113', 'kurrentdb-1:2113', 'kurrentdb-2:2113']
    metrics_path: /metrics

  - job_name: rabbitmq
    static_configs:
      - targets: ['rabbitmq:15692']
    metrics_path: /metrics
