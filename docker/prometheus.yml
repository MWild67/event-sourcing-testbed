global:
  scrape_interval: 15s

scrape_configs:

  - job_name: eventstore
    static_configs:
      - targets: ['eventstore-0:2113', 'eventstore-1:2113', 'eventstore-2:2113']
    metrics_path: /metrics

  - job_name: rabbitmq
    static_configs:
      - targets: ['rabbitmq:15692']
    metrics_path: /metrics
