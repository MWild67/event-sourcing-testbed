# ─────────────────────────────────────────────────────────────────────────────
# KurrentDB Services
#   - eventstore-headless  : pod-to-pod gossip / cluster DNS discovery
#   - eventstore           : client-facing load-balanced service
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: eventstore-headless
  namespace: event-store
  labels:
    app: eventstore
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: eventstore
  ports:
    - name: http-gossip
      port: 2113
      targetPort: 2113
    - name: grpc
      port: 2114
      targetPort: 2114

---
apiVersion: v1
kind: Service
metadata:
  name: eventstore
  namespace: event-store
  labels:
    app: eventstore
spec:
  type: ClusterIP
  selector:
    app: eventstore
  ports:
    - name: http
      port: 2113
      targetPort: 2113
    - name: grpc
      port: 2114
      targetPort: 2114
