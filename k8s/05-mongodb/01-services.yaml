# ─────────────────────────────────────────────────────────────────────────────
# MongoDB Services
#   - mongodb-headless  : pod-to-pod DNS for replica-set member addresses
#   - mongodb           : client-facing ClusterIP service (port 27017)
#
# A single-member replica set is required so that:
#   • Multi-document transactions work (Property 6 — no dual write)
#   • Change streams are available  (Property 4 — push-based subscriptions)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: mongodb-headless
  namespace: event-store
  labels:
    app: mongodb
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: mongodb
  ports:
    - name: mongo
      port: 27017
      targetPort: 27017

---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: event-store
  labels:
    app: mongodb
spec:
  type: ClusterIP
  selector:
    app: mongodb
  ports:
    - name: mongo
      port: 27017
      targetPort: 27017
