# ─────────────────────────────────────────────────────────────────────────────
# MongoDB ConfigMap — replica-set initialisation script
#
# The script starts mongod, waits until it accepts connections, then runs
# rs.initiate() so that multi-document transactions and change streams are
# available.  Both are required for the full event-store scenario:
#   • Transactions  → append_with_outbox (Property 6 — no dual write)
#   • Change Streams → catch_up_subscribe (Property 4 — push-based)
#
# rs.initiate() is idempotent: error code 23 (AlreadyInitialized) is silenced
# so rolling restarts and k8s readiness re-checks are safe.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: mongodb-init
  namespace: event-store
data:
  start.sh: |
    #!/bin/sh
    set -e

    POD_NAME="${POD_NAME:-mongodb-0}"
    POD_NAMESPACE="${POD_NAMESPACE:-event-store}"
    RS_HOST="${POD_NAME}.mongodb-headless.${POD_NAMESPACE}.svc.cluster.local:27017"

    # Launch mongod in the background.
    # --wiredTigerCacheSizeGB: keep RAM footprint low inside k3d nodes.
    # --replSet rs0: required for transactions and change streams.
    mongod \
      --bind_ip_all \
      --replSet rs0 \
      --dbpath /data/db \
      --wiredTigerCacheSizeGB 0.25 \
      --quiet &
    MONGOD_PID=$!

    # Wait until mongod is ready to accept connections.
    echo "Waiting for mongod to be ready..."
    until mongosh --quiet mongodb://127.0.0.1:27017/admin --eval "if (!db.adminCommand('ping').ok) throw 'not ready'" 2>/dev/null; do
      sleep 1
    done
    echo "mongod is ready."

    # Initialise the single-member replica set (idempotent).
    mongosh --quiet mongodb://127.0.0.1:27017/admin --eval "
      try {
        rs.initiate({
          _id: 'rs0',
          members: [{ _id: 0, host: '${RS_HOST}' }]
        });
        print('Replica set rs0 initialized.');
      } catch (e) {
        if (e.code === 23) {
          print('Replica set already initialized — skipping.');
        } else {
          throw e;
        }
      }
    "

    # Hand control back to mongod so the container stays alive.
    wait $MONGOD_PID

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: event-store
  labels:
    app: mongodb
spec:
  serviceName: mongodb-headless
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: mongodb
      annotations:
        # Prometheus scraping via mongodb_exporter on :9216 would require a
        # sidecar; annotate the pod anyway so the scrape job can be added later.
        prometheus.io/scrape: "false"
    spec:
      terminationGracePeriodSeconds: 30
      enableServiceLinks: false
      containers:
        - name: mongodb
          image: mongo:7
          imagePullPolicy: IfNotPresent
          # Run via the init script so replica-set initialisation happens
          # before the container is marked ready.
          command: ["/bin/sh", "/scripts/start.sh"]
          ports:
            - name: mongo
              containerPort: 27017
          env:
            # Disable the telemetry free-monitoring prompt — keeps logs clean.
            - name: MONGO_INITDB_DATABASE
              value: "eventbench"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "mongosh --quiet mongodb://127.0.0.1:27017/admin --eval \"if (!db.adminCommand('ping').ok) throw 'dead'\""
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                # Verify mongod is ready AND replica set is initialized.
                # The exporter sidecar requires rs to be initialized to connect with replicaSet=rs0.
                - "mongosh --quiet mongodb://127.0.0.1:27017/admin --eval \"if (!db.adminCommand('ping').ok) throw 'no ping'; if (rs.status().ok !== 1) throw 'rs not initialized'\""
            initialDelaySeconds: 45
            periodSeconds: 5
            failureThreshold: 12
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "1Gi"
          volumeMounts:
            - name: data
              mountPath: /data/db
            - name: scripts
              mountPath: /scripts
              readOnly: true
        - name: mongodb-exporter
          image: percona/mongodb_exporter:0.43.1
          imagePullPolicy: IfNotPresent
          env:
            - name: MONGODB_URI
              value: mongodb://127.0.0.1:27017/admin?directConnection=true
          ports:
            - name: mongo-metrics
              containerPort: 9216
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9216
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /metrics
              port: 9216
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
      volumes:
        - name: scripts
          configMap:
            name: mongodb-init
            defaultMode: 0755
        # emptyDir Memory (tmpfs) keeps durability at the same OS-buffer level
        # as the Docker benchmark job (--tmpfs /data/db + j:true write concern).
        # On tmpfs, WiredTiger's fdatasync() is a no-op — no backing disk.
        # This is the only way to align MongoDB with KurrentDB/PostgreSQL, which
        # use UNSAFE_DISABLE_FLUSH_TO_DISK and fsync=off respectively.
        - name: data
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
