# ─────────────────────────────────────────────────────────────────────────────
# KurrentDB Services
#   - kurrentdb-headless  : pod-to-pod gossip / cluster DNS discovery
#   - kurrentdb           : client-facing load-balanced service
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: kurrentdb-headless
  namespace: event-store
  labels:
    app: kurrentdb
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: kurrentdb
  ports:
    - name: http-gossip
      port: 2113
      targetPort: 2113
    - name: grpc
      port: 2114
      targetPort: 2114

---
apiVersion: v1
kind: Service
metadata:
  name: kurrentdb
  namespace: event-store
  labels:
    app: kurrentdb
spec:
  type: ClusterIP
  selector:
    app: kurrentdb
  ports:
    - name: http
      port: 2113
      targetPort: 2113
    - name: grpc
      port: 2114
      targetPort: 2114
