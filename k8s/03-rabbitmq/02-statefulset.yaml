apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-config
  namespace: event-store
data:
  # Enable the Prometheus metrics plugin so Prometheus can scrape /metrics
  enabled_plugins: |
    [rabbitmq_management,rabbitmq_prometheus,rabbitmq_peer_discovery_k8s].
  rabbitmq.conf: |
    ## Clustering via Kubernetes peer discovery
    cluster_formation.peer_discovery_backend  = rabbit_peer_discovery_k8s
    cluster_formation.k8s.host                = kubernetes.default.svc.cluster.local
    cluster_formation.k8s.address_type        = hostname
    cluster_formation.k8s.service_name        = rabbitmq-headless
    cluster_formation.k8s.hostname_suffix     = .rabbitmq-headless.event-store.svc.cluster.local
    cluster_formation.node_cleanup.interval   = 30
    cluster_formation.node_cleanup.only_log_warning = false
    cluster_partition_handling                = autoheal

    ## Credentials (override in production with Secrets)
    default_user = guest
    default_pass = guest

    ## Memory watermark — avoid OOM kills during benchmark
    vm_memory_high_watermark.relative = 0.7

    ## Prometheus metrics port
    prometheus.tcp.port = 15692

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rabbitmq
  namespace: event-store

---
# RabbitMQ needs read access to Endpoints for peer discovery
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rabbitmq-peer-discovery
  namespace: event-store
rules:
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rabbitmq-peer-discovery
  namespace: event-store
subjects:
  - kind: ServiceAccount
    name: rabbitmq
    namespace: event-store
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rabbitmq-peer-discovery

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: event-store
  labels:
    app: rabbitmq
spec:
  serviceName: rabbitmq-headless
  replicas: 3
  selector:
    matchLabels:
      app: rabbitmq
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: rabbitmq
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "15692"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: rabbitmq
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: rabbitmq
      terminationGracePeriodSeconds: 60
      initContainers:
        # Derive the Erlang cookie from a stable source; share across all pods.
        - name: init-cookie
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "event-sourcing-testbed-erlang-cookie" > /var/lib/rabbitmq/.erlang.cookie
              chmod 600 /var/lib/rabbitmq/.erlang.cookie
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management
          imagePullPolicy: IfNotPresent
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
            - name: prometheus
              containerPort: 15692
            - name: epmd
              containerPort: 4369
            - name: inter-node
              containerPort: 25672
          env:
            - name: RABBITMQ_USE_LONGNAME
              value: "true"
            - name: K8S_SERVICE_NAME
              value: rabbitmq-headless
            - name: K8S_HOSTNAME_SUFFIX
              value: ".rabbitmq-headless.event-store.svc.cluster.local"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: RABBITMQ_NODENAME
              value: "rabbit@$(POD_NAME).rabbitmq-headless.event-store.svc.cluster.local"
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 4
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "check_running"]
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          volumeMounts:
            - name: config
              mountPath: /etc/rabbitmq
            - name: data
              mountPath: /var/lib/rabbitmq
      volumes:
        - name: config
          configMap:
            name: rabbitmq-config
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app: rabbitmq
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: event-store-local
        resources:
          requests:
            storage: 5Gi
