apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: event-store
spec:
  serviceName: postgres-headless
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          # Tune PostgreSQL for CI benchmark performance:
          #   synchronous_commit=off  — WAL is flushed asynchronously (no per-commit fsync)
          #   fsync=off               — checkpoint pages are not fsynced to disk
          #   full_page_writes=off    — skips writing full pages to WAL after checkpoint
          # These settings maximise throughput on tmpfs-backed storage.
          #
          # NOTE: use `args:` (not `command:`) so the image ENTRYPOINT
          # (docker-entrypoint.sh) still runs to initialise the data directory.
          # `command:` would replace the entrypoint, leaving an uninitialised
          # emptyDir and causing the pod to crash-loop.
          args:
            - postgres
            - -c
            - synchronous_commit=off
            - -c
            - fsync=off
            - -c
            - full_page_writes=off
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: eventbench
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U postgres -d eventbench
            initialDelaySeconds: 5
            periodSeconds: 3
            failureThreshold: 20
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U postgres
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        # Use an in-memory emptyDir instead of a PVC so the benchmark sees
        # tmpfs speeds (matching the Docker bench job) and avoids disk I/O
        # stalls that cause periodic connection failures over port-forward.
        - name: postgres-data
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
  # No volumeClaimTemplates — storage provided by the emptyDir above.
