apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: event-store
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        url: http://prometheus.event-store.svc.cluster.local:9090
        access: proxy
        isDefault: true
        editable: false
        jsonData:
          timeInterval: 15s
